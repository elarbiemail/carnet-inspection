plugins {
    id 'com.android.application'
}

android {
    namespace 'net.fm6education.carnetinspection'
    compileSdk 34

    defaultConfig {
        applicationId "net.fm6education.carnetinspection"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Trusted Web Activity : ouvre l'application dans Chrome (Custom Tabs) sans
    // barre d'adresse, plutôt que dans une WebView embarquée. C'est indispensable
    // ici car la connexion Google Drive (Google Identity Services) refuse de
    // fonctionner dans une WebView classique (elle exige un vrai navigateur).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core:1.13.1'
}
