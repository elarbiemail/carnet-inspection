plugins {
    id 'com.android.application'
}

android {
    namespace 'net.fm6education.carnetinspection'
    compileSdk 36

    defaultConfig {
        applicationId "net.fm6education.carnetinspection"
        minSdkVersion 23
        targetSdkVersion 35
        // Numéro de version fourni par la compilation automatique (GitHub Actions : numéro
        // d'exécution), pour que chaque nouvel APK s'installe par-dessus le précédent.
        versionCode (project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1)
        versionName (project.hasProperty('versionCode') ? "1." + project.property('versionCode') : "1.0")
    }

    // Clé de signature fixe (dossier keystore/) : tous les APK produits portent la même
    // signature, condition pour pouvoir installer une mise à jour sans désinstaller.
    signingConfigs {
        release {
            storeFile file('../keystore/carnet-inspection.jks')
            storePassword 'carnet2026'
            keyAlias 'carnet'
            keyPassword 'carnet2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Trusted Web Activity : ouvre l'application dans Chrome (Custom Tabs) sans
    // barre d'adresse, plutôt que dans une WebView embarquée. C'est indispensable
    // ici car la connexion Google Drive (Google Identity Services) refuse de
    // fonctionner dans une WebView classique (elle exige un vrai navigateur).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    implementation 'androidx.core:core:1.13.1'
}
