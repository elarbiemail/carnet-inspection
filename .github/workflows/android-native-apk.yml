# Compile l'application Android NATIVE (Kotlin / Jetpack Compose, dossier android-native/)
# et publie l'APK dans apk/carnet-inspection-natif.apk (servi par GitHub Pages).
name: APK Android natif

on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-native-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt && rm -rf "$SDK/cmdline-tools/latest" && mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android-native/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compiler l'APK natif
        working-directory: android-native
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Publier l'APK dans apk/
        run: |
          mkdir -p apk
          cp android-native/app/build/outputs/apk/release/app-release.apk apk/carnet-inspection-natif.apk
          printf '{"versionCode": %s, "versionName": "2.%s", "date": "%s", "commit": "%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::7}" > apk/version-natif.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/carnet-inspection-natif.apk apk/version-natif.json
          git commit -m "APK Android natif 2.${{ github.run_number }} [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
