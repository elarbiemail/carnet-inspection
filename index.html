<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet d'Inspection</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F6F62">
<meta name="application-name" content="Carnet Inspection">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet Inspection">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<script>
  /* Apparence choisie sur cet appareil (Paramètres → Apparence), appliquée avant l'affichage pour
     éviter un flash : « futur » (thème futuriste, par défaut) ou « classique ». */
  window.SKIN_META = { futur:'#070B16', classique:'#2F6F62', oasis:'#F3ECDF', majorelle:'#4A3FD1', aurore:'#FBF6FB', nuit:'#0E131D', sahara:'#1B1510', contraste:'#FFFFFF' };
  window.applyLook = function(k, look){
    var h = document.documentElement;
    if(!window.SKIN_META[k]) k = 'futur';
    h.setAttribute('data-skin', k);
    look = look || {};
    if(k==='classique' && (look.mode==='light' || look.mode==='dark')) h.setAttribute('data-theme', look.mode); else h.removeAttribute('data-theme');
    ['textsize','density','corners','motion'].forEach(function(a){ if(look[a]) h.setAttribute('data-'+a, look[a]); else h.removeAttribute('data-'+a); });
    if(look.accent){
      h.style.setProperty('--accent', look.accent);
      h.style.setProperty('--accent-soft', 'color-mix(in srgb, '+look.accent+' 16%, transparent)');
      var c = look.accent.replace('#',''); var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
      h.style.setProperty('--accent-ink', (0.299*r+0.587*g+0.114*b) > 150 ? '#111111' : '#FFFFFF');
      h.style.setProperty('--glow-a', look.accent);
    } else { ['--accent','--accent-soft','--accent-ink','--glow-a'].forEach(function(v){ h.style.removeProperty(v); }); }
    if(look.uifont){ h.style.setProperty('--font-ui', look.uifont); h.style.setProperty('--font-display', look.uifont); }
    else { h.style.removeProperty('--font-ui'); h.style.removeProperty('--font-display'); }
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', look.accent && k!=='futur' ? look.accent : window.SKIN_META[k]);
  };
  (function(){ var k = 'futur', look = {}; try{ k = localStorage.getItem('ci_skin') || 'futur'; look = JSON.parse(localStorage.getItem('ci_look') || '{}') || {}; }catch(e){}
    window.applyLook(k, look); })();
</script>
<style>
  :root{
    --bg:#F6F4EE; --surface:#FFFFFF; --surface-2:#FBF9F4;
    --ink:#1E2A3A; --ink-soft:#5B6675; --ink-faint:#8B94A0;
    --line:#DDD7C8; --line-soft:#E9E4D8;
    --accent:#2F6F62; --accent-ink:#FFFFFF; --accent-soft:#E4EEEA;
    --warn:#B5762A; --warn-soft:#F5E9D8;
    --danger:#B14A3D; --danger-soft:#F6E3DF;
    --done:#3F7D53; --done-soft:#E3EFE4;
    --violet:#5B5A9C; --violet-soft:#E7E6F2;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(30,42,58,.07), 0 6px 20px rgba(30,42,58,.07);
    --font-ui:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161C24; --surface:#1E2530; --surface-2:#232B37;
      --ink:#EDEBE3; --ink-soft:#A8AFB8; --ink-faint:#77808C;
      --line:#303947; --line-soft:#2A3240;
      --accent:#6FB3A2; --accent-ink:#0E1A17; --accent-soft:#223834;
      --warn:#D69B57; --warn-soft:#3A2E1D;
      --danger:#D97C6C; --danger-soft:#3B2420;
      --done:#7BC090; --done-soft:#1F3123;
      --violet:#9C9BE0; --violet-soft:#2A2A45;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161C24; --surface:#1E2530; --surface-2:#232B37;
    --ink:#EDEBE3; --ink-soft:#A8AFB8; --ink-faint:#77808C;
    --line:#303947; --line-soft:#2A3240;
    --accent:#6FB3A2; --accent-ink:#0E1A17; --accent-soft:#223834;
    --warn:#D69B57; --warn-soft:#3A2E1D;
    --danger:#D97C6C; --danger-soft:#3B2420;
    --done:#7BC090; --done-soft:#1F3123;
    --violet:#9C9BE0; --violet-soft:#2A2A45;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); font-size:15px; line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  [hidden]{display:none!important;}
  img{max-width:100%;}
  button, input, textarea, select{ font-family:inherit; font-size:inherit; color:inherit; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  .tnum{ font-variant-numeric:tabular-nums; }

  #app{ max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  /* --- Topbar --- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--bg); border-bottom:1px solid var(--line);
    padding:14px 16px 10px;
  }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ display:flex; align-items:center; gap:9px; min-width:0; }
  .brand-mark{ width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand h1{ font-size:17px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
  .topbar-actions{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .icon-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid transparent;
    background:transparent; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-soft); transition:background .15s; flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn:active{ background:var(--line-soft); }
  .icon-btn.spin svg{ animation:spin 1s linear infinite; }
  .icon-btn[disabled]{ opacity:.4; cursor:default; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ .icon-btn.spin svg{ animation:none; } }

  .topbar-left{ display:flex; align-items:center; gap:4px; min-width:0; }

  .syncbar{ display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--ink-faint); }
  .syncbar .dot{ width:6px; height:6px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .syncbar .dot.ok{ background:var(--done); }
  .syncbar .dot.err{ background:var(--danger); }
  .syncbar-link{ background:none; border:none; padding:0; color:var(--accent); font-weight:600; font-size:12px; cursor:pointer; }

  /* --- Main / views --- */
  main{ flex:1; padding:14px 16px calc(152px + env(safe-area-inset-bottom,0px)); }
  .view{ display:flex; flex-direction:column; gap:12px; }

  /* --- Sidebar --- */
  .sidebar-backdrop{ position:fixed; inset:0; background:rgba(20,24,30,.44); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s; }
  .sidebar-backdrop.open{ opacity:1; pointer-events:auto; }
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; width:284px; max-width:84vw; background:var(--surface);
    z-index:41; transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 34px rgba(0,0,0,.18);
    display:flex; flex-direction:column; padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding:0 4px; }
  .side-nav{ display:flex; flex-direction:column; gap:2px; }
  .side-nav button{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; border:none; background:none;
    color:var(--ink-soft); font-weight:600; font-size:13.5px; cursor:pointer; text-align:left; width:100%; }
  .side-nav button svg{ flex-shrink:0; }
  .side-nav button[aria-current="true"]{ background:var(--accent-soft); color:var(--accent); }
  .side-divider{ height:1px; background:var(--line-soft); margin:12px 4px; }
  .side-section-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:0 12px; margin-bottom:4px; }
  .side-foot{ margin-top:auto; padding:12px 12px 2px; font-size:11px; color:var(--ink-faint); border-top:1px solid var(--line-soft); line-height:1.5; }

  /* --- Bottom tab bar --- */
  .bottom-tabs{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:640px; z-index:21;
    background:var(--surface); border-top:1px solid var(--line); display:flex;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .bottom-tabs .bt-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:8px 2px 7px; border:none; background:none; color:var(--ink-faint); font-size:10px; font-weight:600; cursor:pointer;
  }
  .bottom-tabs .bt-item[aria-current="true"]{ color:var(--accent); }
  .bottom-tabs .bt-item svg{ flex-shrink:0; }

  .banner{ border-radius:var(--radius-sm); padding:11px 13px; font-size:13px; display:flex; gap:9px; align-items:flex-start; }
  .banner svg{ flex-shrink:0; margin-top:1px; }
  .banner.warn{ background:var(--warn-soft); color:var(--warn); }
  .banner.err{ background:var(--danger-soft); color:var(--danger); }
  .banner.info{ background:var(--accent-soft); color:var(--accent); }
  .banner-actions{ margin-top:6px; display:flex; gap:8px; }
  .banner a, .banner-actions button{ font-weight:700; }

  .setup-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow);
  }
  .setup-card h2{ font-size:15.5px; margin-bottom:4px; }
  .setup-card p{ color:var(--ink-soft); font-size:13px; margin:0 0 12px; }
  .setup-actions{ display:flex; flex-wrap:wrap; gap:8px; }

  .preview-card{ opacity:.55; filter:saturate(.6); pointer-events:none; }
  .preview-tag{
    position:absolute; top:10px; right:10px; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-faint); background:var(--surface-2); padding:3px 7px; border-radius:99px;
  }

  .stats-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .stat{
    flex:1; min-width:78px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 10px;
  }
  .stat b{ display:block; font-size:19px; font-family:var(--font-mono); }
  .stat span{ font-size:11px; color:var(--ink-soft); }

  .chips{ display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; }
  .chip{
    flex-shrink:0; padding:6px 13px; border-radius:99px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .task-list{ display:flex; flex-direction:column; gap:9px; }
  .task-card{
    position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 13px 12px 15px; cursor:pointer; display:flex; flex-direction:column; gap:7px;
    box-shadow:var(--shadow);
  }
  .task-card::before{
    content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:3px;
    background:var(--prio,var(--line));
  }
  .task-card.done{ opacity:.62; }
  .task-title{ font-weight:600; font-size:14.5px; text-wrap:balance; }
  .task-title.strike{ text-decoration:line-through; text-decoration-color:var(--ink-faint); }
  .task-meta{ font-size:12px; color:var(--ink-soft); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .type-badge{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:2px 7px; border-radius:5px; }
  .type-badge.violet{ background:var(--violet-soft); color:var(--violet); }
  .type-badge.accent{ background:var(--accent-soft); color:var(--accent); }
  .type-badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .type-badge.neutral{ background:var(--surface-2); color:var(--ink-soft); }
  .task-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .pill{
    display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:99px; font-size:11.5px; font-weight:700;
    border:none; cursor:pointer;
  }
  .pill.wf-a_planifier{ background:var(--surface-2); color:var(--ink-soft); }
  .pill.wf-planifiee{ background:var(--accent-soft); color:var(--accent); }
  .pill.wf-realisee{ background:var(--violet-soft); color:var(--violet); }
  .pill.wf-rapport{ background:var(--warn-soft); color:var(--warn); }
  .pill.wf-cloturee{ background:var(--done-soft); color:var(--done); }
  .due-chip{ font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono); }
  .due-chip.late{ color:var(--danger); font-weight:700; }
  .due-chip.vacance{ color:var(--warn); font-weight:700; }
  .doc-chip{
    display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--accent); font-weight:600;
    background:none; border:none; padding:0; cursor:pointer; max-width:200px;
  }
  .doc-chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .empty{ text-align:center; padding:30px 10px; color:var(--ink-faint); font-size:13px; }

  /* --- stepper --- */
  .stepper{ display:flex; gap:5px; overflow-x:auto; padding:2px 0 6px; }
  .step{ flex-shrink:0; display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:99px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink-faint); font-size:11.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .step .n{ width:16px; height:16px; border-radius:50%; background:var(--line); color:var(--surface); display:flex; align-items:center;
    justify-content:center; font-size:9.5px; flex-shrink:0; }
  .step.done{ border-color:var(--done); color:var(--done); background:var(--done-soft); }
  .step.done .n{ background:var(--done); }
  .step.current{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .step.current .n{ background:var(--accent); }

  /* --- Rows: generic list (enseignants / etablissements / documents) --- */
  .rec-list{ display:flex; flex-direction:column; gap:8px; }
  .rec-row{ display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:10px 11px; cursor:pointer; }
  .avatar{ width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13.5px; overflow:hidden; }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .rec-info{ flex:1; min-width:0; }
  .rec-info .t{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec-info .s{ font-size:11.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec-actions{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .zone-head{ font-size:12px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;
    margin:6px 0 -2px; display:flex; align-items:center; gap:8px; }
  .zone-head .line{ flex:1; height:1px; background:var(--line-soft); }

  /* --- Documents view (Drive) --- */
  .search-row{ display:flex; gap:8px; }
  .search-row input{
    flex:1; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-sm);
    padding:10px 12px; color:var(--ink);
  }
  .search-row button{
    border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-sm); padding:0 13px;
    color:var(--ink-soft); cursor:pointer;
  }
  .doc-list{ display:flex; flex-direction:column; gap:7px; }
  .doc-row{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:9px 10px;
  }
  .doc-ico{ width:34px; height:34px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center;
    justify-content:center; color:var(--ink-soft); flex-shrink:0; }
  .doc-info{ flex:1; min-width:0; }
  .doc-info .t{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .doc-info .s{ font-size:11px; color:var(--ink-faint); }
  .doc-actions{ display:flex; gap:2px; flex-shrink:0; }
  .section-label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); }

  /* --- Bilan --- */
  .bar-row{ display:flex; align-items:center; gap:9px; font-size:12.5px; }
  .bar-row .l{ width:118px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft); }
  .bar-track{ flex:1; height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:5px; background:var(--accent); }
  .bar-row .v{ width:26px; text-align:right; flex-shrink:0; font-family:var(--font-mono); font-size:12px; }
  .period-seg{ display:flex; gap:6px; overflow-x:auto; }
  .period-seg button{ flex-shrink:0; padding:7px 12px; border-radius:99px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); font-weight:600; font-size:12.5px; cursor:pointer; }
  .period-seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  /* --- Accueil (tableau de bord) --- */
  .home-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .home-head h2{ font-size:15.5px; }
  .home-head a{ font-size:12px; font-weight:700; color:var(--accent); cursor:pointer; white-space:nowrap; }
  .carousel{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity; margin:0 -1px; }
  .carousel-card{
    flex-shrink:0; width:128px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center;
    scroll-snap-align:start;
  }
  .carousel-card .avatar{ width:50px; height:50px; font-size:16px; }
  .carousel-card .t{ font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%; }
  .carousel-card .s{ font-size:10.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%; }
  .activity-list{ display:flex; flex-direction:column; }
  .activity-row{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line-soft); cursor:pointer; }
  .activity-row:last-child{ border-bottom:none; }
  .activity-ico{ width:30px; height:30px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center;
    justify-content:center; color:var(--ink-soft); flex-shrink:0; }
  .activity-info{ flex:1; min-width:0; }
  .activity-info .t{ font-size:12.5px; line-height:1.35; }
  .activity-info .s{ font-size:11px; color:var(--ink-faint); margin-top:1px; }

  /* --- FAB --- */
  .fab{
    position:fixed; right:calc(50% - 320px + 20px); bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:25;
    width:54px; height:54px; border-radius:16px; background:var(--accent); color:var(--accent-ink);

    cursor:pointer;
  }
  @media (max-width:680px){ .fab{ right:20px; } }

  /* --- Overlays / modals --- */
  .overlay{
    position:fixed; inset:0; z-index:50; background:rgba(20,24,30,.44);

  }

<script>
(function(){
  "use strict";

  /* ================= helpers ================= */
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); };

  /* ================= écran public « fiche à distance » =================
     Si l'URL contient #fiche=1 (lien généré par openFicheLinkModal(), voir plus bas), on affiche
     UNIQUEMENT ce mini-formulaire public autonome (aucune donnée locale de l'app, aucune connexion
     Drive/Gemini requise) au lieu de démarrer l'application normalement : un(e) enseignant(e) qui
     reçoit ce lien peut ainsi compléter sa fiche personnelle sur son propre téléphone puis renvoyer ses
     informations à l'inspecteur(trice) (WhatsApp/email) en un tap, sans jamais installer l'app ni se
     connecter à quoi que ce soit. Le fragment (#...) n'étant jamais envoyé au réseau ni pris en compte
     par le cache du service worker (qui ne voit que l'URL sans fragment, voir sw.js), ce lien continue
     de fonctionner même une fois l'app mise en cache hors-ligne. Ce bloc doit rester APRÈS $/esc
     (utilisés par renderPublicFichePage) mais avant tout le reste : en cas de correspondance, on quitte
     l'IIFE avec `return` avant que le reste de l'application (état, rendu, synchronisation…) ne démarre. */
  (function(){
    var h = String(location.hash||'');
    if(h.indexOf('fiche=1')===-1) return;
    var qp; try{ qp = new URLSearchParams(h.replace(/^#/,'')); }catch(e){ qp = null; }
    if(qp) renderPublicFichePage(qp);

  if(String(location.hash||'').indexOf('fiche=1')!==-1) return;

  var uid = function(){ return (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2); };
  var nowIso = function(){ return new Date().toISOString(); };
  var todayStr = function(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  function fmtDate(iso){
    if(!iso) return '';
    var d = new Date(iso.length<=10 ? iso+'T00:00:00' : iso);
    if(isNaN(d)) return '';
    var dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0');
    return dd+'/'+mm+'/'+d.getFullYear();
  }
  function fmtWhen(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d)) return '';
    var diff = (Date.now()-d.getTime())/1000;
    if(diff < 60) return "à l'instant";
    if(diff < 3600) return Math.floor(diff/60)+' min';
    if(diff < 86400) return Math.floor(diff/3600)+' h';

  }

    if(!iso || statut==='cloturee') return false;

  }

     Limite assumée (application 100% autonome, sans serveur ni service de push — voir plus haut) : ces
     alertes ne peuvent se déclencher QUE pendant que l'application reste ouverte (premier plan ou
     arrière-plan récent d'un onglet/PWA encore chargé(e)), jamais lorsqu'elle est totalement fermée.
     L'affichage passe par le service worker (ServiceWorkerRegistration.showNotification), seule méthode
     fiable sur Android/PWA installée — le constructeur Notification() direct y est souvent silencieux

  function localDateISO(d){
    d = d || new Date();
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');

  function notifSeenAdd(key){

      if(seen.indexOf(key)===-1){

  /* Parcourt les tâches non clôturées : avec une heure de début précise, prévient une seule fois dans

     jour même de l'échéance. Appelée au démarrage, périodiquement et au retour au premier plan — voir
     start(). */
  function checkImminentTaskNotifications(){
    if(notifPermission()!=='granted') return;
    var leadMin = Number(state.config.notifLeadMinutes)>0 ? Number(state.config.notifLeadMinutes) : 60;
    var now = Date.now(), seen = notifSeenGet(), todayKey = localDateISO();
    state.tasks.forEach(function(t){
      if(t.statut==='cloturee') return;
      var start = taskStartDateTime(t);
      if(!start) return;
      var lieuTxt = t.lieu || t.etablissementNom || '';
      if(t.heureDebut){
        var diffMin = (start.getTime()-now)/60000;
        var key = 'h:'+t.id+':'+t.echeance+':'+t.heureDebut;
        if(diffMin>=0 && diffMin<=leadMin && seen.indexOf(key)===-1){
          var when = t.heureDebut+(t.heureFin?'–'+t.heureFin:'');
          showTaskNotification(t, 'Aujourd\'hui à '+when+(lieuTxt?' · '+lieuTxt:''));
          notifSeenAdd(key);
        }
      } else if(t.echeance===todayKey){
        var key2 = 'd:'+t.id+':'+t.echeance;
        if(seen.indexOf(key2)===-1){
          showTaskNotification(t, "Aujourd'hui"+(lieuTxt?' · '+lieuTxt:''));
          notifSeenAdd(key2);

     déclenché dès que son début se situe dans la fenêtre [aujourd'hui ; +délai réglé, 7 jours par
     défaut] — pas de répétition une fois le rappel envoyé pour cette période (voir notifSeenAdd). */
  function checkUpcomingVacancesNotifications(){
    if(notifPermission()!=='granted') return;
    var leadDays = Number(state.config.vacanceLeadDays)>0 ? Number(state.config.vacanceLeadDays) : 7;
    var today = localDateISO(), seen = notifSeenGet();
    var todayMs = new Date(today+'T00:00').getTime();
    state.vacances.forEach(function(v){
      if(!v.dateDebut) return;
      var startMs = new Date(v.dateDebut+'T00:00').getTime();
      if(isNaN(startMs)) return;
      var diffDays = Math.round((startMs-todayMs)/86400000);
      var key = 'vac:'+v.id+':'+v.dateDebut;
      if(diffDays>=0 && diffDays<=leadDays && seen.indexOf(key)===-1){
        var when = diffDays===0 ? "commencent aujourd'hui" : 'commencent dans '+diffDays+' jour'+(diffDays>1?'s':'')+' (le '+fmtDate(v.dateDebut)+')';

  /* Appel téléphonique et message WhatsApp : liens directs (tel:, wa.me) sans dépendance externe.

  function telDigits(tel){

  /* ================= CSV ================= */
  function csvField(v){
    var s = (v==null?'':String(v));
    if(/[",\n\r]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function parseCSV(text){
    var rows = [], row = [], field = '', inQ = false;
    for(var i=0;i<text.length;i++){
      var c = text[i];
      if(inQ){
        if(c === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
        else field += c;
      } else {
        if(c === '"') inQ = true;
        else if(c === ',') { row.push(field); field=''; }
        else if(c === '\r') { /* skip */ }
        else if(c === '\n') { row.push(field); rows.push(row); row=[]; field=''; }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length>1 || (r[0]||'').trim()!==''; });
  }
  function objectsToCSV(headers, objs){
    var lines = [headers.map(csvField).join(',')];
    objs.forEach(function(o){ lines.push(headers.map(function(h){ return csvField(o[h]); }).join(',')); });
    return lines.join('\r\n');
  }
  function csvToObjects(text){
    var rows = parseCSV(text);
    if(!rows.length) return [];
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var out = [];
    for(var i=1;i<rows.length;i++){
      var r = rows[i], o = {};
      header.forEach(function(h,idx){ o[h] = r[idx]!=null ? r[idx] : ''; });
      out.push(o);
    }
    return out;
  }
  /* ================= import des périodes de vacances (voir Réglages → Vacances) =================
     Trois formats reconnus, choisis pour couvrir les quatre sources demandées (saisie manuelle à part,
     voir btnAddVacance) sans dépendance externe ni backend :
       - CSV (colonnes nom/debut/fin, ou dateDebut/dateFin — voir importVacancesCSV) ;
       - un flux iCalendar (.ics) — c'est le format qu'exporte tout agenda Google (« Paramètres de
         l'agenda » → « Adresse secrète/publique au format iCal ») aussi bien que la plupart des agendas
         scolaires publics ;
       - un tableau JSON (toute « API » qui renvoie une liste d'objets {nom, dateDebut, dateFin} ou noms
         de champs approchants).
     parseVacancesFeed() détecte le format automatiquement ; fetchVacancesFromUrl() tente une récupération
     directe puis, en cas d'échec réseau — en pratique quasi systématique pour calendar.google.com, dont
     les liens iCal n'autorisent pas les requêtes cross-origin depuis un navigateur (CORS) —, invite à
     coller le contenu récupéré autrement dans la zone de texte de repli. */
  function icsUnescape(s){
    return String(s||'').replace(/\\n/gi,' ').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
  }
  function icsDateToIso(v){
    var m = /^(\d{4})(\d{2})(\d{2})/.exec(String(v||'').trim());
    return m ? (m[1]+'-'+m[2]+'-'+m[3]) : '';
  }
  function parseICS(text){
    var unfolded = String(text||'').replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'');
    var blocks = unfolded.split(/BEGIN:VEVENT/i).slice(1);
    var out = [];
    blocks.forEach(function(b){
      var end = b.search(/END:VEVENT/i); if(end!==-1) b = b.slice(0, end);
      var summary = (/^SUMMARY[^:]*:(.*)$/mi.exec(b)||[])[1] || '';
      var dtstartLine = (/^DTSTART([^:]*):(.*)$/mi.exec(b)||[]);
      var dtendLine = (/^DTEND([^:]*):(.*)$/mi.exec(b)||[]);
      var isAllDay = /VALUE=DATE/i.test(dtstartLine[1]||'');
      var debut = icsDateToIso(dtstartLine[2]);
      var finRaw = icsDateToIso(dtendLine[2]);
      var fin = finRaw || debut;
      /* DTEND d'un évènement « journée entière » est EXCLUSIF dans la norme iCalendar (le lendemain du
         dernier jour) : on retranche un jour pour rejoindre notre propre convention (dateFin incluse). */
      if(isAllDay && finRaw){
        var fd = new Date(finRaw+'T00:00:00'); fd.setDate(fd.getDate()-1);
        fin = localDateISO(fd);
      }
      if(debut) out.push({nom: icsUnescape(summary).trim() || 'Vacances', dateDebut: debut, dateFin: fin});
    });
    return out;
  }
  function parseVacancesJSON(text){
    var data = JSON.parse(text);
    var arr = Array.isArray(data) ? data
      : Array.isArray(data.vacances) ? data.vacances
      : Array.isArray(data.items) ? data.items
      : Array.isArray(data.events) ? data.events : [];
    return arr.map(function(o){
      o = o || {};
      var nom = o.nom||o.name||o.title||o.summary||'Vacances';
      var debut = o.dateDebut||o.debut||o.start||o.startDate||o.date_debut||'';
      var fin = o.dateFin||o.fin||o.end||o.endDate||o.date_fin||debut;
      return { nom: String(nom), dateDebut: String(debut).slice(0,10), dateFin: String(fin).slice(0,10) };
    }).filter(function(v){ return v.dateDebut; });
  }
  function parseVacancesFeed(text){
    var trimmed = String(text||'').trim();
    if(!trimmed) return [];
    if(/BEGIN:VCALENDAR/i.test(trimmed) || /BEGIN:VEVENT/i.test(trimmed)) return parseICS(trimmed);
    try{ return parseVacancesJSON(trimmed); }catch(e){ return []; }
  }
  function importVacancesCSV(text){
    var objs = csvToObjects(text);

      var nom = o.nom||o.name||o.titre||'';
      var debut = o.datedebut||o.debut||o.start||o.date_debut||'';
      var fin = o.datefin||o.fin||o.end||o.date_fin||debut;
      return { nom: nom, dateDebut: String(debut).slice(0,10), dateFin: String(fin).slice(0,10) };

  /* Fusionne une liste de périodes importées dans state.vacances, en ignorant les doublons exacts
     (même nom/mêmes dates) déjà présents — pour qu'un ré-import (même fichier, même flux consulté deux
     fois) n'empile jamais les mêmes vacances plusieurs fois. */
  function importVacancesList(list, source){
    var added = 0, skipped = 0;
    (list||[]).forEach(function(v){
      if(!v || !v.dateDebut){ skipped++; return; }
      var fin = v.dateFin || v.dateDebut;
      var dup = state.vacances.some(function(x){ return x.dateDebut===v.dateDebut && x.dateFin===fin && (x.nom||'').toLowerCase()===(v.nom||'').toLowerCase(); });
      if(dup){ skipped++; return; }
      state.vacances.push({ id: uid(), nom: (v.nom||'Vacances').trim()||'Vacances', dateDebut: v.dateDebut, dateFin: fin, source: source, createdAt: nowIso(), updatedAt: nowIso() });
      added++;
    });
    if(added) saveLocal('vacances');
    render();
    toast(added+' période(s) importée(s)'+(skipped?', '+skipped+' ignorée(s) (déjà présente(s) ou invalide(s))':'')+'.');
  }

  function fetchVacancesFromUrl(url){

    hideVacancesImportErr();

      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.text();
    }).then(function(text){
      var list = parseVacancesFeed(text);
      if(!list.length){ showVacancesImportErr('Adresse jointe, mais aucune période reconnue dans la réponse (ni .ics, ni JSON du format attendu).'); return; }
      importVacancesList(list, 'url');
    }).catch(function(err){
      showVacancesImportErr('Récupération impossible depuis cette application (restriction de sécurité du navigateur — CORS — ou réseau indisponible ; c\'est systématique pour la plupart des liens calendar.google.com). Téléchargez le fichier/la réponse autrement puis collez son contenu ci-dessous. Détail technique : '+((err&&err.message)||err));

  function collFor(kind){ return {task:'tasks', zone:'zones', etablissement:'etablissements', enseignant:'enseignants', document:'documents'}[kind]; }
  function stateArr(kind){ return {task:state.tasks, zone:state.zones, etablissement:state.etablissements, enseignant:state.enseignants, document:state.documents}[kind]; }
  function recordSet(kind, obj, opts){
    opts = opts || {};
    if(!opts.skipTouch) obj.updatedAt = nowIso();
    if(!obj.createdAt) obj.createdAt = obj.updatedAt || nowIso();
    var coll = collFor(kind);
    var arr = stateArr(kind);
    var i = arr.findIndex(function(x){ return x.id===obj.id; });
    /* Diversification du workflow : une tâche qui bascule à « Clôturée » — par n'importe quel écran,
       puisque tous passent par recordSet — doit toujours produire un bordereau de transmission.
       Détecté ici (avant l'écrasement de l'ancien enregistrement) pour ne réagir qu'au moment précis
       où le statut DEVIENT clôturée, jamais à chaque simple ré-enregistrement d'une tâche déjà close. */
    var justClosed = (kind==='task' && obj.statut==='cloturee' && !(i>=0 && arr[i].statut==='cloturee'));
    if(i>=0) arr[i]=obj; else arr.push(obj);
    saveLocal(coll); render();
    if(justClosed) ensureBordereauForTask(obj);
    return Promise.resolve();
  }
  /* Garantit qu'un bordereau de transmission existe toujours pour une tâche clôturée : n'en crée un
     que s'il n'en existe pas déjà un pour cette tâche (jamais de doublon), et le pré-remplit avec la
     liste des documents déjà générés pour la tâche comme pièces jointes — c'est précisément l'objet
     d'un bordereau. Reste un document normal, éditable ensuite comme tout autre. */
  function ensureBordereauForTask(task){
    var already = state.documents.some(function(d){ return d.taskId===task.id && d.type==='bordereau'; });
    if(already) return;
    var d = buildDefaultDoc(task, 'bordereau');
    var otherDocs = state.documents.filter(function(x){ return x.taskId===task.id; });
    if(otherDocs.length) d.pieces = otherDocs.map(function(x){ return {designation:(DOC_TYPE_INFO[x.type]||{}).label||x.titre||'', nombre:'1'}; });
    recordSet('document', d);
    toast(DOC_TYPE_INFO.bordereau.label+' généré automatiquement pour cette tâche clôturée.');
  }

     d'attestation pour chacun(e). Ignore les invité(e)s qui ont déjà une attestation pour cette tâche
     (identifiée par le nom, comme buildDefaultDoc n'attribue pas d'id d'enseignant à une attestation)
     pour ne jamais créer de doublon en cliquant plusieurs fois. */
  function ensureAttestationsForInvites(task){
    var created = 0;
    (task.invites||[]).forEach(function(inv){
      var already = state.documents.some(function(d){ return d.taskId===task.id && d.type==='attestation' && d.beneficiaireNom===inv.nom; });
      if(already) return;
      var d = buildDefaultDoc(task, 'attestation');
      d.beneficiaireNom = inv.nom; d.lieu = inv.etablissementNom || task.etablissementNom || '';
      state.documents.push(d);
      created++;
    });
    if(created){ saveLocal('documents'); render(); toast(created+' attestation(s) générée(s) pour les enseignant(e)s invité(e)s.'); }
    else toast('Une attestation existe déjà pour chaque enseignant(e) invité(e).');
  }
  function recordDelete(kind, id){
    var coll = collFor(kind);
    var arr = stateArr(kind);
    var filtered = arr.filter(function(x){ return x.id!==id; });
    if(kind==='task') state.tasks = filtered; else if(kind==='zone') state.zones=filtered; else if(kind==='etablissement') state.etablissements=filtered;
    else if(kind==='enseignant') state.enseignants=filtered; else if(kind==='document') state.documents=filtered;
    /* Marque la suppression (voir tombstones ci-dessus) : sans ce repère daté, la prochaine
       synchronisation ne verrait qu'une absence locale et RESSUSCITERAIT l'enregistrement à partir
       d'une sauvegarde distante encore ancienne (voir mergeById). */
    state.tombstones[coll] = state.tombstones[coll] || {};
    state.tombstones[coll][id] = nowIso();
    saveLocal(coll); saveLocal('tombstones'); render();
    return Promise.resolve();
  }
  /* ================= vacances (périodes à éviter : notification d'approche + alerte de concomitance
     avec une tâche — voir Réglages → Vacances, checkUpcomingVacancesNotifications,
     checkTaskVacanceConflicts et vacanceForDate) =================
     Volontairement en dehors du magasin générique recordSet/recordDelete ci-dessus (qui connaît déjà
     tasks/zones/etablissements/enseignants/documents en dur et déclenche des effets de bord propres aux
     tâches) plutôt que d'y ajouter une sixième branche — mêmes principes (id, updatedAt, tombstone),
     fonctions dédiées. */
  function vacanceSet(v){
    v.updatedAt = nowIso();
    if(!v.createdAt) v.createdAt = v.updatedAt;
    var i = state.vacances.findIndex(function(x){ return x.id===v.id; });
    if(i>=0) state.vacances[i]=v; else state.vacances.push(v);
    saveLocal('vacances'); render();
  }
  function vacanceDelete(id){
    state.vacances = state.vacances.filter(function(x){ return x.id!==id; });
    state.tombstones.vacances = state.tombstones.vacances || {};
    state.tombstones.vacances[id] = nowIso();
    saveLocal('vacances'); saveLocal('tombstones'); render();
  }
  /* Comparaison par chaînes AAAA-MM-JJ (ordre lexicographique = ordre chronologique pour ce format) :
     retourne la première période de vacances dont l'intervalle [dateDebut;dateFin] (inclusif) couvre
     la date donnée, ou null. Utilisée à la fois pour l'avertissement en direct dans le formulaire de
     tâche et pour le badge affiché sur la fiche/carte de tâche. */
  function vacanceForDate(iso){
    if(!iso) return null;
    return state.vacances.find(function(v){ return v.dateDebut && v.dateFin && iso>=v.dateDebut && iso<=v.dateFin; }) || null;
  }
  /* « Acceptation des établissements » dans le formulaire de zone : applique en bloc la liste cochée
     d'établissements à cette zone (rattache les cases cochées, détache celles décochées qui lui
     appartenaient) — un établissement ne peut être rattaché qu'à une seule zone, le cocher ici le
     retire donc de son ancienne zone le cas échéant. */
  function applyZoneEtabAssignment(zoneId, selectedIds){
    var changed = false;
    state.etablissements.forEach(function(e){
      var shouldBelong = selectedIds.indexOf(e.id) !== -1;
      var belongs = e.zoneId === zoneId;
      if(shouldBelong && !belongs){ e.zoneId = zoneId; e.updatedAt = nowIso(); changed = true; }
      else if(!shouldBelong && belongs){ e.zoneId = null; e.updatedAt = nowIso(); changed = true; }
    });
    if(changed){ saveLocal('etablissements'); render(); }
    return changed;
  }
  function configSet(patch){
    state.config = Object.assign({}, state.config, patch);
    state.sampleReady = aiUsable();
    saveLocal('config'); render();
    return Promise.resolve();
  }
  function templatesSet(patch){
    state.templates = Object.assign({}, state.templates, patch, {updatedAt: nowIso()});
    saveLocal('templates'); render();
    return Promise.resolve();
  }

  function etabName(id){ var e = state.etablissements.find(function(x){ return x.id===id; }); return e?e.nom:''; }
  function zoneName(id){ var z = state.zones.find(function(x){ return x.id===id; }); return z?z.nom:''; }
  function ensName(id){ var e = state.enseignants.find(function(x){ return x.id===id; }); return e?e.nom:''; }

  /* ================= Google Drive — connexion directe (sans passer par Claude) =================
     L'app utilise Google Identity Services (OAuth côté navigateur) avec le champ d'application
     restreint "drive.file" : l'app ne voit QUE les fichiers qu'elle a elle-même créés dans Drive,
     jamais le reste du compte Google de l'utilisateur. Aucun serveur intermédiaire, aucune
     facturation Claude — uniquement le quota Google gratuit de l'utilisateur. */
  /* L'identifiant client Google n'est plus codé en dur : il est saisi dans l'application
     (écran de configuration Drive) et enregistré dans state.config, donc jamais besoin de
     modifier ce fichier ni le dépôt GitHub pour le renseigner ou le changer. */
  function googleClientId(){ return (state.config && state.config.googleClientId) || ''; }
  var GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  var gisTokenClient = null, gisLoaded = false, driveAccessToken = null, driveTokenExpiresAt = 0;
  function loadGisScript(){
    if(gisLoaded) return Promise.resolve();
    return loadScript('https://accounts.google.com/gsi/client').then(function(){ gisLoaded = true; });
  }
  function ensureGoogleAuth(interactive){
    var cid = googleClientId();
    if(!cid) return Promise.reject({code:'not_configured'});
    return loadGisScript().then(function(){
      return new Promise(function(resolve, reject){
        if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){ reject({code:'server_unavailable'}); return; }
        if(driveAccessToken && Date.now() < driveTokenExpiresAt - 30000){ resolve(driveAccessToken); return; }
        if(!gisTokenClient){
          gisTokenClient = window.google.accounts.oauth2.initTokenClient({
            client_id: cid, scope: GOOGLE_DRIVE_SCOPE,
            callback: function(resp){
              var cb = gisTokenClient.__resolve, eb = gisTokenClient.__reject;
              gisTokenClient.__resolve = null; gisTokenClient.__reject = null;
              if(resp && resp.access_token){
                driveAccessToken = resp.access_token; driveTokenExpiresAt = Date.now() + ((resp.expires_in||3300)*1000);
                state.mcpReady = true; render();
                setTimeout(processPendingAttachments, 3000);
                if(cb) cb(driveAccessToken);
              } else if(eb) eb({code:'consent_required'});
            },
            error_callback: function(err){
              var eb = gisTokenClient.__reject; gisTokenClient.__reject = null; gisTokenClient.__resolve = null;
              if(eb) eb({code: (err && err.type==='popup_closed') ? 'cancelled' : 'consent_required'});
            }
          });
        }
        /* interactive=false : tentative SILENCIEUSE (prompt:'') pour la synchronisation automatique
           au lancement — ne montre jamais de fenêtre Google. Si le compte n'a plus de session active
           ou si le consentement doit être redonné, l'échec est simplement ignoré par l'appelant
           (autoSyncOnLaunch) : l'inspecteur(trice) retrouve l'état habituel « Non connecté » et peut
           toucher « Connecter » comme avant, sans jamais être interrompu par une fenêtre inattendue. */
        gisTokenClient.__resolve = resolve; gisTokenClient.__reject = reject;
        gisTokenClient.requestAccessToken({prompt: (interactive && !driveAccessToken) ? 'consent' : ''});
      });
    });
  }
  function connectGoogleDrive(){
    if(!googleClientId()){ openDriveSetup(); return; }
    ensureGoogleAuth(true).then(function(){
      toast('Google Drive connecté.');
      /* Retrouve tout de suite le dossier/la feuille existants (créés depuis un autre appareil) au
         lieu d'attendre que l'inspecteur(trice) choisisse manuellement « créer » ou « lier ». */
      if(!state.config.sheetFileId) autoLinkExistingData(); else render();
    }).catch(function(err){ toast(mcpErrorMessage(err)); render(); });
  }
  /* Synchronisation silencieuse au lancement de l'application : si cet appareil s'est déjà connecté
     à Google Drive par le passé (sheetFileId déjà en cache localement), on tente un rattachement
     SILENCIEUX (sans fenêtre Google, voir ensureGoogleAuth(false)) puis, en cas de réussite, une
     synchronisation normale — celle-ci compare déjà, enregistrement par enregistrement, la date de
     dernière modification (updatedAt) locale et distante et ne garde que la plus récente (voir
     mergeById/mergeRemoteBackupIntoLocal) : elle met donc à jour soit le cache local (si le Drive
     avait une version plus récente, modifiée depuis un autre appareil), soit le Drive (si c'est cet
     appareil-ci qui a la version la plus récente), exactement comme le fait déjà le bouton ↻ manuel.
     Si la tentative silencieuse échoue (session Google expirée, consentement à redonner…), on
     n'affiche RIEN : l'inspecteur(trice) retrouve l'état « Non connecté » habituel et peut se
     reconnecter manuellement, sans jamais être interrompu par une fenêtre au démarrage. */
  function autoSyncOnLaunch(){
    if(!googleClientId() || !state.config.sheetFileId) return;
    ensureGoogleAuth(false).then(function(){ doSync(); }).catch(function(){});
  }
  function openDriveSetup(){
    state.driveSetupError = null;
    pushModal({type:'driveSetup'});
  }
  function disconnectGoogleDrive(){
    if(driveAccessToken && window.google && window.google.accounts && window.google.accounts.oauth2){
      try{ window.google.accounts.oauth2.revoke(driveAccessToken, function(){}); }catch(e){}
    }
    driveAccessToken = null; driveTokenExpiresAt = 0; state.mcpReady = false; render(); toast('Google Drive déconnecté.');
  }
  function driveFetch(url, opts){
    opts = opts || {};
    return ensureGoogleAuth(true).then(function(token){
      var headers = Object.assign({}, opts.headers||{}, {Authorization:'Bearer '+token});
      return fetch(url, Object.assign({}, opts, {headers:headers}));
    }).then(function(res){
      if(res.status===401){ driveAccessToken=null; state.mcpReady=false; render(); return Promise.reject({code:'needs_reauth'}); }
      if(!res.ok){
        return res.json().catch(function(){ return {}; }).then(function(j){
          return Promise.reject({code:'tool_error', message:(j.error&&j.error.message)||res.statusText});
        });
      }
      return res;
    });
  }
  /* IMPORTANT : l'API Drive renvoie par défaut aussi les fichiers mis à la corbeille par cette appli
     elle-même (voir pushJsonBackup/doSync, qui créent un nouveau fichier « sauvegarde-donnees.json »
     / une nouvelle feuille de tâches à chaque synchronisation et mettent l'ancien à la corbeille au
     lieu de le modifier sur place) — sans exclure explicitement trashed=false, une recherche par titre
     peut retomber sur une ancienne copie corbeillée (donc périmée, antérieure à une suppression) au
     lieu de la copie actuelle, ce qui donnait l'impression qu'une suppression locale « ne prenait pas »
     sur Drive alors qu'elle y avait bien été poussée : la sauvegarde relue ensuite n'était simplement
     pas la bonne. */
  function driveQueryTranslate(q){
    var out = String(q||'').replace(/\btitle\b/g, 'name');
    if(!/\btrashed\s*=/.test(out)) out += " and trashed = false";
    return out;
  }
  function driveFileToPayload(f){ return {id:f.id, title:f.name, mimeType:f.mimeType, modifiedTime:f.modifiedTime, fileExtension:f.fileExtension||'', parentId:(f.parents&&f.parents[0])||null}; }
  var DRIVE_FILES_API = 'https://www.googleapis.com/drive/v3/files';
  var DRIVE_UPLOAD_API = 'https://www.googleapis.com/upload/drive/v3/files';
  function mcpCall(tool, input){
    input = input || {};
    if(tool==='search_files' || tool==='list_recent_files'){
      var params = new URLSearchParams();
      if(tool==='search_files' && input.query) params.set('q', driveQueryTranslate(input.query));
      params.set('pageSize', String(input.pageSize||10));
      params.set('fields', 'files(id,name,mimeType,modifiedTime,fileExtension,parents)');
      params.set('spaces', 'drive');
      params.set('orderBy', 'modifiedTime desc');
      return driveFetch(DRIVE_FILES_API+'?'+params.toString()).then(function(res){ return res.json(); }).then(function(data){
        /* Défense en profondeur, en plus du tri déjà demandé au serveur (orderBy) et de l'exclusion des
           fichiers corbeillés (voir driveQueryTranslate) : si jamais plusieurs fichiers valides
           partagent le même titre (ex. une mise à la corbeille qui aurait échoué silencieusement — voir
           le .catch() sur trash_file dans pushJsonBackup/doSync), on prend systématiquement le plus
           récemment modifié plutôt que le premier renvoyé par l'API, dont l'ordre n'est garanti que si
           orderBy est respecté. */
        var files = (data.files||[]).map(driveFileToPayload);
        files.sort(function(a,b){ return new Date(b.modifiedTime||0) - new Date(a.modifiedTime||0); });
        return {payload:{files:files}};
      });
    }
    if(tool==='create_file'){
      var isFolder = input.contentMimeType==='application/vnd.google-apps.folder' && !input.textContent && !input.base64Content;
      var meta = {name: input.title};
      if(input.parentId) meta.parents = [input.parentId];
      if(isFolder){
        meta.mimeType = 'application/vnd.google-apps.folder';
        return driveFetch(DRIVE_FILES_API+'?fields=id,name,parents', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(meta)})
          .then(function(res){ return res.json(); }).then(function(data){ return {payload:{id:data.id, title:data.name, parentId:input.parentId||null}}; });
      }
      var mime = input.contentMimeType || 'text/plain';
      /* La conversion Drive « à la volée » (déjà utilisée pour CSV → Google Sheets lors de la
         synchronisation) sert aussi à transformer un .docx généré par l'app en Google Doc natif et
         éditable — voir uploadBlobToDrive(..., convertToGoogleDoc) — plutôt que de le laisser comme
         simple fichier .docx figé dans Drive. */
      meta.mimeType = input.disableConversionToGoogleType ? mime
        : input.convertToGoogleDoc ? 'application/vnd.google-apps.document'
        : (mime==='text/csv' ? 'application/vnd.google-apps.spreadsheet' : mime);
      var boundary = 'ciBoundary'+Date.now();
      var head = '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
        '\r\n--'+boundary+'\r\nContent-Type: '+mime+'\r\n\r\n';
      var tail = '\r\n--'+boundary+'--';
      /* Le contenu binaire (base64Content) est décodé en octets bruts et assemblé via Blob plutôt
         qu'en concaténant une chaîne JS, pour éviter toute corruption des octets > 127 par un
         ré-encodage UTF-8 implicite lors de l'envoi (fetch encoderait sinon une chaîne binaire). */
      var bodyPart = input.base64Content ? base64ToUint8Array(input.base64Content) : (input.textContent||'');
      var multipartBlob = new Blob([head, bodyPart, tail], {type:'multipart/related; boundary='+boundary});
      return driveFetch(DRIVE_UPLOAD_API+'?uploadType=multipart&fields=id,name,parents', {
        method:'POST', headers:{'Content-Type':'multipart/related; boundary='+boundary}, body: multipartBlob
      }).then(function(res){ return res.json(); }).then(function(data){
        return {payload:{id:data.id, title:data.name, parentId:(data.parents&&data.parents[0])||input.parentId||null}};
      });
    }
    if(tool==='update_file'){
      var fileId = input.fileId;
      var doPatch = function(addParents, removeParents){
        var params2 = new URLSearchParams(); params2.set('fields','id,name,parents');
        if(addParents) params2.set('addParents', addParents);
        if(removeParents) params2.set('removeParents', removeParents);
        var body2 = {}; if(input.title) body2.name = input.title;
        return driveFetch(DRIVE_FILES_API+'/'+fileId+'?'+params2.toString(), {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body2)})
          .then(function(res){ return res.json(); });
      };
      if(input.parentId){
        return driveFetch(DRIVE_FILES_API+'/'+fileId+'?fields=parents').then(function(res){ return res.json(); }).then(function(cur){
          return doPatch(input.parentId, (cur.parents||[]).join(','));
        }).then(function(data){ return {payload:{id:data.id, title:data.name, parentId:(data.parents&&data.parents[0])||null}}; });
      }
      return doPatch(null, null).then(function(data){ return {payload:{id:data.id, title:data.name, parentId:(data.parents&&data.parents[0])||null}}; });
    }
    if(tool==='trash_file'){
      return driveFetch(DRIVE_FILES_API+'/'+input.fileId, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trashed:true})})
        .then(function(){ return {payload:{id:input.fileId}}; });
    }
    if(tool==='download_file_content'){
      var url = input.exportMimeType ? DRIVE_FILES_API+'/'+input.fileId+'/export?mimeType='+encodeURIComponent(input.exportMimeType) : DRIVE_FILES_API+'/'+input.fileId+'?alt=media';
      return driveFetch(url).then(function(res){ return res.text(); }).then(function(text){ return {payload:{content: utf8ToB64(text)}}; });
    }
    return Promise.reject({code:'tool_error', message:'outil inconnu : '+tool});
  }
  function mcpErrorMessage(err){
    var code = err && err.code;
    switch(code){
      case 'needs_reauth': return "Reconnectez Google Drive, puis réessayez.";
      case 'not_configured': return "Google Drive n'est pas encore configuré. Touchez « Connecter » pour coller votre identifiant client Google.";
      case 'consent_required': return "Autorisez l'accès à Google Drive, puis réessayez.";
      case 'server_unavailable': return "Google Drive est temporairement indisponible (vérifiez votre connexion).";
      case 'tool_error': return "Google Drive a refusé cette opération" + (err&&err.message?' : '+err.message:'') + ".";
      case 'cancelled': return "Connexion à Google Drive annulée.";
      default: return "Erreur Google Drive" + (code ? ' ('+code+')' : '') + ".";
    }
  }

      case 'local_paused': return "Téléchargement en pause : l'écran s'est éteint ou vous avez quitté l'application. Il reprend automatiquement dès que vous revenez sur cet écran (sinon, touchez « Reprendre le téléchargement »). Rien de ce qui a déjà été téléchargé n'est perdu.";
      case 'local_engine_network': return "Le moteur IA local n'a pas pu être chargé (première utilisation : une connexion internet est nécessaire une fois pour récupérer le moteur, environ 9 Mo).";

      case 'local_incomplete_file': return "Le fichier du modèle est incomplet (téléchargement inachevé). Attendez la fin du téléchargement dans Chrome, puis importez-le à nouveau.";

      case 'invalid_key': return "Clé API Gemini refusée par Google" + (err&&err.message?' : « '+err.message+' »':'') + ". Si vous venez de créer une clé toute neuve sur aistudio.google.com/apikey et qu'elle est refusée quand même, ce n'est probablement plus un problème de clé « ancien format » : vérifiez que vous avez bien copié la clé en entier (sans espace ni retour à la ligne), qu'elle correspond bien au compte Google que vous utilisez, et régénérez-en une nouvelle si le doute persiste.";
      case 'location_restricted': return "Gemini a refusé la demande avec le message « User location is not supported » (localisation non prise en charge). Ceci n'est PAS lié à la clé — en créer une nouvelle ne change rien. Cause la plus fréquente : un VPN, un proxy, ou le réseau de l'établissement/opérateur qui achemine la connexion via un pays où Gemini n'est pas disponible. Désactivez tout VPN/économiseur de données puis réessayez en Wifi ou en 4G/5G directe.";
      case 'overloaded': return "Le modèle Gemini est momentanément surchargé (forte demande chez Google en ce moment) — l'application a déjà réessayé automatiquement plusieurs fois sans succès. Ce n'est ni un problème de clé ni de localisation : patientez quelques minutes puis retouchez le bouton.";
      case 'rate_limited': return "Trop de demandes à la fois auprès de Gemini : réessayez dans un instant.";
      case 'not_found': return "Modèle IA momentanément indisponible. Réessayez plus tard.";
      case 'blocked': return "La demande a été bloquée par les filtres de sécurité de Gemini. Reformulez votre requête.";
      case 'empty_completion': return "Aucun texte généré. Essayez une demande plus précise.";
      case 'network': return "Impossible de joindre le service Gemini (vérifiez votre connexion internet).";

  /* Appel direct à l'API Gemini (generateContent) avec la clé de l'utilisateur — retourne le texte

     cas de surcharge temporaire du modèle (503/UNAVAILABLE — message Google typique : « This model is

  /* Rédige — ou, si le champ contient déjà du texte, complète et enrichit ce texte au lieu de
     l'écraser : très utile pour les rapports et les grilles d'observation, où l'inspecteur(trice) a
     souvent déjà jeté quelques notes ou un brouillon avant de vouloir les développer. Le prompt de
     contexte (contextPrompt) reste celui fourni par chaque bouton (fixe la langue et le sujet) ; en
     mode « enrichir », on lui ajoute simplement le texte existant et une consigne de complétion qui
     préserve explicitement la langue déjà utilisée. */
  function aiDraft(btn, statusEl, targetTextarea, contextPrompt){
    var existing = targetTextarea ? (targetTextarea.value||'').trim() : '';
    var prompt = existing
      ? contextPrompt+"\n\nVoici le texte déjà rédigé (brouillon ou notes de l'inspecteur(trice)), à conserver comme base :\n\""+existing+"\"\n\nComplète et enrichis ce texte : développe les idées de façon plus précise, professionnelle et détaillée, améliore la formulation si besoin, sans changer son sens ni inventer de nouveaux faits non mentionnés. Rédige la version complète et enrichie dans la même langue que ce texte existant et que les instructions ci-dessus. Renvoie uniquement le texte final (pas de commentaire méta, pas d'introduction du type « voici la version enrichie »)."
      : contextPrompt;
    runAiPrompt(btn, statusEl, targetTextarea, prompt);
  }
  /* Traduction FR ↔ arabe : plusieurs types de documents (RTL_DOC_TYPES) impriment déjà leur mise en
     forme (titres, libellés, en-têtes de tableaux) en arabe alors que le contenu est saisi dans les
     mêmes champs français de l'application — ce bouton traduit sur place le texte déjà présent dans
     le champ, avec le même mécanisme que l'assistant de rédaction. Le sens de traduction est détecté
     automatiquement à partir du texte (présence de caractères arabes ou non), pour n'avoir qu'un seul
     bouton plutôt que deux. */
  function aiTranslate(btn, statusEl, targetTextarea){
    if(!targetTextarea) return;
    var text = (targetTextarea.value||'').trim();
    if(!text){ toast('Rien à traduire : le champ est vide.'); return; }
    var isArabic = /[؀-ۿ]/.test(text);
    var prompt = isArabic
      ? "Traduis fidèlement ce texte administratif en français, ton formel, sans rien ajouter ni commenter — retourne uniquement le texte traduit :\n\n"+text
      : "Traduis fidèlement ce texte administratif en arabe standard moderne, ton formel, sans rien ajouter ni commenter — retourne uniquement le texte traduit :\n\n"+text;
    runAiPrompt(btn, statusEl, targetTextarea, prompt);
  }
  /* Conception d'un plan d'action (compte-rendu de réunion) : contrairement aux autres boutons IA qui
     posent un simple texte dans un champ, celui-ci vise une LISTE structurée (state.draftDoc.actions,
     déjà éditable ligne par ligne dans le formulaire) — on demande donc à Gemini un tableau JSON, qu'on
     extrait tolérant (au cas où la réponse serait entourée de texte ou de balises ```json```), avant de
     remplacer la liste et de redessiner le formulaire pour l'afficher. L'échéance de chaque action reste
     volontairement vide : l'IA ne peut pas connaître de vraies contraintes de calendrier, c'est à
     l'inspecteur(trice) de la compléter. */
  function runAiActionsPlan(btn, statusEl, prompt){
    aiCurrentWords = 0;
    if(!aiUsable() || (aiEffectiveProvider()==='local' && !localModelReady())){ toast(geminiErrorMessage({code:'not_configured'})); return; }
    if(btn) btn.disabled = true;
    var st = aiStatusStart(statusEl);
    geminiGenerate(prompt, 1, null, null, st.onReason).then(function(text){
      st.stop();
      var items = parseAiActionsJson(text);
      if(!items.length) return Promise.reject({code:'empty_completion'});
      state.draftDoc.actions = items;
      var ms = aiLastMeta.ms;
      render();
      toast('Plan d\'action généré en '+fmtAiDuration(ms)+'.');
    }).catch(function(err){
      st.stop();
      if(statusEl){ statusEl.hidden = false; statusEl.className = 'banner err'; statusEl.textContent = geminiErrorMessage(err); }
      if(btn) btn.disabled = false;
    });
  }
  function parseAiActionsJson(text){
    var m = text.match(/\[[\s\S]*\]/);
    if(!m) return [];
    try{
      var arr = JSON.parse(m[0]);
      if(!Array.isArray(arr)) return [];
      return arr.map(function(x){ return { action:String((x&&x.action)||'').trim(), responsable:String((x&&x.responsable)||'').trim(), echeance:'' }; }).filter(function(a){ return a.action; });
    }catch(e){ return []; }
  }

  /* ================= fiche enseignant(e) : import par IA (photo/PDF) et lien à distance =================
     Trois façons d'ajouter/compléter un(e) enseignant(e) sans tout ressaisir à la main, toutes
     convergeant vers le même petit objet `vals` (mêmes clés que ficheFieldLabels()) puis vers
     applyFicheValuesToDraft(), qui ouvre le formulaire enseignant pré-rempli pour vérification avant
     enregistrement (jamais d'enregistrement automatique) — regroupées dans un seul hub « Fiches à
     distance » (voir ficheHubModalHtml/openFicheHubModal, section plus bas) :
       1) OCR + extraction par Gemini (multimodal) à partir d'une photo prise sur place ou d'un PDF/image
          téléversé (voir startEnsFicheImport ci-dessous et son wiring, section « file inputs »).
       2) Google Form + feuille de réponses liée (voir defaultFicheForm/ficheFormSet/
          parseFormResponsesCSV/importFicheResponses plus bas) : les réponses arrivent automatiquement,
          comme avec un Google Form classique, sans rien à recopier.
       3) Lien simple de repli (sans Google Form) : openFicheLinkModal() construit un lien (fragment
          #fiche=1&...) vers renderPublicFichePage(), un mini-formulaire public autonome (aucune donnée
          de l'app, aucune connexion) que l'enseignant(e) remplit sur son propre téléphone puis renvoie
          par WhatsApp/email — l'inspecteur(trice) colle ensuite ce message reçu via « Fiches à distance
          → Coller une réponse », analysé par parseFicheMessageText() (extraction déterministe par
          étiquette, sans IA : le format du message est entièrement sous notre contrôle). */
  function ficheFieldLabels(){
    return [
      {k:'nom', l:'Nom'}, {k:'etab', l:'Établissement'}, {k:'matiere', l:'Matière'}, {k:'cycle', l:'Cycle'},
      {k:'ppr', l:'PPR'}, {k:'telephone', l:'Téléphone'}, {k:'email', l:'Email'}, {k:'cadre', l:'Cadre/échelle'},
      {k:'genre', l:'Genre'}, {k:'statut', l:'Statut'}, {k:'notes', l:'Notes'}
    ];
  }
  function buildFicheMessageText(vals){
    return 'FICHE ENSEIGNANT(E)\n' + ficheFieldLabels().map(function(f){ return f.l+': '+((vals&&vals[f.k])||''); }).join('\n');
  }
  function parseFicheMessageText(text){
    var out = {}; var src = String(text||'');
    ficheFieldLabels().forEach(function(f){
      var re = new RegExp('^\\s*'+f.l.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*:\\s*(.*)$', 'im');
      var m = src.match(re);
      out[f.k] = m ? m[1].trim() : '';
    });
    return out;
  }
  function normalizeGenre(text){
    var t = String(text||'').toLowerCase();
    if(/femme|féminin|^f$/.test(t)) return 'F';
    if(/homme|masculin|^h$/.test(t)) return 'H';
    return '';
  }
  function normalizeStatut(text){
    var t = String(text||'').toLowerCase();
    if(/stagiaire/.test(t)) return 'stagiaire';
    return 'titulaire';
  }
  function matchEtablissementByName(name){
    var n = String(name||'').trim().toLowerCase();
    if(!n) return null;
    var found = state.etablissements.find(function(et){
      var en = String(et.nom||'').trim().toLowerCase();
      return en && (en===n || en.indexOf(n)>=0 || n.indexOf(en)>=0);
    });
    return found ? found.id : null;
  }
  /* Construit (ou complète, si `existing` est fourni) une fiche enseignant(e) à partir des valeurs
     extraites (OCR ou message collé), puis ouvre le formulaire habituel pour relecture — jamais
     d'enregistrement automatique, l'inspecteur(trice) garde toujours la main avant de sauvegarder. */
  function applyFicheValuesToDraft(vals, existing){
    var etabId = matchEtablissementByName(vals.etab);
    var base = existing
      ? Object.assign({statut:'titulaire', sessionTitularisation:'', cadre:'', ppr:'', genre:''}, JSON.parse(JSON.stringify(existing)))
      : { id: uid(), nom:'', etablissementId:null, matiere:'', cycle:'', telephone:'', email:'', ppr:'', genre:'',
          statut:'titulaire', sessionTitularisation:'', cadre:'', photoAssetId:null, horaire:[], attachments:[], notes:'' };
    if(vals.nom) base.nom = vals.nom;
    if(etabId) base.etablissementId = etabId;
    else if(vals.etab) base.notes = (base.notes ? base.notes+'\n' : '') + 'Établissement indiqué (à vérifier) : '+vals.etab;
    if(vals.matiere) base.matiere = vals.matiere;
    if(vals.cycle) base.cycle = vals.cycle;
    if(vals.ppr) base.ppr = vals.ppr;
    if(vals.telephone) base.telephone = vals.telephone;
    if(vals.email) base.email = vals.email;
    if(vals.cadre) base.cadre = vals.cadre;
    var g = normalizeGenre(vals.genre); if(g) base.genre = g;
    if(vals.statut) base.statut = normalizeStatut(vals.statut);
    if(vals.notes) base.notes = (base.notes ? base.notes+'\n' : '') + vals.notes;
    state.draftRecord = base;
    pushModal({type:'enseignant', isNew: !existing});
  }
  function readFileAsDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result)); };
      reader.onerror = function(){ reject(new Error('read-failed')); };
      reader.readAsDataURL(file);
    });
  }
  function parseAiFicheJson(text){
    var m = String(text||'').match(/\{[\s\S]*\}/);
    if(!m) return null;
    try{
      var o = JSON.parse(m[0]);
      return { nom:String(o.nom||'').trim(), etab:String(o.etab||'').trim(), matiere:String(o.matiere||'').trim(),
        cycle:String(o.cycle||'').trim(), ppr:String(o.ppr||'').trim(), telephone:String(o.telephone||'').trim(),
        email:String(o.email||'').trim(), cadre:String(o.cadre||'').trim(), genre:String(o.genre||'').trim(),
        statut:String(o.statut||'').trim(), notes:String(o.notes||'').trim() };
    }catch(e){ return null; }
  }
  function startEnsFicheImport(){
    if(!geminiApiKey()){ toast(geminiErrorMessage({code:'not_configured'})); return; }
    $('fileEnsFicheInput').click();
  }
  /* Copie presse-papiers avec repli si l'API Clipboard est indisponible (contexte non sécurisé, vieux
     navigateur…) : une zone de texte temporaire sélectionnée puis execCommand('copy'). */
  function copyTextToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function(resolve, reject){
      try{
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('copy-failed'));
      }catch(e){ reject(e); }
    });
  }
  /* Lien à distance : quand un Google Form est configuré (state.ficheForm.formUrl, voir le hub
     « Fiches à distance » ci-dessous), le lien envoyé est directement celui du formulaire — les
     réponses arrivent alors automatiquement dans la feuille liée, sans rien à recopier. Sinon, on
     retombe sur le mini-formulaire public intégré (#fiche=1&...), avec les coordonnées de
     l'inspecteur(trice) pour que l'enseignant(e) puisse renvoyer sa réponse en un tap, et, si
     `teacher` est fourni (bouton « Lien pour sa fiche » depuis une fiche déjà ouverte), les champs
     déjà connus pré-remplis (le Google Form, lui, n'est pas pré-rempli : cela suppose de configurer
     des identifiants de champ propres à chaque formulaire, trop fragile pour être automatisé ici). */
  function openFicheLinkModal(teacher){
    var profil = state.templates.profil || {};
    var usingForm = !!(state.ficheForm && state.ficheForm.formUrl);
    var url;
    if(usingForm){
      url = state.ficheForm.formUrl;
    } else {
      var qp = new URLSearchParams();
      qp.set('fiche', '1');
      if(profil.nom) qp.set('insp', profil.nom);
      if(profil.telephone) qp.set('tel', profil.telephone);
      if(profil.email) qp.set('email', profil.email);
      if(teacher){
        if(teacher.nom) qp.set('nom', teacher.nom);
        var etn = etabName(teacher.etablissementId); if(etn) qp.set('etab', etn);
        if(teacher.matiere) qp.set('matiere', teacher.matiere);
        if(teacher.cycle) qp.set('cycle', teacher.cycle);
      }
      url = location.origin + location.pathname + '#' + qp.toString();
    }
    var waLink = (teacher && teacher.telephone)
      ? waHref(teacher.telephone, 'Bonjour '+(teacher.nom||'')+', merci de compléter votre fiche personnelle via ce lien : '+url)
      : '';
    pushModal({type:'ficheLink', url:url, teacherNom:(teacher&&teacher.nom)||'', waLink:waLink, usingForm:usingForm});
  }
  function ficheLinkModalHtml(idx, m){
    var note = m.usingForm
      ? "il/elle pourra remplir votre Google Form directement depuis son téléphone ; sa réponse arrivera automatiquement dans la feuille de réponses liée — utilisez ensuite « Fiches à distance → Importer les nouvelles réponses »."
      : "il/elle pourra compléter sa fiche personnelle directement depuis son téléphone, sans compte ni installation, puis vous renvoyer ses informations (WhatsApp, email…). Utilisez ensuite « Fiches à distance → Coller une réponse » pour les ajouter en un tap.";
    return '<div class="overlay" style="z-index:'+(50+idx)+'" data-overlay="'+idx+'"><div class="sheet" role="dialog" aria-modal="true">'+
      '<div class="sheet-head"><h2>Lien à distance</h2><button class="icon-btn" data-close-modal="1" aria-label="Fermer">'+ICONS.close+'</button></div>'+
      '<p style="font-size:12px;color:var(--ink-faint);margin:0 0 10px;">Envoyez ce lien à '+(m.teacherNom?('<b>'+esc(m.teacherNom)+'</b>'):"un(e) enseignant(e)")+' : '+note+'</p>'+
      '<div class="field"><label>Lien</label><input type="text" id="fiLinkVal" readonly value="'+esc(m.url)+'" style="width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:10px 11px;font-size:11.5px;"></div>'+
      '<div class="btn-row" style="flex-wrap:wrap;">'+
        '<button class="btn ghost sm" id="fiCopy" type="button">Copier le lien</button>'+
        '<button class="btn ghost sm" id="fiShare" type="button" hidden>Partager</button>'+
        (m.waLink ? '<a class="btn primary sm" id="fiWa" href="'+esc(m.waLink)+'" target="_blank" rel="noopener">'+ICONS.chat+' Envoyer par WhatsApp</a>' : '')+
      '</div>'+
      '</div></div>';
  }
  /* Lit la feuille de réponses liée au Google Form (export CSV, même mécanisme que la feuille des
     tâches — voir doSync) et associe chaque colonne à une clé de ficheFieldLabels() par le LIBELLÉ de
     sa question (pas par position : robuste à un formulaire dont les questions ont été réordonnées),
     en ignorant toute colonne inconnue. La première colonne (l'horodatage ajouté automatiquement par
     Google Forms, quel que soit son intitulé exact — « Horodateur » en français) sert de clé de
     déduplication (state.ficheForm.seenTimestamps), pour ne jamais réimporter deux fois la même ligne. */
  function parseFormResponsesCSV(csv){
    var rows = parseCSV(csv);
    if(!rows.length) return [];
    var headers = rows[0].map(function(h){ return String(h||'').trim(); });
    var labelToKey = {}; ficheFieldLabels().forEach(function(f){ labelToKey[f.l.toLowerCase()] = f.k; });
    var colMap = {};
    headers.forEach(function(h, i){ var k = labelToKey[h.toLowerCase()]; if(k) colMap[k] = i; });
    return rows.slice(1).filter(function(r){ return r.some(function(c){ return String(c||'').trim(); }); }).map(function(r){
      var vals = {};
      ficheFieldLabels().forEach(function(f){ vals[f.k] = colMap.hasOwnProperty(f.k) ? String(r[colMap[f.k]]||'').trim() : ''; });
      vals._timestamp = String(r[0]||'').trim();
      return vals;
    });
  }
  function importFicheResponses(){
    var ff = state.ficheForm;
    if(!ff || !ff.sheetFileId){ toast('Liez d\'abord votre feuille de réponses.'); return; }
    toast('Recherche de nouvelles réponses…');
    mcpCall('download_file_content', {fileId: ff.sheetFileId, exportMimeType:'text/csv'}).then(function(res){
      var payload = res.payload || {};
      var csv = payload.content ? b64ToUtf8(payload.content) : '';
      var rows = parseFormResponsesCSV(csv);
      var seen = ff.seenTimestamps || [];
      var fresh = rows.filter(function(r){ return r._timestamp && seen.indexOf(r._timestamp)===-1; });
      if(!fresh.length){ toast('Aucune nouvelle réponse.'); return; }
      ficheFormSet({ seenTimestamps: seen.concat(fresh.map(function(r){ return r._timestamp; })) });
      state.ficheResponsesQueue = fresh;
      pushModal({type:'ficheResponsesQueue'});
    }).catch(function(err){ toast(mcpErrorMessage(err)); });
  }
  function ficheResponsesQueueModalHtml(idx){
    var q = state.ficheResponsesQueue || [];
    var html = '<div class="overlay" style="z-index:'+(50+idx)+'" data-overlay="'+idx+'"><div class="sheet" role="dialog" aria-modal="true">'+
      '<div class="sheet-head"><h2>Nouvelles réponses ('+q.length+')</h2><button class="icon-btn" data-close-modal="1" aria-label="Fermer">'+ICONS.close+'</button></div>'+
      '<p style="font-size:11.5px;color:var(--ink-faint);margin:0 0 10px;">Touchez une réponse pour l\'ajouter (ou mettre à jour la fiche existante si un(e) enseignant(e) du même nom existe déjà) — vous pourrez vérifier les informations avant d\'enregistrer.</p>';
    html += !q.length ? '<div class="empty">Toutes les réponses ont été traitées.</div>' :
      '<div class="rec-list">'+q.map(function(r,i){
        return '<div class="rec-row" data-ficheresp="'+i+'"><div class="avatar">'+initials(r.nom)+'</div>'+
          '<div class="rec-info"><div class="t">'+esc(r.nom||'(sans nom)')+'</div><div class="s">'+esc([r.etab, r.matiere].filter(Boolean).join(' · '))+'</div></div></div>';
      }).join('')+'</div>';
    html += '</div></div>';
    return html;
  }
  /* Hub unique « Fiches à distance » (Enseignants → un seul bouton, au lieu des trois boutons distincts
     de la version précédente — voir la suppression des accès en double) : regroupe l'import IA d'une
     fiche (photo/PDF), la configuration/le partage du lien (Google Form ou lien simple de repli), le
     rattachement de la feuille de réponses et l'import des réponses reçues (automatique via le Google
     Form, ou manuel par copier-coller). */

    html += '<div class="section-label">Importer une fiche par photo/PDF (IA)</div>'+

      (hasKey
        ? '<div class="btn-row"><button class="btn ghost sm" id="btnImportEnsFiche" type="button">'+ICONS.cam+' Importer une fiche (IA)</button></div>'
        : '<p style="font-size:11px;color:var(--ink-faint);">Ajoutez une clé Gemini dans Réglages → Assistant IA pour activer cet import (l\'IA locale ne lit pas les images).</p>');

    html += '<div class="side-divider" style="margin:16px 0;"></div><div class="section-label">Lien à distance</div>';

          '<li>Onglet « Réponses » → icône Google Sheets → « Créer une feuille de calcul ».</li>'+

    } else {
      html += '<div class="settings-row"><div><div class="l">Google Form lié</div><div class="s">'+esc(ff.formUrl)+'</div></div>'+
        '<button class="btn ghost sm" id="btnEditFormUrl" type="button">Modifier</button></div>'+
        '<div class="btn-row" style="margin-top:8px;"><button class="btn ghost sm" id="btnFicheHubLink" type="button">'+ICONS.ext+' Obtenir le lien à envoyer</button></div>'+
        '<div class="field" style="margin-top:10px;"><label>Feuille de réponses</label>'+
        (ff.sheetFileId
          ? '<div class="settings-row"><div><div class="l">'+esc(ff.sheetTitle||'Feuille liée')+'</div><div class="s">Liée — utilisée par « Importer les nouvelles réponses » ci-dessous.</div></div><button class="btn ghost sm" id="btnRelinkFicheSheet" type="button">Changer</button></div>'
          : '<p style="font-size:11.5px;color:var(--ink-faint);margin:2px 0 8px;">Liez la feuille de réponses créée par votre Google Form pour pouvoir importer automatiquement les nouvelles réponses.</p>'+
            '<div class="search-row"><input type="text" id="ficheSheetSearch" placeholder="Nom de la feuille…"><button type="button" id="ficheSheetSearchBtn">OK</button></div>'+
            '<div id="ficheSheetResults" class="doc-list" style="margin-top:9px;"></div>')+
        '</div>';
    }

    html += '<div class="side-divider" style="margin:16px 0;"></div><div class="section-label">Réponses reçues</div>';
    if(ff.sheetFileId){
      html += '<div class="btn-row"><button class="btn primary sm" id="btnImportFicheResponses" type="button">'+ICONS.dl+' Importer les nouvelles réponses</button></div>';

    return html;
