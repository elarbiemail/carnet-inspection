  /* Types de documents concernant nommément un(e) enseignant(e) (correspondance administrative,
     attestation, rapport, grille) : c'est là qu'une photo d'identité de l'enseignant(e), si elle a
     été ajoutée à sa fiche, a du sens sur le document imprimé/exporté. */
  var TEACHER_DOC_TYPES = { lettre_information:true, attestation:true, rapport_inspection:true, observation:true };
  function docPhotoAssetId(d, task){
    var ens = null;
    if(task && task.enseignantId) ens = state.enseignants.find(function(x){ return x.id===task.enseignantId; });
    if(!ens && d.enseignantNom) ens = state.enseignants.find(function(x){ return x.nom===d.enseignantNom; });
    if(!ens && d.beneficiaireNom) ens = state.enseignants.find(function(x){ return x.nom===d.beneficiaireNom; });
    return (ens && ens.photoAssetId) ? ens.photoAssetId : null;
  }
  function buildDocSpec(d, task){
    var spec = buildDocSpecInner(d, task);
    if(TEACHER_DOC_TYPES[d.type]){
      var pid = docPhotoAssetId(d, task);
      if(pid) spec.photoAssetId = pid;
    }
    var dtmpl = (state.templates.docTemplates||{})[d.type];
    if(dtmpl && dtmpl.logoAssetId) spec.logoAssetId = dtmpl.logoAssetId;
    /* Zones IA (voir docTemplatesEditorHtml/docEditModalHtml) : ajoutées ici de façon générique à toute
       section déjà construite par buildDocSpecInner, une par zone renseignée pour ce document — jamais
       dans buildDocSpecInner lui-même, pour ne pas dupliquer cette logique dans chacun de ses types. */
    if(dtmpl && dtmpl.aiZones && dtmpl.aiZones.length){

  /* ---- chargement paresseux des bibliothèques (CDN) ---- */

      var s = document.createElement('script'); s.src = src; s.setAttribute('data-lib', src); s.async = true;
      s.onload = function(){ resolve(); }; s.onerror = function(){ reject(new Error('load-failed:'+src)); };

  function specToPdfBlob(spec){

  /* ---- Word (.docx via docx.js) — prend en charge le rendu arabe (RTL) ---- */
  function specToDocxBlob(spec){
    var d = window.docx;
    var rtl = !!spec.rtl;
    var align = rtl ? d.AlignmentType.RIGHT : d.AlignmentType.LEFT;
    var children = [];
    var profil = state.templates.profil || {};
    var logoUrl = (spec.logoAssetId ? assetUrl(spec.logoAssetId) : '') || (profil.logoAssetId ? assetUrl(profil.logoAssetId) : '');
    if(logoUrl){
      try{
        children.push(new d.Paragraph({ alignment:d.AlignmentType.CENTER, spacing:{after:120},
          children:[ new d.ImageRun({ data: dataUrlToUint8Array(logoUrl), transformation:{width:60,height:60} }) ] }));
      }catch(e){}
    }
    var photoUrl = spec.photoAssetId ? assetUrl(spec.photoAssetId) : '';
    if(photoUrl){
      try{
        children.push(new d.Paragraph({ alignment: rtl?d.AlignmentType.LEFT:d.AlignmentType.RIGHT, spacing:{after:120},
          children:[ new d.ImageRun({ data: dataUrlToUint8Array(photoUrl), transformation:{width:70,height:90} }) ] }));
      }catch(e){}
    }
    (state.templates.entete||'').split('\n').forEach(function(line){
      children.push(new d.Paragraph({ alignment:d.AlignmentType.CENTER, bidirectional:rtl, spacing:{after:40}, children:[ new d.TextRun({text:line, size:18, color:'666666', rightToLeft:rtl}) ] }));
    });
    children.push(new d.Paragraph({ alignment:d.AlignmentType.CENTER, bidirectional:rtl, spacing:{before:120, after:200}, children:[ new d.TextRun({text:spec.titre, bold:true, size:30, rightToLeft:rtl}) ] }));
    var metaLine = spec.meta.map(function(m){ return m[0]+' : '+(m[1]||'—'); }).join('   ·   ');
    children.push(new d.Paragraph({ bidirectional:rtl, alignment:align, spacing:{after:240}, children:[ new d.TextRun({text:metaLine, size:19, color:'444444', rightToLeft:rtl}) ] }));
    var chartsDocx = function(){
      (spec.charts||[]).forEach(function(ch){
        try{
          var wpx = 560, hpx = Math.round(ch.h/ch.w*wpx);
          children.push(new d.Paragraph({ bidirectional:rtl, alignment:align, keepNext:true, spacing:{before:160, after:60}, children:[ new d.TextRun({text:ch.heading, bold:true, size:22, rightToLeft:rtl}) ] }));
          children.push(new d.Paragraph({ alignment:d.AlignmentType.CENTER, spacing:{after:160}, children:[ new d.ImageRun({ type:'png', data: dataUrlToUint8Array(ch.dataUrl), transformation:{ width:wpx, height:hpx } }) ] }));
        }catch(e){}
      });
    };
    var chartsAfterFirst = !!(spec.tables && spec.tables[0] && spec.tables[0].heading==='Indicateurs');
    (spec.tables||[]).forEach(function(tb, ti){
      if(tb.heading) children.push(new d.Paragraph({ bidirectional:rtl, alignment:align, spacing:{before:160, after:80}, children:[ new d.TextRun({text:tb.heading, bold:true, size:24, rightToLeft:rtl}) ] }));
      var headerRow = new d.TableRow({ tableHeader:true, children: tb.headers.map(function(h){
        return new d.TableCell({ shading:{fill:'2F6F62'}, children:[ new d.Paragraph({bidirectional:rtl, alignment: rtl?d.AlignmentType.CENTER:undefined, children:[new d.TextRun({text:h, bold:true, color:'FFFFFF', size:19, rightToLeft:rtl})]}) ] });
      }) });
      var rows = (tb.rows.length ? tb.rows : [tb.headers.map(function(){ return '—'; })]).map(function(r){
        return new d.TableRow({ children:r.map(function(c){ return new d.TableCell({ children:[ new d.Paragraph({bidirectional:rtl, alignment:align, children:[new d.TextRun({text:String(c||''), rightToLeft:rtl})]}) ] }); }) });
      });
      children.push(new d.Table({ width:{size:100, type:d.WidthType.PERCENTAGE}, rows:[headerRow].concat(rows) }));
      children.push(new d.Paragraph({ text:'', spacing:{after:200} }));
      if(ti===0 && chartsAfterFirst) chartsDocx();
    });
    if(!chartsAfterFirst) chartsDocx();
    (spec.sections||[]).forEach(function(sec){
      if(sec.heading) children.push(new d.Paragraph({ bidirectional:rtl, alignment:align, spacing:{before:160, after:80}, children:[ new d.TextRun({text:sec.heading, bold:true, size:24, rightToLeft:rtl}) ] }));
      (sec.text||'—').split('\n').forEach(function(line){
        children.push(new d.Paragraph({ bidirectional:rtl, alignment:align, spacing:{after:60}, children:[ new d.TextRun({text:line, size:20, rightToLeft:rtl}) ] }));
      });
    });
    if(spec.signatures && spec.signatures.length){
      children.push(new d.Paragraph({ text:'', spacing:{before:400} }));
      if(isInspectorLabel(spec.signatures[0])){
        var cachetUrl = profil.cachetAssetId ? assetUrl(profil.cachetAssetId) : '';
        var sigUrl = profil.signatureAssetId ? assetUrl(profil.signatureAssetId) : '';
        var imgRuns = [];
        try{ if(sigUrl) imgRuns.push(new d.ImageRun({ data: dataUrlToUint8Array(sigUrl), transformation:{width:110,height:55} })); }catch(e){}
        try{ if(cachetUrl) imgRuns.push(new d.ImageRun({ data: dataUrlToUint8Array(cachetUrl), transformation:{width:75,height:75} })); }catch(e){}
        if(imgRuns.length) children.push(new d.Paragraph({ alignment: rtl?d.AlignmentType.RIGHT:d.AlignmentType.LEFT, children: imgRuns, spacing:{after:80} }));
      }
      children.push(new d.Paragraph({ bidirectional:rtl, alignment: rtl?d.AlignmentType.RIGHT:d.AlignmentType.LEFT, children:[new d.TextRun({text:spec.signatures[0]||'', size:19, rightToLeft:rtl})] }));
      if(spec.signatures[1]) children.push(new d.Paragraph({ bidirectional:rtl, spacing:{before:300}, alignment: rtl?d.AlignmentType.LEFT:d.AlignmentType.RIGHT, children:[new d.TextRun({text:spec.signatures[1], size:19, rightToLeft:rtl})] }));

  /* Le .docx généré localement est toujours téléchargé tel quel (comportement inchangé) ; quand
     Google Drive est connecté, il est EN PLUS envoyé dans le dossier « Documents générés » avec
     conversion automatique en Google Doc natif (voir uploadBlobToDrive), pour permettre de le
     personnaliser ensuite directement dans l'éditeur Google Docs. La promesse résolue porte l'URL
     Google Docs obtenue (ou null si Drive n'est pas connecté ou si l'envoi a échoué), pour que

            .then(function(res){ if(res && res.payload && res.payload.id) gdocUrl = googleDocEditUrl(res.payload.id); })

        else toast(err && err.code==='declined' ? 'Téléchargement annulé.' : 'Échec de la génération du document Word.');

  /* ================= bilan ================= */
  function periodRange(){
    var now = new Date(), from, to;
    if(state.bilanPeriod==='mois'){ from = new Date(now.getFullYear(), now.getMonth(), 1); to = new Date(now.getFullYear(), now.getMonth()+1, 1); }
    else if(state.bilanPeriod==='trimestre'){ var q = Math.floor(now.getMonth()/3); from = new Date(now.getFullYear(), q*3, 1); to = new Date(now.getFullYear(), q*3+3, 1); }
    else if(state.bilanPeriod==='annee'){ from = new Date(now.getFullYear(),0,1); to = new Date(now.getFullYear()+1,0,1); }
    else { from = state.bilanCustomFrom ? new Date(state.bilanCustomFrom) : new Date(0); to = state.bilanCustomTo ? new Date(state.bilanCustomTo+'T23:59:59') : new Date(); }
    return {from:from, to:to};
  }
  function tasksInPeriod(){
    var r = periodRange();
    return state.tasks.filter(function(t){
      var d = new Date(t.echeance || t.createdAt || t.updatedAt);
      return !isNaN(d) && d>=r.from && d<r.to;
    });
  }
  function bilanStats(){
    var list = tasksInPeriod();
    var byType={}, byWf={}, byEtab={};
    list.forEach(function(t){
      byType[t.taskType]=(byType[t.taskType]||0)+1;
      byWf[t.statut]=(byWf[t.statut]||0)+1;
      var en = t.etablissementNom || etabName(t.etablissementId) || 'Non renseigné';
      byEtab[en]=(byEtab[en]||0)+1;
    });
    return {list:list, byType:byType, byWf:byWf, byEtab:byEtab};
  }
  /* Export Excel (.csv, ouvrable directement dans Excel/LibreOffice/Google Sheets) du bilan de la

    var rows = s.list.map(function(t){
      return {

  /* ================= animations d'entrée (voir taches-animations.css) =================
     Le rendu redessine tout l'écran à chaque changement de données (synchronisation, enregistrement…) :
     pour ne pas rejouer les animations à chaque fois, elles ne sont déclenchées que lorsqu'on ARRIVE
     sur un écran, un filtre ou une fenêtre (clé différente de la précédente) — cartes en cascade,
     fondu de l'écran, glissement de la fenêtre qui s'ouvre. */
  var animState = { viewKey:'', modalCount:0 };
  function animateEntrance(){
    var key = state.view+'|'+(state.filter||'')+'|'+(state.ensEtabFilter||'')+'|'+(state.subEtab||'');
    if(key !== animState.viewKey){
      animState.viewKey = key;
      var host = $('view'+state.view.charAt(0).toUpperCase()+state.view.slice(1));
      if(host){
        host.classList.remove('view-enter'); void host.offsetWidth; host.classList.add('view-enter');
        var items = host.querySelectorAll('.task-card, .rec-row, .carousel-card, .stat, .doc-row, .setup-card');
        Array.prototype.forEach.call(items, function(el, i){ if(i < 24){ el.style.setProperty('--i', i); el.classList.add('anim-in'); } });
      }
    }
    var n = state.modalStack.length;
    if(n > animState.modalCount){
      var ovs = document.querySelectorAll('#overlayRoot .overlay');
      var top = ovs[ovs.length-1];
      if(top){ top.classList.add('modal-enter'); }
    }
    animState.modalCount = n;
  }

  /* Tâches dont l'échéance tombe dans les 7 prochains jours (aujourd'hui inclus), hors tâches déjà
     clôturées — fenêtre glissante plus utile au quotidien qu'une semaine calendaire figée. */
  function tasksUpcomingWeek(){
    var now = new Date(), today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), in7 = new Date(today0.getTime()+7*86400000);
    return state.tasks.filter(function(t){
      if(!t.echeance || t.statut==='cloturee') return false;
      var d = new Date(t.echeance.length<=10 ? t.echeance+'T12:00:00' : t.echeance);
      return !isNaN(d) && d>=today0 && d<=in7;
    }).sort(function(a,b){ return (a.echeance||'').localeCompare(b.echeance||''); });
  }
  /* Journal d'activité « virtuel » : pas de table dédiée, on fusionne simplement les horodatages
     createdAt/updatedAt déjà présents sur chaque enregistrement (tâches, documents, enseignants,
     établissements) — cohérent avec le reste de l'app qui n'a qu'un seul moteur de persistance. */
  function recentActivityEntries(limit){
    var out = [];
    state.tasks.forEach(function(t){
      out.push({ ts: t.updatedAt||t.createdAt, icon: ICONS.calendar,
        title: (t.createdAt===t.updatedAt?'Tâche créée : ':'Tâche mise à jour : ')+(t.titre||''),
        sub: [TT_LABEL[t.taskType], WF_LABEL[t.statut]].filter(Boolean).join(' · '),
        onClick: (function(task){ return function(){ openTaskDetail(task); }; })(t) });
    });
    state.documents.forEach(function(d){
      var t = state.tasks.find(function(x){ return x.id===d.taskId; });
      out.push({ ts: d.updatedAt||d.createdAt, icon: ICONS.doc,
        title: 'Document généré : '+((DOC_TYPE_INFO[d.type]||{}).label||d.titre||''),
        sub: t ? t.titre : '',
        onClick: t ? (function(task){ return function(){ openTaskDetail(task); }; })(t) : null });
    });
    state.enseignants.forEach(function(e){
      out.push({ ts: e.updatedAt||e.createdAt, icon: ICONS.users,
        title: (e.createdAt===e.updatedAt?'Enseignant(e) ajouté(e) : ':'Fiche enseignant(e) mise à jour : ')+(e.nom||''),
        sub: etabName(e.etablissementId)||'',
        onClick: (function(ens){ return function(){ openEnseignantEditor(ens); }; })(e) });
    });
    state.etablissements.forEach(function(e){
      out.push({ ts: e.updatedAt||e.createdAt, icon: ICONS.folder,
        title: (e.createdAt===e.updatedAt?'Établissement ajouté : ':'Fiche établissement mise à jour : ')+(e.nom||''),
        sub: ETAB_CYCLE_LABEL[e.cycle]||'',
        onClick: (function(et){ return function(){ openEtablissementEditor(et); }; })(e) });
    });
    out = out.filter(function(x){ return x.ts; }).sort(function(a,b){ return (b.ts||'').localeCompare(a.ts||''); });
    return out.slice(0, limit||8);
  }

  var PRIO_VAR = {basse:'var(--line)', moyenne:'var(--warn)', haute:'var(--danger)'};
  function taskCardHtml(t){
    var late = isLate(t.echeance, t.statut);
    var vacConflict = t.statut!=='cloturee' ? vacanceForDate(t.echeance) : null;
    var enNom = t.enseignantNom || ensName(t.enseignantId);
    var etNom = t.etablissementNom || etabName(t.etablissementId);
    var meta = [enNom, etNom, (!enNom && !etNom ? t.lieu : '')].filter(Boolean).join(' · ');
    /* Attributs lus par taches-animations.css pour différencier visuellement les tâches : type
       (couleur et icône), statut, priorité, retard et échéance proche (aujourd'hui / demain). */
    var soon = (function(){ if(!t.echeance || late || t.statut==='cloturee') return ''; var d = new Date(t.echeance.length<=10 ? t.echeance+'T12:00:00' : t.echeance), n = new Date(); var diff = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(n.getFullYear(),n.getMonth(),n.getDate()))/86400000); return diff===0 ? 'today' : diff===1 ? 'tomorrow' : ''; })();
    return '<article class="task-card'+(t.statut==='cloturee'?' done':'')+'" style="--prio:'+PRIO_VAR[t.priorite]+'" data-id="'+t.id+'" data-type="'+esc(t.taskType||'autre')+'" data-statut="'+esc(t.statut||'')+'" data-prio="'+esc(t.priorite||'')+'"'+(late?' data-late="1"':'')+(soon?' data-soon="'+soon+'"':'')+'>'+
      '<span class="tc-prio" aria-hidden="true"></span>'+
      '<div class="task-meta"><span class="type-badge '+taskBadgeClass(t.taskType)+'">'+esc(TT_LABEL[t.taskType]||'Autre')+'</span></div>'+
      '<div class="task-title'+(t.statut==='cloturee'?' strike':'')+'">'+esc(t.titre)+'</div>'+
      (meta ? '<div class="task-meta">'+esc(meta)+'</div>' : '')+
      '<div class="task-foot"><span class="pill wf-'+t.statut+'">'+WF_LABEL[t.statut]+'</span>'+
      (t.echeance ? '<span class="due-chip'+(late?' late':(vacConflict?' vacance':''))+'">'+(late?'En retard · ':(vacConflict?'⚠ Vacances · ':(soon==='today'?'Aujourd\'hui · ':(soon==='tomorrow'?'Demain · ':''))))+fmtDate(t.echeance)+'</span>' : '<span></span>')+'</div>'+
      '</article>';
  }

  /* Fait remonter la hiérarchie (académie régionale · direction provinciale) de l'établissement d'un

     sans devoir ouvrir chaque fiche. */
  function etabZoneHierLine(etablissementId){
    var et = state.etablissements.find(function(x){ return x.id===etablissementId; });
    if(!et || !et.zoneId) return '';
    var z = state.zones.find(function(x){ return x.id===et.zoneId; });
    return z ? [z.academieRegionale, z.directionProvinciale].filter(Boolean).join(' · ') : '';
  }

  function objKeysLabel(obj, labelMap){
    var out = {}; Object.keys(obj).forEach(function(k){ out[labelMap[k]||k] = obj[k]; }); return out;
  }
  function barList(obj){
    var entries = Object.keys(obj).map(function(k){ return [k, obj[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    if(!entries.length) return '<div class="empty">Aucune donnée.</div>';
    var max = Math.max.apply(null, entries.map(function(e){ return e[1]; }));
    return entries.map(function(e){ return '<div class="bar-row"><span class="l">'+esc(e[0])+'</span><span class="bar-track"><span class="bar-fill" style="width:'+(max?Math.round(e[1]/max*100):0)+'%"></span></span><span class="v tnum">'+e[1]+'</span></div>'; }).join('');
  }

    else renderDocsGeneresView(host);

  /* ---- Documents générés par l'application (module "gestion des documents") ---- */
  function renderDocsGeneresView(host){
    var q = (state.docsGenQuery||'').toLowerCase();
    var filterType = state.docsGenFilter || 'all';
    var all = state.documents.slice().sort(function(a,b){ return (b.updatedAt||b.date||'').localeCompare(a.updatedAt||a.date||''); });
    var docs = all.filter(function(d){
      if(filterType!=='all' && d.type!==filterType) return false;
      if(!q) return true;
      var task = state.tasks.find(function(t){ return t.id===d.taskId; });
      var hay = [d.titre, DOC_TYPE_INFO[d.type]&&DOC_TYPE_INFO[d.type].label, task&&task.titre,
        task&&(task.enseignantNom||ensName(task.enseignantId)), task&&(task.etablissementNom||etabName(task.etablissementId))]
        .filter(Boolean).join(' ').toLowerCase();
      return hay.indexOf(q)>=0;
    });
    var html = '<div class="btn-row" style="margin-bottom:8px;"><button class="btn ghost sm" id="btnDocsGoTmpl" type="button">'+ICONS.doc+' Personnaliser les modèles de documents</button></div>';
    html += '<div class="search-row"><input type="text" id="docGenSearchInput" placeholder="Rechercher un document…" value="'+esc(state.docsGenQuery)+'"></div>';
    html += '<div class="chips" style="flex-wrap:wrap;">'+chipBtn('all','Tous', filterType)+
      Object.keys(DOC_TYPE_INFO).map(function(k){ return chipBtn(k, DOC_TYPE_INFO[k].label, filterType); }).join('')+'</div>';
    if(!all.length){
      html += '<div class="empty">Aucun document généré pour l\'instant. Ouvrez une tâche, puis créez-y un document (lettre, grille d\'observation, rapport…).</div>';
    } else if(!docs.length){
      html += '<div class="empty">Aucun document ne correspond à ce filtre.</div>';

      html += '<div class="doc-list">'+docs.map(genDocRowHtml).join('')+'</div>';

    var si = $('docGenSearchInput'); if(si) si.oninput = function(){ state.docsGenQuery = si.value; render(); setTimeout(function(){ var el=$('docGenSearchInput'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } },0); };
    host.querySelectorAll('[data-genfilter]').forEach(function(el){ el.onclick = function(){ state.docsGenFilter = el.getAttribute('data-genfilter'); render(); }; });
    host.querySelectorAll('[data-opendoc]').forEach(function(el){
      el.onclick = function(){ var d = state.documents.find(function(x){ return x.id===el.getAttribute('data-opendoc'); }); if(d) openDocEditor(d.taskId, d.type, d); };
    });

      '<div class="doc-info"><div class="t">'+label+'</div><div class="s">'+[esc(ctx), fmtDate(d.date)].filter(Boolean).join(' · ')+'</div></div></div>';

      '<button class="icon-btn" data-dl="'+f.id+'" title="Télécharger" aria-label="Télécharger">'+ICONS.dl+'</button></div></div>';
  }

  /* ================= enregistrement temporaire (brouillon de secours) =================
     Si l'on quitte l'application pendant une saisie ou une génération IA (appel, autre application,
     écran éteint), Android peut fermer la page : le formulaire ouvert et le texte déjà écrit étaient
     alors perdus. On enregistre donc en continu, sur l'appareil (localStorage), un brouillon de
     secours : la pile des fenêtres d'édition ouvertes (tâche, document, enseignant, établissement,
     zone), leurs objets brouillons et la valeur de chaque champ affiché — ainsi que, pendant une
     génération IA, le texte déjà reçu et les notes d'origine. À la réouverture, l'application propose
     de reprendre ce travail là où il en était. Le brouillon est effacé dès que les fenêtres d'édition
     sont fermées (enregistrement ou abandon volontaire). */
  var AUTOSAVE_KEY = 'ci_autosave_brouillon';
  var AUTOSAVE_TYPES = {taskdetail:1, task:1, docedit:1, enseignant:1, etablissement:1, zone:1};
  var aiPending = null; // {fieldId, statusId, original, partial, label} pendant une génération
  function autosaveFieldKey(el){
    if(el.id) return '#'+el.id;
    var parts = [];
    for(var i=0;i<el.attributes.length;i++){ var a = el.attributes[i]; if(a.name.indexOf('data-')===0) parts.push(a.name+'='+a.value); }
    return parts.length ? el.tagName.toLowerCase()+'['+parts.sort().join('|')+']' : '';
  }
  function autosaveCollectFields(root){
    var out = {};
    if(!root) return out;
    root.querySelectorAll('input, textarea, select').forEach(function(el){
      if(el.type==='file' || el.type==='password') return;
      var k = autosaveFieldKey(el); if(!k) return;
      out[k] = (el.type==='checkbox' || el.type==='radio') ? {c: el.checked} : {v: el.value};
    });
    return out;
  }
  function autosaveEditorStack(){
    var st = [];
    for(var i=0;i<state.modalStack.length;i++){
      var m = state.modalStack[i];
      if(!AUTOSAVE_TYPES[m.type]) break;
      try{ st.push(JSON.parse(JSON.stringify(m))); }catch(e){ break; }
    }
    return st;
  }
  function draftAutosave(){
    if(!state.autosaveChecked || state.autosaveOffer) return;
    var stack = autosaveEditorStack();
    if(!stack.length && !aiPending) return;
    var fields = autosaveCollectFields($('overlayRoot'));
    if(aiPending){
      var ta = document.getElementById(aiPending.fieldId);
      var shown = ta ? String(ta.value||'').replace(/\s*▍$/, '') : '';
      if(shown.length > String(aiPending.partial||'').length && shown !== aiPending.original) aiPending.partial = shown;
      if(!stack.length && ta) fields['#'+aiPending.fieldId] = {v: aiPending.partial};
    }
    var snap = { ts: Date.now(), view: state.view, stack: stack, fields: fields,
      draftTask: state.draftTask || null, draftDoc: state.draftDoc || null, draftRecord: state.draftRecord || null,
      ai: aiPending ? JSON.parse(JSON.stringify(aiPending)) : null };
    try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(snap)); }catch(e){}
  }
  function draftAutosaveClearIfIdle(){
    if(!state.autosaveChecked || state.autosaveOffer || aiPending) return;
    if(autosaveEditorStack().length) return;
    try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(e){}
  }
  var autosaveTimer = 0;
  function draftAutosaveSoon(){ clearTimeout(autosaveTimer); autosaveTimer = setTimeout(draftAutosave, 800); }
  function autosaveLabel(snap){
    var top = snap.stack[snap.stack.length-1];
    if(!top) return snap.ai && snap.ai.label ? snap.ai.label : 'texte en cours de rédaction';
    if(top.type==='docedit') return (DOC_TYPE_INFO[top.docType] ? DOC_TYPE_INFO[top.docType].label : 'document');
    if(top.type==='task'){ var t = snap.draftTask; return 'tâche'+(t && t.titre ? ' « '+t.titre+' »' : ''); }
    if(top.type==='enseignant') return 'fiche enseignant'+(snap.draftRecord && snap.draftRecord.nom ? ' « '+snap.draftRecord.nom+' »' : '');
    if(top.type==='etablissement') return 'fiche établissement';
    if(top.type==='zone') return 'zone';
    return 'formulaire';
  }
  function autosaveOfferCheck(){
    state.autosaveChecked = true;
    var snap = null;
    try{ snap = JSON.parse(localStorage.getItem(AUTOSAVE_KEY)||'null'); }catch(e){}
    if(!snap || !snap.ts || Date.now() - snap.ts > 7*24*3600*1000 || (!(snap.stack||[]).length && !snap.ai)){
      try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(e){}
      return;
    }
    state.autosaveOffer = snap;
    pushModal({type:'autosaveOffer'});
  }
  function autosaveOfferHtml(idx){
    var snap = state.autosaveOffer; if(!snap) return '';
    var d = new Date(snap.ts);
    var when = fmtDate(d.toISOString())+' à '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    return '<div class="overlay" style="z-index:'+(50+idx)+'" data-overlay="'+idx+'"><div class="sheet" role="dialog" aria-modal="true">'+
      '<div class="sheet-head"><h2>Travail non enregistré</h2></div>'+
      '<p style="font-size:13px;line-height:1.55;margin:0 0 12px;">L\'application a été fermée pendant que vous travailliez sur : <b>'+esc(autosaveLabel(snap))+'</b> (le '+esc(when)+').'+
      (snap.ai ? ' Une génération IA était en cours : le texte déjà écrit a été conservé.' : '')+'</p>'+
      '<div class="btn-row"><button class="btn ghost" id="btnAutosaveDrop" type="button">Ignorer</button><button class="btn primary" id="btnAutosaveRestore" type="button">Reprendre</button></div></div></div>';
  }
  function autosaveApplyFields(fields){
    var root = document;
    Object.keys(fields||{}).forEach(function(k){
      var el = null;
      try{ el = k.charAt(0)==='#' ? document.getElementById(k.slice(1)) : null; }catch(e){}
      if(!el && k.charAt(0)!=='#'){
        var m = k.match(/^([a-z]+)\[(.*)\]$/); if(!m) return;
        var sel = m[1] + m[2].split('|').map(function(p){ var i = p.indexOf('='); return '['+p.slice(0,i)+'="'+p.slice(i+1).replace(/"/g,'\\"')+'"]'; }).join('');
        try{ el = root.querySelector('#overlayRoot '+sel); }catch(e){ el = null; }
      }
      if(!el) return;
      var f = fields[k];
      if('c' in f) el.checked = f.c; else el.value = f.v;
    });
  }
  function autosaveRestore(){
    var snap = state.autosaveOffer; if(!snap) return;
    state.autosaveOffer = null;
    state.modalStack = (snap.stack||[]).slice();
    if(snap.draftTask) state.draftTask = snap.draftTask;
    if(snap.draftDoc) state.draftDoc = snap.draftDoc;
    if(snap.draftRecord) state.draftRecord = snap.draftRecord;
    if(snap.view) state.view = snap.view;
    render();
    setTimeout(function(){
      autosaveApplyFields(snap.fields);
      var ai = snap.ai;
      if(ai){
        var ta = document.getElementById(ai.fieldId), stEl = ai.statusId ? document.getElementById(ai.statusId) : null;
        if(ta && ai.partial) ta.value = ai.partial;
        var again = null;
        if(stEl){ var row = stEl.previousElementSibling; again = row && row.querySelector ? row.querySelector('button.btn.ai') : null; }
        if(stEl) aiShowInterrupted(stEl, ta, ai.original, again);
        else toast('Texte en cours de génération récupéré. Relancez le bouton IA pour le terminer.');
      }
      draftAutosave();
    }, 0);
  }
  /* Génération interrompue (connexion coupée, application quittée…) : le texte déjà reçu est gardé
     dans le champ, avec deux choix — remettre les notes d'origine, ou relancer la génération. */
  function aiShowInterrupted(statusEl, textarea, original, retryBtn, err){
    statusEl.hidden = false; statusEl.className = 'banner err';
    var why = (err && err.code && err.code!=='tool_error') ? ' ('+esc(geminiErrorMessage(err))+')' : '';
    statusEl.innerHTML = '<div style="flex:1;min-width:0;">La génération a été interrompue'+why+' : le texte déjà écrit a été conservé.'+
      '<div class="btn-row" style="margin-top:8px;justify-content:flex-start;">'+
      (original!=null ? '<button class="btn ghost sm" type="button" data-ai-restore="1">Remettre mes notes d\'origine</button>' : '')+
      (retryBtn ? '<button class="btn ghost sm" type="button" data-ai-retry="1">Relancer</button>' : '')+'</div></div>';
    var rb = statusEl.querySelector('[data-ai-restore]'); if(rb) rb.onclick = function(){ if(textarea) textarea.value = original; statusEl.hidden = true; draftAutosave(); };
    var rt = statusEl.querySelector('[data-ai-retry]'); if(rt) rt.onclick = function(){ if(textarea && original!=null) textarea.value = original; statusEl.hidden = true; retryBtn.click(); };
  }
  var pageClosing = false;
  window.addEventListener('beforeunload', function(){ pageClosing = true; draftAutosave(); });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') draftAutosave(); });
  window.addEventListener('pagehide', function(){ pageClosing = true; draftAutosave(); });
  document.addEventListener('input', function(e){ if(e.target && e.target.closest && (e.target.closest('#overlayRoot') || (aiPending && e.target.id===aiPending.fieldId))) draftAutosaveSoon(); }, true);
  document.addEventListener('change', function(e){ if(e.target && e.target.closest && e.target.closest('#overlayRoot')) draftAutosaveSoon(); }, true);

  /* ================= MODALS ================= */
  function renderModals(){
    var root = $('overlayRoot');
    draftAutosaveClearIfIdle();
    if(!state.modalStack.length){ root.innerHTML=''; return; }
    root.innerHTML = state.modalStack.map(function(m, idx){
      if(m.type==='autosaveOffer') return autosaveOfferHtml(idx);
      if(m.type==='task') return taskModalHtml(idx);
      if(m.type==='taskdetail') return taskDetailModalHtml(idx, m);
      if(m.type==='settings') return settingsModalHtml(idx, m);
      if(m.type==='picker') return pickerModalHtml(idx, m);
      if(m.type==='ensPicker') return state.ensPick ? ensPickerModalHtml(idx) : '';
      if(m.type==='remarquesPicker') return remarquesPickerModalHtml(idx);
      if(m.type==='enseignant') return enseignantModalHtml(idx);
      if(m.type==='etablissement') return etablissementModalHtml(idx);
      if(m.type==='zone') return zoneModalHtml(idx);
      if(m.type==='docedit') return docEditModalHtml(idx, m);
      if(m.type==='driveSetup') return driveSetupModalHtml(idx, m);
      if(m.type==='search') return searchModalHtml(idx);
      if(m.type==='programme') return programmeAnnuelModalHtml(idx);
      if(m.type==='ficheLink') return ficheLinkModalHtml(idx, m);
      if(m.type==='ficheHub') return ficheHubModalHtml(idx);
      if(m.type==='ficheResponsesQueue') return ficheResponsesQueueModalHtml(idx);
      return '';
    }).join('');
    wireModalEvents();
  }

  /* ---- Task editor ---- */
  /* Avertissement en direct (voir vacanceForDate) dans le formulaire de tâche — conteneur toujours
     présent (même vide) pour que #fEcheance.onchange (wireModalEvents) puisse le mettre à jour sans
     redessiner tout le formulaire. */
  function taskVacanceWarningHtml(iso){
    var v = vacanceForDate(iso);
    return '<div id="fVacanceWarning">'+(v ? '<div class="banner warn" style="margin:-4px 0 10px;">'+ICONS.warn+'<div>Cette date tombe pendant <b>'+esc(v.nom||'une période de vacances')+'</b> (du '+fmtDate(v.dateDebut)+' au '+fmtDate(v.dateFin)+').</div></div>' : '')+'</div>';
  }
  /* Titre automatique de la tâche, composé de ses éléments significatifs : type, personne ou public
     visé, établissement (ou lieu), date et heure — ex. « Inspection · ALAMI Sara · Lycée Chorouk ·
     21/10/2026 », « Réunion pédagogique · 12 enseignant(e)s · 3 établissements · 24/10/2026 à 09:00 ».
     Tant que l'utilisateur n'a pas écrit son propre titre, il se met à jour à chaque modification ;
     dès qu'il le modifie à la main, son titre est conservé (bouton « Titre automatique » pour revenir
     au titre composé). */
  function autoTaskTitle(t){
    var parts = [TT_LABEL[t.taskType] || 'Tâche'];
    var ens = t.enseignantNom || ensName(t.enseignantId);
    var etab = t.etablissementNom || etabName(t.etablissementId);
    var inv = t.invites || [];
    if(TASK_TYPES_SINGLE_TARGET[t.taskType]){
      if(ens) parts.push(ens);
      if(etab) parts.push(etab);
      else if(t.lieu) parts.push(t.lieu);
    } else if(TASK_TYPES_NOTIFY[t.taskType]){
      if(inv.length){
        var etabs = []; inv.forEach(function(iv){ var n = (iv.etablissementNom||'').trim(); if(n && etabs.indexOf(n)<0) etabs.push(n); });
        parts.push(inv.length===1 ? inv[0].nom : inv.length+' enseignant(e)s');
        if(t.lieu) parts.push(t.lieu);
        else if(etabs.length===1) parts.push(etabs[0]);
        else if(etabs.length>1) parts.push(etabs.length+' établissements');
      } else if(t.lieu) parts.push(t.lieu);
    } else if(t.lieu) parts.push(t.lieu);
    if(t.echeance) parts.push(fmtDate(t.echeance) + (t.heureDebut ? ' à '+t.heureDebut : ''));
    return parts.filter(Boolean).join(' · ');
  }
  /* La tâche suit le titre automatique si son titre est vide ou identique au dernier titre automatique
     proposé (state.draftTaskAutoTitle, jamais enregistré avec la tâche). */
  function taskTitleIsAuto(t){ return !String(t.titre||'').trim() || t.titre === state.draftTaskAutoTitle; }
  function refreshAutoTaskTitle(){
    var t = state.draftTask; if(!t) return;
    var auto = autoTaskTitle(t);
    if(taskTitleIsAuto(t)){ t.titre = auto; var el = $('fTitre'); if(el && el.value !== auto) el.value = auto; }
    state.draftTaskAutoTitle = auto;
    var b = $('btnAutoTitre'); if(b) b.hidden = (t.titre === auto);
  }

        '<button class="addline" id="btnAutoTitre" type="button"'+(t.titre===autoT?' hidden':'')+' style="margin-top:6px;">'+ICONS.ai+' Titre automatique : '+esc(autoT)+'</button></div>'+
      (singleTarget ? '<div class="field"><label>Établissement</label><button type="button" class="pickbtn" id="btnPickEtab"><span class="'+(t.etablissementNom||etabName(t.etablissementId)?'':'ph')+' t">'+esc(t.etablissementNom||etabName(t.etablissementId)||'Choisir un établissement…')+'</span></button></div>'+
      '<div class="field"><label>Enseignant(e)</label><button type="button" class="pickbtn" id="btnPickEns"><span class="'+(t.enseignantNom||ensName(t.enseignantId)?'':'ph')+' t">'+esc(t.enseignantNom||ensName(t.enseignantId)||'Choisir un(e) enseignant(e)…')+'</span></button></div>' : '')+

      (TASK_TYPES_NOTIFY[t.taskType] ? '<div class="field"><label class="chk-row" style="display:flex;align-items:center;gap:8px;font-weight:500;"><input type="checkbox" id="fNotif"'+(t.notificationEnvoyee?' checked':'')+'> Notification envoyée à l\'administration</label></div>' : '')+

  /* Liste des enseignant(e)s invité(e)s (réunion pédagogique / cours expérimental), choisis avec le

  /* ---- Recherche globale ---- */
  function openGlobalSearch(){ state.searchQuery = ''; pushModal({type:'search'}); }
  /* Comparaison insensible à la casse et aux accents, pour retrouver « Sefrou » en tapant « sefrou »
     ou « Fès » en tapant « fes ». */
  function normalizeSearch(s){
    return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  }
  function globalSearchResults(q){
    var nq = normalizeSearch(q);
    if(!nq) return null;
    function has(s){ return s && normalizeSearch(s).indexOf(nq) !== -1; }
    return {
      zones: state.zones.filter(function(z){ return has(z.nom)||has(z.academieRegionale)||has(z.directionProvinciale)||has(z.commune); }),
      etablissements: state.etablissements.filter(function(e){ return has(e.nom)||has(e.adresse); }),
      enseignants: state.enseignants.filter(function(e){ return has(e.nom)||has(e.matiere); }),
      tasks: state.tasks.filter(function(t){ return has(t.titre)||has(t.description)||has(t.enseignantNom||ensName(t.enseignantId))||has(t.etablissementNom||etabName(t.etablissementId)); }),
      documents: state.documents.filter(function(d){ return has(d.titre)||has(DOC_TYPE_INFO[d.type]&&DOC_TYPE_INFO[d.type].label); })
    };
  }
  /* Chaque ligne de résultat porte son propre attribut data-search* (jamais .rec-row/data-id/
     .task-card réutilisés tels quels) pour ne jamais entrer en collision avec le câblage — non
     cantonné à un host — d'une autre vue restée affichée sous cette fenêtre de recherche (voir
     data-pickrec pour le même principe déjà appliqué au sélecteur générique). */
  function searchModalHtml(idx){
    var q = state.searchQuery || '';
    var res = globalSearchResults(q);
    var html = '<div class="overlay" style="z-index:'+(50+idx)+'" data-overlay="'+idx+'"><div class="sheet" role="dialog" aria-modal="true">'+
      '<div class="sheet-head"><h2>Recherche</h2><button class="icon-btn" data-close-modal="1" aria-label="Fermer">'+ICONS.close+'</button></div>'+
      '<div class="search-row"><input type="text" id="globalSearchInput" placeholder="Zone, établissement, enseignant(e), tâche, document…" value="'+esc(q)+'"></div>';
    if(!q.trim()){
      html += '<div class="empty" style="margin-top:10px;">Tapez pour rechercher dans toutes vos données : zones, établissements, enseignant(e)s, tâches et documents générés.</div>';
    } else {
      var total = res.zones.length+res.etablissements.length+res.enseignants.length+res.tasks.length+res.documents.length;
      if(!total){
        html += '<div class="empty" style="margin-top:10px;">Aucun résultat pour « '+esc(q)+' ».</div>';
      } else {
        if(res.zones.length) html += '<div class="section-label">Zones ('+res.zones.length+')</div><div class="rec-list">'+res.zones.map(function(z){
          return '<div class="rec-row" data-searchzone="'+z.id+'"><div class="avatar">'+ICONS.folder+'</div><div class="rec-info"><div class="t">'+esc(z.nom)+'</div><div class="s">'+esc(zoneHierLine(z)||'—')+'</div></div></div>';
        }).join('')+'</div>';
        if(res.etablissements.length) html += '<div class="section-label">Établissements ('+res.etablissements.length+')</div><div class="rec-list">'+res.etablissements.map(function(e){
          return '<div class="rec-row" data-searchetab="'+e.id+'"><div class="avatar">'+ICONS.folder+'</div><div class="rec-info"><div class="t">'+esc(e.nom)+'</div><div class="s">'+esc(zoneName(e.zoneId)||'Sans zone')+'</div></div></div>';
        }).join('')+'</div>';
        if(res.enseignants.length) html += '<div class="section-label">Enseignant(e)s ('+res.enseignants.length+')</div><div class="rec-list">'+res.enseignants.map(function(e){
          var av = e.photoAssetId ? '<img src="'+assetUrl(e.photoAssetId)+'" alt="">' : initials(e.nom);
          return '<div class="rec-row" data-searchens="'+e.id+'"><div class="avatar">'+av+'</div><div class="rec-info"><div class="t">'+esc(e.nom)+'</div><div class="s">'+esc([e.matiere, etabName(e.etablissementId)].filter(Boolean).join(' · ')||'—')+'</div></div></div>';
        }).join('')+'</div>';
        if(res.tasks.length) html += '<div class="section-label">Tâches ('+res.tasks.length+')</div><div class="rec-list">'+res.tasks.map(function(t){
          var meta = [t.enseignantNom||ensName(t.enseignantId), t.etablissementNom||etabName(t.etablissementId)].filter(Boolean).join(' · ');
          return '<div class="rec-row" data-searchtask="'+t.id+'"><div class="avatar">'+ICONS.doc+'</div><div class="rec-info"><div class="t">'+esc(t.titre)+'</div><div class="s">'+esc([WF_LABEL[t.statut], meta].filter(Boolean).join(' · '))+'</div></div></div>';
        }).join('')+'</div>';
        if(res.documents.length) html += '<div class="section-label">Documents générés ('+res.documents.length+')</div><div class="doc-list">'+res.documents.map(function(d){
          return '<div class="doc-row" data-searchdoc="'+d.id+'" style="cursor:pointer;"><div class="doc-ico">'+ICONS.doc+'</div><div class="doc-info"><div class="t">'+esc((DOC_TYPE_INFO[d.type]||{}).label||d.titre)+'</div><div class="s tnum">'+fmtDate(d.date)+'</div></div></div>';
        }).join('')+'</div>';
      }
    }
    html += '</div></div>';
    return html;
  }

  /* Réglages → Notifications : activation du rappel des évènements imminents (voir
     checkImminentTaskNotifications plus haut) et réglage du délai de prévenance. L'état affiché suit
     directement Notification.permission (jamais de booléen propre à l'application qui pourrait se
     désynchroniser du vrai réglage du navigateur). */
  function notificationsTabHtml(){
    var perm = notifPermission();
    var permLabel = {granted:'Activées', denied:'Bloquées par le navigateur', default:'Non activées', unsupported:'Non prises en charge par ce navigateur'}[perm] || perm;
    var html = '<div class="settings-row"><div><div class="l">Notifications des évènements imminents</div><div class="s">'+esc(permLabel)+'</div></div>'+
      (perm==='default' ? '<button class="btn primary" id="btnEnableNotif" type="button">Activer</button>' : '')+'</div>';
    if(perm==='denied'){
      html += '<p style="font-size:11.5px;color:var(--ink-faint);margin-top:8px;">Les notifications ont été refusées pour cette application dans ce navigateur. Pour les réactiver, autorisez-les dans les réglages du site (généralement via l\'icône de cadenas à côté de l\'adresse), puis revenez sur cet écran.</p>';
    } else if(perm==='unsupported'){
      html += '<p style="font-size:11.5px;color:var(--ink-faint);margin-top:8px;">Ce navigateur ne prend pas en charge les notifications.</p>';
    } else if(perm==='granted'){
      html += '<div class="field" style="margin-top:12px;"><label for="notifLeadInput">Me prévenir combien de minutes avant le début ?</label>'+
        '<input type="number" min="5" max="1440" step="5" id="notifLeadInput" value="'+esc(state.config.notifLeadMinutes||60)+'"></div>'+
        '<div class="btn-row"><button class="btn primary sm" id="btnSaveNotifLead" type="button">Enregistrer</button>'+
        '<button class="btn ghost sm" id="btnTestNotif" type="button">Tester une notification</button></div>';
    }
    html += '<p style="font-size:11px;color:var(--ink-faint);margin-top:14px;">Important : comme l\'application fonctionne entièrement sans serveur (voir Synchronisation), ces alertes ne peuvent se déclencher que pendant qu\'elle reste ouverte — au premier plan ou en arrière-plan récent. Gardez-la ouverte à l\'approche de vos évènements pour recevoir le rappel ; sans heure de début précisée, un seul rappel est envoyé le jour même de l\'échéance.</p>';

          '<div class="btn-row">'+(dt.gdocUrl

          '<div class="field" style="margin-bottom:0;"><label>Nature du texte à produire (instruction pour l\'IA)</label><textarea class="aizone-instr-input" data-i="'+i+'" rows="2" placeholder="Ex. Rédige 3 recommandations concrètes et bienveillantes pour l\'enseignant(e), à partir des constats déjà saisis dans le document.">'+esc(z.instruction)+'</textarea></div>'+
          '<div class="btn-row" style="margin-top:8px;"><button class="btn danger sm" data-rmaizone="'+i+'" type="button">Supprimer cette zone</button></div>'+
          '</div>';
      }).join('')+'</div>'+
      '<button class="addline" id="btnAddAiZone" type="button">'+ICONS.plus+' Ajouter une zone IA</button>';
    var hasContent = dt.logoAssetId || aiZones.length || Object.keys(dtFields).some(function(k){ return dtFields[k]; });

  /* Suivi pédagogique : historique des visites/inspections déjà effectuées pour cet(te) enseignant(e),
     avec accès direct à chaque tâche pour retrouver notes et documents générés. */
  function ensVisitHistoryHtml(e){
    var visits = state.tasks.filter(function(t){ return t.enseignantId===e.id; })
      .sort(function(a,b){ return (b.echeance||b.updatedAt||'').localeCompare(a.echeance||a.updatedAt||''); });
    var html = '<div class="field"><label>Historique des visites ('+visits.length+')</label>';
    if(!visits.length){ html += '<div class="empty" style="margin-top:2px;">Aucune visite ou inspection enregistrée pour cet(te) enseignant(e).</div>'; }
    else {
      html += '<div class="rec-list" id="ensVisitList">'+visits.map(function(t){
        var late = isLate(t.echeance, t.statut);
        var sub = [TT_LABEL[t.taskType]||t.taskType, WF_LABEL[t.statut]||t.statut, t.echeance?fmtDate(t.echeance):''].filter(Boolean).join(' · ');
        return '<div class="rec-row" data-visit="'+t.id+'"><div class="avatar" style="'+(late?'color:var(--danger);':'')+'">'+ICONS.folder+'</div>'+
          '<div class="rec-info"><div class="t">'+esc(t.titre)+'</div><div class="s">'+esc(sub)+'</div></div></div>';
      }).join('')+'</div>';
    }
    if(visits.length){
      html += '<div class="setup-actions" style="margin-top:8px;"><button class="btn ghost sm" id="btnPrintHistorique" type="button">'+ICONS.print+' Imprimer l\'historique</button>'+
        '<button class="btn ghost sm" id="btnPdfHistorique" type="button">PDF</button>'+
        '<button class="btn ghost sm" id="btnDocxHistorique" type="button">Word</button></div>'+
        '<div class="banner info" id="histGenStatus" hidden style="margin-top:8px;"></div>';
    }
    html += '</div>';
    return html;
  }
  /* « Pièce jointe » historique des activités d'un(e) enseignant(e) : un document de synthèse
     (imprimable, PDF, Word — comme le Bilan) listant toutes ses visites/inspections, avec sa photo
     si elle a été ajoutée à sa fiche. Généré à la demande depuis sa fiche, sans créer d'enregistrement
     « document » séparé (comme le Bilan), puisqu'il reflète toujours l'état courant de ses tâches. */
  function buildEnsHistoriqueSpec(e){
    var visits = state.tasks.filter(function(t){ return t.enseignantId===e.id; })
      .sort(function(a,b){ return (b.echeance||b.updatedAt||'').localeCompare(a.echeance||a.updatedAt||''); });
    var etab = state.etablissements.find(function(x){ return x.id===e.etablissementId; });
    var spec = {
      titre: 'Historique des activités — '+e.nom,
      meta: [['Enseignant(e)', e.nom], ['Établissement', etab?etab.nom:'—'], ['Matière', e.matiere||'—'], ["Date d'édition", fmtDate(todayStr())]],
      tables: [{ headers:['Date','Type','Titre','Statut'], rows: visits.map(function(t){
        return [t.echeance?fmtDate(t.echeance):'—', TT_LABEL[t.taskType]||t.taskType, t.titre, WF_LABEL[t.statut]||t.statut];
      }) }],
      sections: [], signatures: ["Signature de l'inspecteur(trice)"]
    };
    if(e.photoAssetId) spec.photoAssetId = e.photoAssetId;
    return spec;
  }

      '<div class="setup-actions" style="margin-top:6px;">'+

      '</div>'+
      (state.mcpReady && !d.gdocUrl ? '<p style="font-size:11px;color:var(--ink-faint);margin-top:6px;">Touchez « Word » : une copie modifiable sera aussi créée dans Google Docs (dossier « Documents générés » de votre Drive).</p>' : '')+
      '<div class="banner info" id="genDocStatus" hidden style="margin-top:8px;"></div>'+
      '</div></div>';
  }

  /* ================= wire modal events ================= */
  function wireModalEvents(){

    /* -- recherche globale -- */

      document.querySelectorAll('[data-searchens]').forEach(function(el){ el.onclick=function(){ var e=state.enseignants.find(function(x){return x.id===el.getAttribute('data-searchens');}); if(e){ closeTopModal(); openEnseignantEditor(e); } }; });
      document.querySelectorAll('[data-searchtask]').forEach(function(el){ el.onclick=function(){ var t=state.tasks.find(function(x){return x.id===el.getAttribute('data-searchtask');}); if(t){ closeTopModal(); openTaskDetail(t); } }; });
      document.querySelectorAll('[data-searchdoc]').forEach(function(el){ el.onclick=function(){ var d=state.documents.find(function(x){return x.id===el.getAttribute('data-searchdoc');}); if(d){ closeTopModal(); openDocEditor(d.taskId, d.type, d); } }; });
    }

    /* -- task editor -- */
    function syncTaskFields(){
      var t = state.draftTask, el;
      el=$('fTitre'); if(el) t.titre=el.value; el=$('fEcheance'); if(el) t.echeance=el.value;
      el=$('fHeureDebut'); if(el) t.heureDebut=el.value; el=$('fHeureFin'); if(el) t.heureFin=el.value;
      el=$('fLieu'); if(el) t.lieu=el.value; el=$('fLienConnexion'); if(el) t.lienConnexion=el.value;
      el=$('fDesc'); if(el) t.description=el.value;
      el=$('fNotif'); if(el) t.notificationEnvoyee=el.checked;
      /* Les invité(e)s (t.invites) sont mis à jour directement par le sélecteur multiple (voir
         btnPickInvites / data-rminvite) : plus rien à relire dans le formulaire ici. */
    }
    /* Avertissement de concomitance (voir vacanceForDate/taskVacanceWarningHtml) mis à jour en direct à
       chaque changement de date, sans redessiner tout le formulaire (ni perdre le focus/la sélection en
       cours sur les autres champs). */
    var fEch = $('fEcheance');
    if(fEch) fEch.onchange = function(){
      state.draftTask.echeance = fEch.value;
      var warnBox = $('fVacanceWarning');
      if(warnBox) warnBox.outerHTML = taskVacanceWarningHtml(fEch.value);
      refreshAutoTaskTitle();
    };
    ['fHeureDebut','fLieu'].forEach(function(id){ var el = $(id); if(el) el.addEventListener('change', function(){
      if(id==='fHeureDebut') state.draftTask.heureDebut = el.value; else state.draftTask.lieu = el.value;
      refreshAutoTaskTitle();
    }); });
    var fTit = $('fTitre'); if(fTit) fTit.oninput = function(){
      state.draftTask.titre = fTit.value;
      var b = $('btnAutoTitre'); if(b) b.hidden = (fTit.value === state.draftTaskAutoTitle);
    };
    var bAutoT = $('btnAutoTitre'); if(bAutoT) bAutoT.onclick = function(){ syncTaskFields(); state.draftTask.titre = ''; render(); };
    var selType = $('fTypeSel'); if(selType) selType.onchange = function(){ syncTaskFields(); state.draftTask.taskType=selType.value; render(); };
    var segP = $('fPrioSeg'); if(segP) segP.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ syncTaskFields(); state.draftTask.priorite=b.getAttribute('data-v'); render(); }; });
    var segNote = $('fNoteSeg'); if(segNote) segNote.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ syncTaskFields(); state.draftTask.noteGlobale=b.getAttribute('data-v'); render(); }; });
    /* Établissement puis enseignant(e) : le sélecteur d'enseignant s'ouvre filtré sur l'établissement
       déjà choisi ; choisir un(e) enseignant(e) renseigne aussi son établissement, et changer
       d'établissement retire l'enseignant(e) s'il/elle n'y exerce pas. */
    var bpe = $('btnPickEtab'); if(bpe) bpe.onclick = function(){ syncTaskFields(); openPicker('etablissement', function(r){
      var t = state.draftTask;
      t.etablissementId=r.id; t.etablissementNom=r.nom;
      var ens = t.enseignantId ? state.enseignants.find(function(x){ return x.id===t.enseignantId; }) : null;
      if(ens && ens.etablissementId && ens.etablissementId!==r.id){ t.enseignantId=null; t.enseignantNom=''; }
    }); };
    var bpn = $('btnPickEns'); if(bpn) bpn.onclick = function(){ syncTaskFields(); var t0 = state.draftTask; openEnsPicker({ etabId: t0.etablissementId, onPick: function(r){
      var t = state.draftTask;
      t.enseignantId=r.id; t.enseignantNom=r.nom;
      if(r.etablissementId && etabName(r.etablissementId)){ t.etablissementId=r.etablissementId; t.etablissementNom=etabName(r.etablissementId); }
    }}); };
    var bInv = $('btnPickInvites'); if(bInv) bInv.onclick = function(){ syncTaskFields(); var t0 = state.draftTask; openEnsPicker({ multi:true, title:'Enseignant(e)s invité(e)s',
      selectedIds: (t0.invites||[]).map(function(iv){ return iv.enseignantId; }),
      onPickMany: function(list){
        state.draftTask.invites = list.map(function(e){ return {enseignantId:e.id, nom:e.nom, ppr:e.ppr||'', etablissementNom: etabName(e.etablissementId)||''}; });
      }}); };
    document.querySelectorAll('[data-rminvite]').forEach(function(el){ el.onclick = function(){ syncTaskFields(); var id = el.getAttribute('data-rminvite');
      state.draftTask.invites = (state.draftTask.invites||[]).filter(function(iv){ return iv.enseignantId!==id; }); render(); }; });
    /* Description générée par IA à partir du seul titre (+ le peu de contexte déjà renseigné :
       type de tâche, établissement, enseignant, échéance) — utile pour ne pas laisser les notes
       vides sur une tâche vite créée. Mode « enrichir » standard de aiDraft si des notes existent déjà. */
    var aiTaskDesc = $('btnAiTaskDesc'); if(aiTaskDesc) aiTaskDesc.onclick = function(){
      syncTaskFields();
      var t = state.draftTask;
      if(!(t.titre||'').trim()){ toast('Ajoutez un titre avant de lancer l\'IA.'); return; }
      var ctx = ["Titre : "+t.titre, "Type de tâche : "+(TT_LABEL[t.taskType]||t.taskType||'—')];
      if(t.etablissementNom||etabName(t.etablissementId)) ctx.push("Établissement : "+(t.etablissementNom||etabName(t.etablissementId)));
      if(t.enseignantNom||ensName(t.enseignantId)) ctx.push("Enseignant(e) : "+(t.enseignantNom||ensName(t.enseignantId)));
      if(t.echeance) ctx.push("Échéance : "+fmtDate(t.echeance));
      var prompt = "Tu es un inspecteur pédagogique au Maroc. À partir de ces informations sur une tâche à réaliser, rédige une description brève et concrète (2-4 lignes, en français, ton professionnel), précisant ce qui est prévu et pourquoi, sans inventer de détails non mentionnés :\n"+ctx.join('\n');
      aiDraft(aiTaskDesc, $('aiTaskDescStatus'), $('fDesc'), prompt);
    };
    var saveBtn = $('btnSaveTask');
    if(saveBtn) saveBtn.onclick = function(){
      syncTaskFields();
      var t = state.draftTask;
      t.titre = (t.titre||'').trim() || autoTaskTitle(t) || '(sans titre)';
      state.draftTaskAutoTitle = undefined;
      recordSet('task', t).then(function(){ closeTopModal(); toast('Tâche enregistrée.'); }).catch(function(){ toast('Échec de l\'enregistrement.'); });
    };
    var delBtn = $('btnDeleteTask'); if(delBtn) delBtn.onclick = function(){ recordDelete('task', state.draftTask.id).then(function(){ closeTopModal(); toast('Tâche supprimée.'); }); };

    /* -- task detail -- */
    var stepper = $('wfStepper');
    if(stepper) stepper.querySelectorAll('.step').forEach(function(b){
      b.onclick = function(){
        var m = state.modalStack[state.modalStack.length-1];
        var t = state.tasks.find(function(x){ return x.id===m.taskId; });
        if(t){ var nt=Object.assign({},t,{statut:b.getAttribute('data-v')}); recordSet('task', nt); }
      };
    });
    document.querySelectorAll('[data-newdoc]').forEach(function(el){ el.onclick = function(){ var m=state.modalStack[state.modalStack.length-1]; openDocEditor(m.taskId, el.getAttribute('data-newdoc'), null); }; });
    document.querySelectorAll('[data-opendoc]').forEach(function(el){ el.onclick = function(){ var d=state.documents.find(function(x){ return x.id===el.getAttribute('data-opendoc'); }); if(d) openDocEditor(d.taskId, d.type, d); }; });
    var editTaskBtn = $('btnEditTask'); if(editTaskBtn) editTaskBtn.onclick = function(){ var m=state.modalStack[state.modalStack.length-1]; var t=state.tasks.find(function(x){return x.id===m.taskId;}); openTaskEditor(t); };
    var delTask2 = $('btnDeleteTask2'); if(delTask2) delTask2.onclick = function(){ var m=state.modalStack[state.modalStack.length-1]; recordDelete('task', m.taskId).then(function(){ closeTopModal(); toast('Tâche supprimée.'); }); };
    var genAttBtn = $('btnGenAttestations'); if(genAttBtn) genAttBtn.onclick = function(){
      var m = state.modalStack[state.modalStack.length-1];
      var t2 = state.tasks.find(function(x){ return x.id===m.taskId; });
      if(t2) ensureAttestationsForInvites(t2);
    };
    var addTaskAttach = $('btnAddTaskAttach'); if(addTaskAttach) addTaskAttach.onclick = function(){
      var m = state.modalStack[state.modalStack.length-1];
      taskAttachTargetId = m.taskId;
      $('fileTaskAttachInput').click();
    };
    document.querySelectorAll('[data-rmtaskattach]').forEach(function(el){ el.onclick = function(){
      var m = state.modalStack[state.modalStack.length-1];
      if(!confirm('Retirer cette pièce jointe ? Elle sera aussi mise à la corbeille de Google Drive.')) return;
      removeTaskAttachment(m.taskId, parseInt(el.getAttribute('data-rmtaskattach')));
    }; });
    document.querySelectorAll('[data-opentaskattach]').forEach(function(el){ el.onclick = function(){
      var m = state.modalStack[state.modalStack.length-1];
      openTaskAttachment(m.taskId, el.getAttribute('data-opentaskattach'));
    }; });


    /* -- settings -- */
    document.querySelectorAll('[data-stab]').forEach(function(el){ el.onclick=function(){ var m=state.modalStack[state.modalStack.length-1]; m.tab=el.getAttribute('data-stab'); render(); }; });
    var btnConnectDrive = $('btnConnectDrive'); if(btnConnectDrive) btnConnectDrive.onclick = connectGoogleDrive;
    var btnDisconnectDrive = $('btnDisconnectDrive'); if(btnDisconnectDrive) btnDisconnectDrive.onclick = disconnectGoogleDrive;
    var btnEditClientId = $('btnEditClientId'); if(btnEditClientId) btnEditClientId.onclick = openDriveSetup;

    /* -- configuration Google Drive (identifiant client) -- */
    var btnSaveClientId = $('btnSaveClientId');
    if(btnSaveClientId) btnSaveClientId.onclick = function(){
      var val = ($('gClientId').value||'').trim();
      if(!val){ state.driveSetupError = 'Collez votre identifiant client Google.'; render(); return; }
      if(val.indexOf('.apps.googleusercontent.com')===-1){
        state.driveSetupError = "Cet identifiant ne semble pas valide (il doit se terminer par « .apps.googleusercontent.com »).";
        render(); return;
      }
      state.driveSetupError = null;
      gisTokenClient = null; driveAccessToken = null; driveTokenExpiresAt = 0; state.mcpReady = false;
      configSet({ googleClientId: val, driveSetupSeen: true }).then(function(){ closeTopModal(); toast('Identifiant Google enregistré.'); });
    };
    var btnClearClientId = $('btnClearClientId');
    if(btnClearClientId) btnClearClientId.onclick = function(){
      if(!confirm("Réinitialiser la connexion Google Drive ? Vous devrez coller un nouvel identifiant client pour resynchroniser. Vos données déjà présentes dans votre Drive ne sont pas supprimées.")) return;
      gisTokenClient = null; driveAccessToken = null; driveTokenExpiresAt = 0; state.mcpReady = false;
      configSet({ googleClientId: null }).then(function(){ state.driveSetupError = null; render(); });
    };
    var btnLaterClientId = $('btnLaterClientId');
    if(btnLaterClientId) btnLaterClientId.onclick = function(){ configSet({driveSetupSeen:true}); closeTopModal(); };
    var btnCreateSheet = $('btnCreateSheet'); if(btnCreateSheet) btnCreateSheet.onclick = createSheet;
    var btnUnlink = $('btnUnlink'); if(btnUnlink) btnUnlink.onclick = unlinkSheet;
    var btnShowLink = $('btnShowLink'); if(btnShowLink) btnShowLink.onclick = function(){ var m=state.modalStack[state.modalStack.length-1]; m.linkMode=true; render(); };
    var sheetSearchBtn = $('sheetSearchBtn');
    if(sheetSearchBtn) sheetSearchBtn.onclick = function(){
      var q = $('sheetSearch').value.trim();
      var query = "mimeType = 'application/vnd.google-apps.spreadsheet'" + (q ? " and title contains '"+q.replace(/'/g,"\\'")+"'" : '');
      $('sheetResults').innerHTML = '<div class="empty">Recherche…</div>';
      mcpCall('search_files', {query: query, pageSize: 10, excludeContentSnippets:true}).then(function(res){
        var files = (res.payload && res.payload.files) || [];
        $('sheetResults').innerHTML = files.length ? files.map(function(f){ return '<div class="doc-row" data-linksheet="'+f.id+'" style="cursor:pointer;"><div class="doc-ico">'+ICONS.sheet+'</div><div class="doc-info"><div class="t">'+esc(f.title)+'</div><div class="s tnum">'+fmtDate(f.modifiedTime)+'</div></div></div>'; }).join('') : '<div class="empty">Aucune feuille trouvée.</div>';
        $('sheetResults').querySelectorAll('[data-linksheet]').forEach(function(el){ el.onclick = function(){ var f=files.find(function(x){return x.id===el.getAttribute('data-linksheet');}); if(f){ linkExistingSheet(f); closeTopModal(); } }; });
      }).catch(function(err){ $('sheetResults').innerHTML = '<div class="banner err">'+ICONS.warn+'<div>'+esc(mcpErrorMessage(err))+'</div></div>'; });
    };
    var saveTmpl = $('btnSaveTmpl'); if(saveTmpl) saveTmpl.onclick = function(){ templatesSet({entete:$('tmplEntete').value}); toast('En-tête enregistré.'); };
    var resetTmpl = $('btnResetTmpl'); if(resetTmpl) resetTmpl.onclick = function(){ templatesSet({entete:DEFAULT_ENTETE}); toast('En-tête réinitialisé.'); };
    /* Critères de la grille d'observation : personnalisation propre au type « observation », affichée
       et enregistrée avec le reste de son modèle ci-dessous (voir docTemplatesEditorHtml) — state.templates.criteres
       reste néanmoins un tableau global unique en stockage (seul ce type le consomme aujourd'hui, voir
       applyObsVariante), donc aucune migration de données n'est nécessaire, seul l'endroit où on l'édite change. */
    function syncCritInputs(){ document.querySelectorAll('.crit-input').forEach(function(inp){ state.templates.criteres[parseInt(inp.getAttribute('data-i'))] = inp.value; }); }
    document.querySelectorAll('[data-rmcrit]').forEach(function(el){ el.onclick=function(){ syncCritInputs(); state.templates.criteres.splice(parseInt(el.getAttribute('data-rmcrit')),1); render(); }; });
    var addCrit = $('btnAddCrit'); if(addCrit) addCrit.onclick = function(){ syncCritInputs(); state.templates.criteres.push('Nouveau critère'); render(); };

      el.onclick = function(){ state.tmplEditorType = el.getAttribute('data-tmpltype'); render(); };
    });
    var btnPickDocTmplLogo = $('btnPickDocTmplLogo');
    if(btnPickDocTmplLogo) btnPickDocTmplLogo.onclick = function(){
      docTmplLogoTarget = state.tmplEditorType || Object.keys(DOC_TYPE_INFO)[0];
      $('fileDocTmplLogoInput').click();
    };
    var btnRmDocTmplLogo = $('btnRmDocTmplLogo');
    if(btnRmDocTmplLogo) btnRmDocTmplLogo.onclick = function(){

      var cur = docTmpls[type];
      if(cur && cur.logoAssetId) removeAsset(cur.logoAssetId);
      if(cur) docTmpls[type] = Object.assign({}, cur, {logoAssetId:null});
      templatesSet({docTemplates:docTmpls}); render();
    };
    /* Lit toutes les zones de texte des champs personnalisables du type affiché (une par champ, voir
       DOC_TEMPLATE_FIELDS/docTemplatesEditorHtml) et renvoie {champ: texte, ...} — utilisé aussi bien
       par « Enregistrer » que par « Créer le modèle sur Google Docs » (pour repartir du texte déjà
       saisi dans l'app plutôt que de recréer un document vide). */
    function readTmplFieldsFromDom(){
      var out = {};
      document.querySelectorAll('.tmplfield-input').forEach(function(ta){ out[ta.getAttribute('data-field')] = ta.value; });
      return out;
    }
    /* Zones IA du type affiché : les libellés/instructions saisis n'existent que dans le DOM tant que
       « Enregistrer ce modèle » n'a pas été touché (même principe que pieces/tableaux ailleurs dans
       l'app) — on les relit ici par position pour reconstituer le tableau, en conservant l'id existant
       de chaque zone (stable, utilisé pour retrouver d.aiZoneValues[id] sur un document précis). */
    function readAiZonesFromDom(existing){
      existing = existing || [];
      var labels = document.querySelectorAll('.aizone-label-input');
      var instrs = document.querySelectorAll('.aizone-instr-input');
      var out = [];
      labels.forEach(function(inp, i){
        var prev = existing[i] || {};
        out.push({ id: prev.id || uid(), label: inp.value, instruction: instrs[i] ? instrs[i].value : (prev.instruction||'') });
      });
      return out;
    }
    var btnSaveDocTmpl = $('btnSaveDocTmpl');
    if(btnSaveDocTmpl) btnSaveDocTmpl.onclick = function(){
      var type = state.tmplEditorType || Object.keys(DOC_TYPE_INFO)[0];
      var docTmpls = Object.assign({}, state.templates.docTemplates||{});
      var cur = docTmpls[type] || {};
      var newFields = readTmplFieldsFromDom();
      var newAiZones = readAiZonesFromDom(cur.aiZones);
      docTmpls[type] = Object.assign({}, cur,
        Object.keys(newFields).length ? {fields: Object.assign({}, cur.fields, newFields)} : {},
        {aiZones: newAiZones});
      var patch = {docTemplates:docTmpls};
      if(type==='observation'){ syncCritInputs(); patch.criteres = state.templates.criteres; }
      templatesSet(patch);
      toast('Modèle enregistré pour « '+(DOC_TYPE_INFO[type]||{}).label+' ».');
    };
    var addAiZone = $('btnAddAiZone'); if(addAiZone) addAiZone.onclick = function(){

      var cur = docTmpls[type] || {};
      var zones = readAiZonesFromDom(cur.aiZones).concat([{id:uid(), label:'', instruction:''}]);
      docTmpls[type] = Object.assign({}, cur, {aiZones: zones});
      templatesSet({docTemplates:docTmpls}); render();

    document.querySelectorAll('[data-rmaizone]').forEach(function(el){

        var type = state.tmplEditorType || Object.keys(DOC_TYPE_INFO)[0];
        var docTmpls = Object.assign({}, state.templates.docTemplates||{});
        var cur = docTmpls[type] || {};
        var zones = readAiZonesFromDom(cur.aiZones);
        zones.splice(parseInt(el.getAttribute('data-rmaizone')),1);
        docTmpls[type] = Object.assign({}, cur, {aiZones: zones});
        templatesSet({docTemplates:docTmpls}); render();
      };
    });
    var btnDocTmplGdocOpen = $('btnDocTmplGdocOpen');
    if(btnDocTmplGdocOpen) btnDocTmplGdocOpen.onclick = function(){
      var type = state.tmplEditorType || Object.keys(DOC_TYPE_INFO)[0];
      var newFields = readTmplFieldsFromDom();
      if(Object.keys(newFields).length){
        var docTmpls0 = Object.assign({}, state.templates.docTemplates||{});
        docTmpls0[type] = Object.assign({}, docTmpls0[type], {fields: Object.assign({}, (docTmpls0[type]||{}).fields, newFields)});
        templatesSet({docTemplates:docTmpls0});
      }
      btnDocTmplGdocOpen.disabled = true;
      openOrCreateTemplateGdoc(type).then(function(){
        render();
      }).catch(function(err){
        btnDocTmplGdocOpen.disabled = false;
        var statusEl = $('tmplGdocStatus');
        if(statusEl){ statusEl.hidden = false; statusEl.textContent = mcpErrorMessage(err); }
      });
    };
    var btnDocTmplGdocPull = $('btnDocTmplGdocPull');
    if(btnDocTmplGdocPull) btnDocTmplGdocPull.onclick = function(){
      var type = state.tmplEditorType || Object.keys(DOC_TYPE_INFO)[0];
      btnDocTmplGdocPull.disabled = true;
      var statusEl = $('tmplGdocStatus'); if(statusEl) statusEl.hidden = true;
      pullTemplateFromGdoc(type).then(function(){
        render(); toast('Texte récupéré depuis Google Docs.');
      }).catch(function(err){
        btnDocTmplGdocPull.disabled = false;
        if(statusEl){ statusEl.hidden = false; statusEl.textContent = mcpErrorMessage(err); }
      });
    };
    var btnResetDocTmpl = $('btnResetDocTmpl');
    if(btnResetDocTmpl) btnResetDocTmpl.onclick = function(){

      render(); toast('Fichier joint.');
      var dr = state.draftRecord || {};
      uploadAttachmentToDrive(f, ['Enseignants', (dr.nom || 'Sans nom')+(dr.ppr ? ' — '+dr.ppr : '')]).then(function(drive){
        if(!drive) return;
        entry.driveFileId = drive.driveFileId; entry.driveUrl = drive.driveUrl;
        render();
        /* Si l'enseignant(e) est déjà enregistré(e) (l'ajout de pièce jointe a eu lieu après
           « Enregistrer », ou l'upload Drive a résolu après la fermeture du formulaire), on met aussi
           à jour la copie persistée pour que le lien Drive survive à un rechargement de page — sinon
           seule la copie en mémoire (state.draftRecord) porterait le lien, jamais sauvegardée telle
           quelle sur le disque. */
        var saved = state.enseignants.find(function(x){ return x.id===recId; });
        if(saved){
          var idx = (saved.attachments||[]).findIndex(function(a){ return a.assetId===res.id; });
          if(idx>=0){
            var updated = Object.assign({}, saved, {attachments: saved.attachments.slice()});
            updated.attachments[idx] = Object.assign({}, updated.attachments[idx], {driveFileId:drive.driveFileId, driveUrl:drive.driveUrl});
            recordSet('enseignant', updated);
          }
        }
      });
    }).catch(function(err){ toast(assetsErrorMessage(err)); });
  };
  /* Documents de travail utilisés lors d'une réunion pédagogique / d'un cours expérimental, joints
     directement à la tâche (task.attachments) — même mécanisme de stockage que les pièces jointes
     enseignant ci-dessus, mais ciblant la tâche en cours via taskAttachTargetId plutôt que
     state.draftRecord, puisque ce bouton vit dans le détail de tâche (pas un formulaire d'édition). */
  $('fileTaskAttachInput').onchange = function(){
    var files = Array.prototype.slice.call(this.files||[]); this.value=''; var tid = taskAttachTargetId; taskAttachTargetId = null;
    if(!files.length || !tid) return;
    attachFilesToTask(tid, files);
  };
  function profilImageOnChange(){
    return function(){
      var f = this.files[0]; this.value=''; if(!f || !profilImageTarget) return;
      var key = profilImageTarget; profilImageTarget = null;
      uploadAsset(f).then(function(res){
        var p = state.templates.profil, field = key+'AssetId';
        if(p[field]) removeAsset(p[field]);
        p[field] = res.id;
        templatesSet({profil:p}); render(); toast('Image ajoutée.');
      }).catch(function(err){ toast(assetsErrorMessage(err)); });
    };
  }
  $('fileLogoInput').onchange = profilImageOnChange();
  $('fileCachetInput').onchange = profilImageOnChange();
  $('fileSignatureInput').onchange = profilImageOnChange();
  $('fileDocTmplLogoInput').onchange = function(){
    var f = this.files[0]; this.value=''; if(!f || !docTmplLogoTarget) return;
    var type = docTmplLogoTarget; docTmplLogoTarget = null;
    uploadAsset(f).then(function(res){
      var docTmpls = Object.assign({}, state.templates.docTemplates||{});
      var cur = docTmpls[type] || {};
      if(cur.logoAssetId) removeAsset(cur.logoAssetId);
      docTmpls[type] = Object.assign({}, cur, {logoAssetId: res.id});
      templatesSet({docTemplates:docTmpls}); render(); toast('Image ajoutée.');
    }).catch(function(err){ toast(assetsErrorMessage(err)); });
  };
  $('fileImportInput').onchange = function(){
    var f = this.files[0]; this.value=''; if(!f || !importTarget) return;
    importCSVFile(f, importTarget); importTarget = null;
  };

  /* ================= top-level events ================= */
  function openSidebar(){ $('sidebar').classList.add('open'); $('sidebarBackdrop').classList.add('open'); }
  function closeSidebar(){ $('sidebar').classList.remove('open'); $('sidebarBackdrop').classList.remove('open'); }
  function goToTab(view){
    state.view = view;
    if(view==='docs' && state.subDocs==='drive' && !state.docs.length && !state.docsLoading) loadRecentDocs();
    closeSidebar();
    render();
  }
  document.querySelectorAll('[data-tab]').forEach(function(t){
    t.onclick = function(){ goToTab(t.getAttribute('data-tab')); };
  });
  $('btnMenu').onclick = openSidebar;
  $('btnSidebarClose').onclick = closeSidebar;
  $('sidebarBackdrop').onclick = closeSidebar;
  $('btnSideTemplates').onclick = function(){ closeSidebar(); pushModal({type:'settings', tab:'templates'}); };
  /* Le Programme annuel EST le plan d'action tel que conçu par l'inspecteur(trice) (grille officielle
     par catégorie/activité/mois) : ce bouton, très visible dans le menu principal, ouvre directement
     son propre écran (type 'programme', voir renderModals/programmeAnnuelModalHtml) plutôt qu'un
     document ponctuel distinct ou un onglet noyé dans Paramètres — voir la suppression de
     openQuickPlanAction()/quickPlanActionModalHtml() ainsi que de l'onglet « Programme annuel » des
     Réglages (désormais un écran à part entière, accessible uniquement depuis ce bouton). */
  $('btnSidePlanAction').onclick = function(){ closeSidebar(); pushModal({type:'programme'}); };
  $('btnSearch').onclick = openGlobalSearch;
  $('btnSync').onclick = doSync;
  $('btnSettings').onclick = openSettings;
  $('syncLink').onclick = function(){ if(!state.mcpReady) connectGoogleDrive(); else if(!state.config.sheetFileId) autoLinkExistingData(); else doSync(); };
  $('fabAdd').onclick = function(){
    if(state.view==='tasks') openTaskEditor(null);
    else if(state.view==='enseignants') openEnseignantEditor(null);
    else if(state.view==='etablissements'){ if(state.subEtab==='zones') openZoneEditor(null); else openEtablissementEditor(null); }
  };

  /* ================= boot ================= */
  function start(){
    initCapabilities();
    if(!state.config.googleClientId && !state.config.driveSetupSeen){ pushModal({type:'driveSetup'}); }
    render();
    autosaveOfferCheck();
    /* Toujours après le premier rendu (données locales déjà affichées, hors-ligne d'abord) : tente
       une synchronisation silencieuse en arrière-plan si cet appareil a déjà été connecté. */
    autoSyncOnLaunch();
    /* Notifications des évènements imminents, de l'approche des vacances et des conflits de planning
       (voir checkImminentTaskNotifications/checkUpcomingVacancesNotifications/checkTaskVacanceConflicts
       ci-dessus) : un contrôle immédiat, puis répété pendant que l'application reste ouverte — toutes
       les 5 minutes, et chaque fois qu'elle revient au premier plan (un onglet mis en arrière-plan de
       longues minutes pourrait sinon manquer la fenêtre de rappel d'un évènement proche à son retour). */
    function checkAllNotifications(){
      checkImminentTaskNotifications();
      checkUpcomingVacancesNotifications();
      checkTaskVacanceConflicts();
    }
    checkAllNotifications();
    setInterval(checkAllNotifications, 5*60*1000);
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState==='visible') checkAllNotifications();
    });
  }
  start();
})();
</script>
<script>
  /* Dispositif de mise à jour : le service worker (voir sw.js) sert désormais la page principale en
     mode « réseau d'abord » (repli sur la copie en cache seulement hors-ligne), pour que toute mise à
     jour publiée — modification, ajout ou suppression — soit prise en compte dès la prochaine ouverture
     normale de l'application, sans manipulation particulière. En complément, si l'application reste
     ouverte pendant qu'une mise à jour est publiée, ce bloc la détecte en arrière-plan et affiche un
     bandeau « Actualiser » plutôt que de recharger tout seul (pour ne jamais couper l'utilisateur(trice)
     en pleine saisie d'une fiche ou d'un formulaire). */
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        function showUpdateBar(){
          var bar = document.getElementById('updateBar');
          if(bar) bar.hidden = false;
        }
        function watchInstalling(sw){
          if(!sw) return;
          sw.addEventListener('statechange', function(){
            if(sw.state === 'installed' && navigator.serviceWorker.controller){
              // Un service worker contrôlait déjà la page : il s'agit bien d'une mise à jour, pas de
              // la toute première installation (où rien n'a encore besoin d'être actualisé).
              showUpdateBar();
            }
          });
        }
        if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar();
        if(reg.installing) watchInstalling(reg.installing);
        reg.addEventListener('updatefound', function(){ watchInstalling(reg.installing); });
        // Vérifie activement la présence d'une mise à jour chaque fois que l'application revient au
        // premier plan (l'app pouvant rester ouverte longtemps sans qu'aucune requête réseau naturelle
        // ne redéclenche la vérification automatique du navigateur).
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState === 'visible') reg.update().catch(function(){});
        });
        setInterval(function(){ reg.update().catch(function(){}); }, 60*60*1000);
      }).catch(function(){});
    });
    var btnUpdateNow = document.getElementById('btnUpdateNow');
    if(btnUpdateNow) btnUpdateNow.onclick = function(){ location.reload(); };
  }
</script>
