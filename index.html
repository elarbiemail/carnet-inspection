<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet d'Inspection</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F6F62">
<meta name="application-name" content="Carnet Inspection">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet Inspection">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F6F4EE; --surface:#FFFFFF; --surface-2:#FBF9F4;
    --ink:#1E2A3A; --ink-soft:#5B6675; --ink-faint:#8B94A0;
    --line:#DDD7C8; --line-soft:#E9E4D8;
    --accent:#2F6F62; --accent-ink:#FFFFFF; --accent-soft:#E4EEEA;
    --warn:#B5762A; --warn-soft:#F5E9D8;
    --danger:#B14A3D; --danger-soft:#F6E3DF;
    --done:#3F7D53; --done-soft:#E3EFE4;
    --violet:#5B5A9C; --violet-soft:#E7E6F2;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(30,42,58,.07), 0 6px 20px rgba(30,42,58,.07);
    --font-ui:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161C24; --surface:#1E2530; --surface-2:#232B37;
      --ink:#EDEBE3; --ink-soft:#A8AFB8; --ink-faint:#77808C;
      --line:#303947; --line-soft:#2A3240;
      --accent:#6FB3A2; --accent-ink:#0E1A17; --accent-soft:#223834;
      --warn:#D69B57; --warn-soft:#3A2E1D;
      --danger:#D97C6C; --danger-soft:#3B2420;
      --done:#7BC090; --done-soft:#1F3123;
      --violet:#9C9BE0; --violet-soft:#2A2A45;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161C24; --surface:#1E2530; --surface-2:#232B37;
    --ink:#EDEBE3; --ink-soft:#A8AFB8; --ink-faint:#77808C;
    --line:#303947; --line-soft:#2A3240;
    --accent:#6FB3A2; --accent-ink:#0E1A17; --accent-soft:#223834;
    --warn:#D69B57; --warn-soft:#3A2E1D;
    --danger:#D97C6C; --danger-soft:#3B2420;
    --done:#7BC090; --done-soft:#1F3123;
    --violet:#9C9BE0; --violet-soft:#2A2A45;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); font-size:15px; line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  [hidden]{display:none!important;}
  img{max-width:100%;}
  button, input, textarea, select{ font-family:inherit; font-size:inherit; color:inherit; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  .tnum{ font-variant-numeric:tabular-nums; }

  #app{ max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  /* --- Topbar --- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--bg); border-bottom:1px solid var(--line);
    padding:14px 16px 10px;
  }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ display:flex; align-items:center; gap:9px; min-width:0; }
  .brand-mark{ width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand h1{ font-size:17px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
  .topbar-actions{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .icon-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid transparent;
    background:transparent; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-soft); transition:background .15s; flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn:active{ background:var(--line-soft); }
  .icon-btn.spin svg{ animation:spin 1s linear infinite; }
  .icon-btn[disabled]{ opacity:.4; cursor:default; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ .icon-btn.spin svg{ animation:none; } }

  .topbar-left{ display:flex; align-items:center; gap:4px; min-width:0; }

  .syncbar{ display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--ink-faint); }
  .syncbar .dot{ width:6px; height:6px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .syncbar .dot.ok{ background:var(--done); }
  .syncbar .dot.err{ background:var(--danger); }
  .syncbar-link{ background:none; border:none; padding:0; color:var(--accent); font-weight:600; font-size:12px; cursor:pointer; }

  /* --- Main / views --- */
  main{ flex:1; padding:14px 16px calc(152px + env(safe-area-inset-bottom,0px)); }
  .view{ display:flex; flex-direction:column; gap:12px; }

  /* --- Sidebar --- */
  .sidebar-backdrop{ position:fixed; inset:0; background:rgba(20,24,30,.44); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s; }
  .sidebar-backdrop.open{ opacity:1; pointer-events:auto; }
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; width:284px; max-width:84vw; background:var(--surface);
    z-index:41; transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 34px rgba(0,0,0,.18);
    display:flex; flex-direction:column; padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding:0 4px; }
  .side-nav{ display:flex; flex-direction:column; gap:2px; }
  .side-nav button{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; border:none; background:none;
    color:var(--ink-soft); font-weight:600; font-size:13.5px; cursor:pointer; text-align:left; width:100%; }
  .side-nav button svg{ flex-shrink:0; }
  .side-nav button[aria-current="true"]{ background:var(--accent-soft); color:var(--accent); }
  .side-divider{ height:1px; background:var(--line-soft); margin:12px 4px; }
  .side-section-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:0 12px; margin-bottom:4px; }
  .side-foot{ margin-top:auto; padding:12px 12px 2px; font-size:11px; color:var(--ink-faint); border-top:1px solid var(--line-soft); line-height:1.5; }

  /* --- Bottom tab bar --- */
  .bottom-tabs{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:640px; z-index:21;
    background:var(--surface); border-top:1px solid var(--line); display:flex;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .bottom-tabs .bt-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:8px 2px 7px; border:none; background:none; color:var(--ink-faint); font-size:10px; font-weight:600; cursor:pointer;
  }
  .bottom-tabs .bt-item[aria-current="true"]{ color:var(--accent); }
  .bottom-tabs .bt-item svg{ flex-shrink:0; }

  .banner{ border-radius:var(--radius-sm); padding:11px 13px; font-size:13px; display:flex; gap:9px; align-items:flex-start; }
  .banner svg{ flex-shrink:0; margin-top:1px; }
  .banner.warn{ background:var(--warn-soft); color:var(--warn); }
  .banner.err{ background:var(--danger-soft); color:var(--danger); }
  .banner.info{ background:var(--accent-soft); color:var(--accent); }
  .banner-actions{ margin-top:6px; display:flex; gap:8px; }
  .banner a, .banner-actions button{ font-weight:700; }

  .setup-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow);
  }
  .setup-card h2{ font-size:15.5px; margin-bottom:4px; }
  .setup-card p{ color:var(--ink-soft); font-size:13px; margin:0 0 12px; }
  .setup-actions{ display:flex; flex-wrap:wrap; gap:8px; }

  .preview-card{ opacity:.55; filter:saturate(.6); pointer-events:none; }
  .preview-tag{
    position:absolute; top:10px; right:10px; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-faint); background:var(--surface-2); padding:3px 7px; border-radius:99px;
  }

  .stats-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .stat{
    flex:1; min-width:78px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 10px;
  }
  .stat b{ display:block; font-size:19px; font-family:var(--font-mono); }
  .stat span{ font-size:11px; color:var(--ink-soft); }

  .chips{ display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; }
  .chip{
    flex-shrink:0; padding:6px 13px; border-radius:99px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .task-list{ display:flex; flex-direction:column; gap:9px; }
  .task-card{
    position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 13px 12px 15px; cursor:pointer; display:flex; flex-direction:column; gap:7px;
    box-shadow:var(--shadow);
  }
  .task-card::before{
    content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:3px;
    background:var(--prio,var(--line));
  }
  .task-card.done{ opacity:.62; }
  .task-title{ font-weight:600; font-size:14.5px; text-wrap:balance; }
  .task-title.strike{ text-decoration:line-through; text-decoration-color:var(--ink-faint); }
  .task-meta{ font-size:12px; color:var(--ink-soft); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .type-badge{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:2px 7px; border-radius:5px; }
  .type-badge.violet{ background:var(--violet-soft); color:var(--violet); }
  .type-badge.accent{ background:var(--accent-soft); color:var(--accent); }
  .type-badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .type-badge.neutral{ background:var(--surface-2); color:var(--ink-soft); }
  .task-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .pill{
    display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:99px; font-size:11.5px; font-weight:700;
    border:none; cursor:pointer;
  }
  .pill.wf-a_planifier{ background:var(--surface-2); color:var(--ink-soft); }
  .pill.wf-planifiee{ background:var(--accent-soft); color:var(--accent); }
  .pill.wf-realisee{ background:var(--violet-soft); color:var(--violet); }
  .pill.wf-rapport{ background:var(--warn-soft); color:var(--warn); }
  .pill.wf-cloturee{ background:var(--done-soft); color:var(--done); }
  .due-chip{ font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono); }
  .due-chip.late{ color:var(--danger); font-weight:700; }
  .doc-chip{
    display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--accent); font-weight:600;
    background:none; border:none; padding:0; cursor:pointer; max-width:200px;
  }
  .doc-chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .empty{ text-align:center; padding:30px 10px; color:var(--ink-faint); font-size:13px; }

  /* --- stepper --- */
  .stepper{ display:flex; gap:5px; overflow-x:auto; padding:2px 0 6px; }
  .step{ flex-shrink:0; display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:99px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink-faint); font-size:11.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .step .n{ width:16px; height:16px; border-radius:50%; background:var(--line); color:var(--surface); display:flex; align-items:center;
    justify-content:center; font-size:9.5px; flex-shrink:0; }
  .step.done{ border-color:var(--done); color:var(--done); background:var(--done-soft); }
  .step.done .n{ background:var(--done); }
  .step.current{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .step.current .n{ background:var(--accent); }

  /* --- Rows: generic list (enseignants / etablissements / documents) --- */
  .rec-list{ display:flex; flex-direction:column; gap:8px; }
  .rec-row{ display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:10px 11px; cursor:pointer; }
  .avatar{ width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13.5px; overflow:hidden; }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .rec-info{ flex:1; min-width:0; }
  .rec-info .t{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec-info .s{ font-size:11.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .zone-head{ font-size:12px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;
    margin:6px 0 -2px; display:flex; align-items:center; gap:8px; }
  .zone-head .line{ flex:1; height:1px; background:var(--line-soft); }

  /* --- Documents view (Drive) --- */
  .search-row{ display:flex; gap:8px; }
  .search-row input{
    flex:1; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-sm);
    padding:10px 12px; color:var(--ink);
  }
  .search-row button{
    border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-sm); padding:0 13px;
    color:var(--ink-soft); cursor:pointer;
  }
  .doc-list{ display:flex; flex-direction:column; gap:7px; }
  .doc-row{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:9px 10px;
  }
  .doc-ico{ width:34px; height:34px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center;
    justify-content:center; color:var(--ink-soft); flex-shrink:0; }
  .doc-info{ flex:1; min-width:0; }
  .doc-info .t{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .doc-info .s{ font-size:11px; color:var(--ink-faint); }
  .doc-actions{ display:flex; gap:2px; flex-shrink:0; }
  .section-label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); }

  /* --- Bilan --- */
  .bar-row{ display:flex; align-items:center; gap:9px; font-size:12.5px; }
  .bar-row .l{ width:118px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft); }
  .bar-track{ flex:1; height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:5px; background:var(--accent); }
  .bar-row .v{ width:26px; text-align:right; flex-shrink:0; font-family:var(--font-mono); font-size:12px; }
  .period-seg{ display:flex; gap:6px; overflow-x:auto; }
  .period-seg button{ flex-shrink:0; padding:7px 12px; border-radius:99px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); font-weight:600; font-size:12.5px; cursor:pointer; }
  .period-seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  /* --- Accueil (tableau de bord) --- */
  .home-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .home-head h2{ font-size:15.5px; }
  .home-head a{ font-size:12px; font-weight:700; color:var(--accent); cursor:pointer; white-space:nowrap; }
  .carousel{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity; margin:0 -1px; }
  .carousel-card{
    flex-shrink:0; width:128px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center;
    scroll-snap-align:start;
  }
  .carousel-card .avatar{ width:50px; height:50px; font-size:16px; }
  .carousel-card .t{ font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%; }
  .carousel-card .s{ font-size:10.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%; }
  .activity-list{ display:flex; flex-direction:column; }
  .activity-row{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line-soft); cursor:pointer; }
  .activity-row:last-child{ border-bottom:none; }
  .activity-ico{ width:30px; height:30px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center;
    justify-content:center; color:var(--ink-soft); flex-shrink:0; }
  .activity-info{ flex:1; min-width:0; }
  .activity-info .t{ font-size:12.5px; line-height:1.35; }
  .activity-info .s{ font-size:11px; color:var(--ink-faint); margin-top:1px; }

  /* --- FAB --- */
  .fab{
    position:fixed; right:calc(50% - 320px + 20px); bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:25;
    width:54px; height:54px; border-radius:16px; background:var(--accent); color:var(--accent-ink);
    border:none; box-shadow:0 8px 24px rgba(47,111,98,.35); display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  @media (max-width:680px){ .fab{ right:20px; } }

  /* --- Overlays / modals --- */
  .overlay{
    position:fixed; inset:0; z-index:50; background:rgba(20,24,30,.44);
    display:flex; align-items:flex-end; justify-content:center;
    padding-top:env(safe-area-inset-top,0px);
  }
  @media (min-width:560px){ .overlay{ align-items:center; } }
  .sheet{
    width:100%; max-width:560px; max-height:88vh; overflow-y:auto; background:var(--surface);
    border-radius:18px 18px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.2);
    padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));
  }
  @media (min-width:560px){ .sheet{ border-radius:18px; max-height:86vh; } }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .sheet-head h2{ font-size:16.5px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; }
  .field input[type="text"], .field input[type="date"], .field input[type="time"], .field input[type="tel"],
  .field input[type="email"], .field textarea, .field select{
    width:100%; border:1px solid var(--line); background:var(--surface-2); border-radius:var(--radius-sm);
    padding:10px 11px; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:flex; gap:9px; }
  .field-row .field{ flex:1; min-width:0; }
  .seg{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg button{
    flex:1; min-width:64px; padding:9px 6px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink-soft); font-weight:600; font-size:12.5px; cursor:pointer;
  }
  .seg button[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .pickbtn{ display:flex; align-items:center; gap:9px; border:1px dashed var(--line); border-radius:var(--radius-sm);
    padding:9px 10px; width:100%; background:none; cursor:pointer; text-align:left; }
  .pickbtn .t{ flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

<script>
(function(){
  "use strict";

  /* ================= helpers ================= */
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); };
  var uid = function(){ return (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2); };
  var nowIso = function(){ return new Date().toISOString(); };
  var todayStr = function(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  function fmtDate(iso){
    if(!iso) return '';
    var d = new Date(iso.length<=10 ? iso+'T00:00:00' : iso);
    if(isNaN(d)) return '';
    var dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0');
    return dd+'/'+mm+'/'+d.getFullYear();
  }
  function fmtWhen(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d)) return '';
    var diff = (Date.now()-d.getTime())/1000;
    if(diff < 60) return "à l'instant";
    if(diff < 3600) return Math.floor(diff/60)+' min';
    if(diff < 86400) return Math.floor(diff/3600)+' h';
    return fmtDate(iso);
  }
  function isLate(iso, statut){
    if(!iso || statut==='cloturee') return false;
    var d = new Date(iso.length<=10 ? iso+'T23:59:59' : iso);

  }
  function toast(msg){
    var el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    $('toastRoot').appendChild(el);
    setTimeout(function(){ el.remove(); }, 3200);
  }
  function initials(name){
    var parts = (name||'').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
  }

  /* ================= CSV ================= */
  function csvField(v){
    var s = (v==null?'':String(v));
    if(/[",\n\r]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function parseCSV(text){
    var rows = [], row = [], field = '', inQ = false;
    for(var i=0;i<text.length;i++){
      var c = text[i];
      if(inQ){
        if(c === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
        else field += c;
      } else {
        if(c === '"') inQ = true;
        else if(c === ',') { row.push(field); field=''; }
        else if(c === '\r') { /* skip */ }
        else if(c === '\n') { row.push(field); rows.push(row); row=[]; field=''; }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length>1 || (r[0]||'').trim()!==''; });
  }
  function objectsToCSV(headers, objs){
    var lines = [headers.map(csvField).join(',')];
    objs.forEach(function(o){ lines.push(headers.map(function(h){ return csvField(o[h]); }).join(',')); });
    return lines.join('\r\n');
  }
  function csvToObjects(text){
    var rows = parseCSV(text);
    if(!rows.length) return [];
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var out = [];
    for(var i=1;i<rows.length;i++){
      var r = rows[i], o = {};
      header.forEach(function(h,idx){ o[h] = r[idx]!=null ? r[idx] : ''; });
      out.push(o);
    }
    return out;
  }
  function b64ToUtf8(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  function utf8ToB64(str){
    var bytes = new TextEncoder().encode(str);
    var bin = ''; bytes.forEach(function(b){ bin += String.fromCharCode(b); });
    return btoa(bin);
  }
  /* ================= téléchargement de fichiers (natif navigateur, sans capacité Claude) ================= */
  function saveBlob(filename, data){
    return new Promise(function(resolve){
      var blob = (data instanceof Blob) ? data : new Blob([data], {type:'text/plain'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); resolve(); }, 150);
    });
  }
  function dataUrlToUint8Array(dataUrl){
    var b64 = String(dataUrl||'').split(',')[1] || '';
    return base64ToUint8Array(b64);
  }
  function base64ToUint8Array(b64){
    var bin = atob(String(b64||''));
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  /* ================= constants ================= */
  var WORKFLOW = [
    {v:'a_planifier', l:'À planifier'}, {v:'planifiee', l:'Planifiée'}, {v:'realisee', l:'Réalisée'},
    {v:'rapport', l:'CR rédigé'}, {v:'cloturee', l:'Clôturée'}
  ];
  var WF_LABEL = {}; WORKFLOW.forEach(function(w){ WF_LABEL[w.v]=w.l; });
  var LEGACY_STATUT = {a_faire:'a_planifier', en_cours:'realisee', termine:'cloturee'};
  function normStatut(v){ if(WF_LABEL[v]) return v; if(LEGACY_STATUT[v]) return LEGACY_STATUT[v]; return 'a_planifier'; }
  var TASK_TYPES = [

    {v:'reunion_pedagogique', l:'Réunion pédagogique'}, {v:'cours_experimental', l:'Cours expérimental'},
    {v:'recherche_action', l:'Recherche action'}, {v:'observation_examen', l:"Observation d'examen"},
    {v:'conception_examen', l:"Conception d'examen"}, {v:'autre', l:'Autre'}
  ];
  var TT_LABEL = {}; TASK_TYPES.forEach(function(t){ TT_LABEL[t.v]=t.l; });
  var LEGACY_TASKTYPE = {visite:'inspection', reunion:'reunion_pedagogique'};
  function normTaskType(v){ if(TT_LABEL[v]) return v; if(LEGACY_TASKTYPE[v]) return LEGACY_TASKTYPE[v]; return 'autre'; }
  var TASK_TYPES_GRADED = {inspection:true};
  var TASK_TYPES_NOTIFY = {reunion_pedagogique:true, cours_experimental:true};
  var DOCS_FOR_TYPE = {
    inspection:['lettre_information','observation','rapport_inspection','plan_action','bordereau'],
    visite_conseil:['lettre_information','observation','rapport','plan_action','bordereau'],
    reunion_pedagogique:['lettre_information','presence','compte_rendu','attestation','plan_action','bordereau'],
    cours_experimental:['lettre_information','presence','compte_rendu','attestation','plan_action','bordereau'],
    recherche_action:['rapport','plan_action','bordereau'],
    observation_examen:['observation','rapport','plan_action','bordereau'],
    conception_examen:['rapport','plan_action','bordereau'],
    autre:['rapport','plan_action','bordereau']
  };

    var justClosed = (kind==='task' && obj.statut==='cloturee' && !(i>=0 && arr[i].statut==='cloturee'));

     liste des documents déjà générés pour la tâche comme pièces jointes — c'est précisément l'objet
     d'un bordereau. Reste un document normal, éditable ensuite comme tout autre. */
  function ensureBordereauForTask(task){
    var already = state.documents.some(function(d){ return d.taskId===task.id && d.type==='bordereau'; });
    if(already) return;
    var d = buildDefaultDoc(task, 'bordereau');
    var otherDocs = state.documents.filter(function(x){ return x.taskId===task.id; });

     d'attestation pour chacun(e). Ignore les invité(e)s qui ont déjà une attestation pour cette tâche
     (identifiée par le nom, comme buildDefaultDoc n'attribue pas d'id d'enseignant à une attestation)
     pour ne jamais créer de doublon en cliquant plusieurs fois. */
  function ensureAttestationsForInvites(task){
    var created = 0;
    (task.invites||[]).forEach(function(inv){
      var already = state.documents.some(function(d){ return d.taskId===task.id && d.type==='attestation' && d.beneficiaireNom===inv.nom; });
      if(already) return;
      var d = buildDefaultDoc(task, 'attestation');
      d.beneficiaireNom = inv.nom; d.lieu = inv.etablissementNom || task.etablissementNom || '';
      state.documents.push(d);

    var arr = stateArr(kind);
    var filtered = arr.filter(function(x){ return x.id!==id; });
    if(kind==='task') state.tasks = filtered; else if(kind==='zone') state.zones=filtered; else if(kind==='etablissement') state.etablissements=filtered;
    else if(kind==='enseignant') state.enseignants=filtered; else if(kind==='document') state.documents=filtered;
    saveLocal(coll); render();
    return Promise.resolve();
  }
  /* « Acceptation des établissements » dans le formulaire de zone : applique en bloc la liste cochée
     d'établissements à cette zone (rattache les cases cochées, détache celles décochées qui lui
     appartenaient) — un établissement ne peut être rattaché qu'à une seule zone, le cocher ici le
     retire donc de son ancienne zone le cas échéant. */
  function applyZoneEtabAssignment(zoneId, selectedIds){
    var changed = false;
    state.etablissements.forEach(function(e){
      var shouldBelong = selectedIds.indexOf(e.id) !== -1;
      var belongs = e.zoneId === zoneId;
      if(shouldBelong && !belongs){ e.zoneId = zoneId; e.updatedAt = nowIso(); changed = true; }
      else if(!shouldBelong && belongs){ e.zoneId = null; e.updatedAt = nowIso(); changed = true; }
    });
    if(changed){ saveLocal('etablissements'); render(); }
    return changed;
  }
  function configSet(patch){
    state.config = Object.assign({}, state.config, patch);
    state.sampleReady = !!geminiApiKey();
    saveLocal('config'); render();
    return Promise.resolve();
  }
  function templatesSet(patch){
    state.templates = Object.assign({}, state.templates, patch, {updatedAt: nowIso()});
    saveLocal('templates'); render();
    return Promise.resolve();
  }

  function etabName(id){ var e = state.etablissements.find(function(x){ return x.id===id; }); return e?e.nom:''; }
  function zoneName(id){ var z = state.zones.find(function(x){ return x.id===id; }); return z?z.nom:''; }
  function ensName(id){ var e = state.enseignants.find(function(x){ return x.id===id; }); return e?e.nom:''; }

  /* ================= Google Drive — connexion directe (sans passer par Claude) =================
     L'app utilise Google Identity Services (OAuth côté navigateur) avec le champ d'application
     restreint "drive.file" : l'app ne voit QUE les fichiers qu'elle a elle-même créés dans Drive,
     jamais le reste du compte Google de l'utilisateur. Aucun serveur intermédiaire, aucune
     facturation Claude — uniquement le quota Google gratuit de l'utilisateur. */
  /* L'identifiant client Google n'est plus codé en dur : il est saisi dans l'application
     (écran de configuration Drive) et enregistré dans state.config, donc jamais besoin de
     modifier ce fichier ni le dépôt GitHub pour le renseigner ou le changer. */
  function googleClientId(){ return (state.config && state.config.googleClientId) || ''; }
  var GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  var gisTokenClient = null, gisLoaded = false, driveAccessToken = null, driveTokenExpiresAt = 0;
  function loadGisScript(){
    if(gisLoaded) return Promise.resolve();
    return loadScript('https://accounts.google.com/gsi/client').then(function(){ gisLoaded = true; });
  }
  function ensureGoogleAuth(interactive){
    var cid = googleClientId();
    if(!cid) return Promise.reject({code:'not_configured'});
    return loadGisScript().then(function(){
      return new Promise(function(resolve, reject){
        if(!window.google || !window.google.accounts || !window.google.accounts.oauth2){ reject({code:'server_unavailable'}); return; }
        if(driveAccessToken && Date.now() < driveTokenExpiresAt - 30000){ resolve(driveAccessToken); return; }
        if(!interactive){ reject({code:'consent_required'}); return; }
        if(!gisTokenClient){
          gisTokenClient = window.google.accounts.oauth2.initTokenClient({
            client_id: cid, scope: GOOGLE_DRIVE_SCOPE,
            callback: function(resp){
              var cb = gisTokenClient.__resolve, eb = gisTokenClient.__reject;
              gisTokenClient.__resolve = null; gisTokenClient.__reject = null;
              if(resp && resp.access_token){
                driveAccessToken = resp.access_token; driveTokenExpiresAt = Date.now() + ((resp.expires_in||3300)*1000);
                state.mcpReady = true; render();
                if(cb) cb(driveAccessToken);
              } else if(eb) eb({code:'consent_required'});
            },
            error_callback: function(err){
              var eb = gisTokenClient.__reject; gisTokenClient.__reject = null; gisTokenClient.__resolve = null;
              if(eb) eb({code: (err && err.type==='popup_closed') ? 'cancelled' : 'consent_required'});
            }
          });
        }
        gisTokenClient.__resolve = resolve; gisTokenClient.__reject = reject;
        gisTokenClient.requestAccessToken({prompt: driveAccessToken ? '' : 'consent'});
      });
    });
  }
  function connectGoogleDrive(){
    if(!googleClientId()){ openDriveSetup(); return; }
    ensureGoogleAuth(true).then(function(){ toast('Google Drive connecté.'); }).catch(function(err){ toast(mcpErrorMessage(err)); render(); });
  }
  function openDriveSetup(){
    state.driveSetupError = null;
    pushModal({type:'driveSetup'});
  }
  function disconnectGoogleDrive(){
    if(driveAccessToken && window.google && window.google.accounts && window.google.accounts.oauth2){
      try{ window.google.accounts.oauth2.revoke(driveAccessToken, function(){}); }catch(e){}
    }
    driveAccessToken = null; driveTokenExpiresAt = 0; state.mcpReady = false; render(); toast('Google Drive déconnecté.');
  }
  function driveFetch(url, opts){
    opts = opts || {};
    return ensureGoogleAuth(true).then(function(token){
      var headers = Object.assign({}, opts.headers||{}, {Authorization:'Bearer '+token});
      return fetch(url, Object.assign({}, opts, {headers:headers}));
    }).then(function(res){
      if(res.status===401){ driveAccessToken=null; state.mcpReady=false; render(); return Promise.reject({code:'needs_reauth'}); }
      if(!res.ok){
        return res.json().catch(function(){ return {}; }).then(function(j){
          return Promise.reject({code:'tool_error', message:(j.error&&j.error.message)||res.statusText});
        });
      }
      return res;
    });
  }
  function driveQueryTranslate(q){ return String(q||'').replace(/\btitle\b/g, 'name'); }
  function driveFileToPayload(f){ return {id:f.id, title:f.name, mimeType:f.mimeType, modifiedTime:f.modifiedTime, fileExtension:f.fileExtension||'', parentId:(f.parents&&f.parents[0])||null}; }
  var DRIVE_FILES_API = 'https://www.googleapis.com/drive/v3/files';
  var DRIVE_UPLOAD_API = 'https://www.googleapis.com/upload/drive/v3/files';
  function mcpCall(tool, input){
    input = input || {};
    if(tool==='search_files' || tool==='list_recent_files'){
      var params = new URLSearchParams();
      if(tool==='search_files' && input.query) params.set('q', driveQueryTranslate(input.query));
      params.set('pageSize', String(input.pageSize||10));
      params.set('fields', 'files(id,name,mimeType,modifiedTime,fileExtension,parents)');
      params.set('spaces', 'drive');
      if(tool==='list_recent_files') params.set('orderBy', 'modifiedTime desc');
      return driveFetch(DRIVE_FILES_API+'?'+params.toString()).then(function(res){ return res.json(); }).then(function(data){
        return {payload:{files:(data.files||[]).map(driveFileToPayload)}};
      });
    }
    if(tool==='create_file'){
      var isFolder = input.contentMimeType==='application/vnd.google-apps.folder' && !input.textContent && !input.base64Content;
      var meta = {name: input.title};
      if(input.parentId) meta.parents = [input.parentId];
      if(isFolder){
        meta.mimeType = 'application/vnd.google-apps.folder';
        return driveFetch(DRIVE_FILES_API+'?fields=id,name,parents', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(meta)})
          .then(function(res){ return res.json(); }).then(function(data){ return {payload:{id:data.id, title:data.name, parentId:input.parentId||null}}; });
      }
      var mime = input.contentMimeType || 'text/plain';
      /* La conversion Drive « à la volée » (déjà utilisée pour CSV → Google Sheets lors de la
         synchronisation) sert aussi à transformer un .docx généré par l'app en Google Doc natif et
         éditable — voir uploadBlobToDrive(..., convertToGoogleDoc) — plutôt que de le laisser comme
         simple fichier .docx figé dans Drive. */
      meta.mimeType = input.disableConversionToGoogleType ? mime
        : input.convertToGoogleDoc ? 'application/vnd.google-apps.document'
        : (mime==='text/csv' ? 'application/vnd.google-apps.spreadsheet' : mime);
      var boundary = 'ciBoundary'+Date.now();
      var head = '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
        '\r\n--'+boundary+'\r\nContent-Type: '+mime+'\r\n\r\n';
      var tail = '\r\n--'+boundary+'--';
      /* Le contenu binaire (base64Content) est décodé en octets bruts et assemblé via Blob plutôt
         qu'en concaténant une chaîne JS, pour éviter toute corruption des octets > 127 par un
         ré-encodage UTF-8 implicite lors de l'envoi (fetch encoderait sinon une chaîne binaire). */
      var bodyPart = input.base64Content ? base64ToUint8Array(input.base64Content) : (input.textContent||'');
      var multipartBlob = new Blob([head, bodyPart, tail], {type:'multipart/related; boundary='+boundary});
      return driveFetch(DRIVE_UPLOAD_API+'?uploadType=multipart&fields=id,name,parents', {
        method:'POST', headers:{'Content-Type':'multipart/related; boundary='+boundary}, body: multipartBlob
      }).then(function(res){ return res.json(); }).then(function(data){
        return {payload:{id:data.id, title:data.name, parentId:(data.parents&&data.parents[0])||input.parentId||null}};
      });
    }
    if(tool==='update_file'){
      var fileId = input.fileId;
      var doPatch = function(addParents, removeParents){
        var params2 = new URLSearchParams(); params2.set('fields','id,name,parents');
        if(addParents) params2.set('addParents', addParents);
        if(removeParents) params2.set('removeParents', removeParents);
        var body2 = {}; if(input.title) body2.name = input.title;
        return driveFetch(DRIVE_FILES_API+'/'+fileId+'?'+params2.toString(), {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body2)})
          .then(function(res){ return res.json(); });
      };
      if(input.parentId){
        return driveFetch(DRIVE_FILES_API+'/'+fileId+'?fields=parents').then(function(res){ return res.json(); }).then(function(cur){
          return doPatch(input.parentId, (cur.parents||[]).join(','));
        }).then(function(data){ return {payload:{id:data.id, title:data.name, parentId:(data.parents&&data.parents[0])||null}}; });
      }
      return doPatch(null, null).then(function(data){ return {payload:{id:data.id, title:data.name, parentId:(data.parents&&data.parents[0])||null}}; });
    }
    if(tool==='trash_file'){
      return driveFetch(DRIVE_FILES_API+'/'+input.fileId, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trashed:true})})
        .then(function(){ return {payload:{id:input.fileId}}; });
    }
    if(tool==='download_file_content'){
      var url = input.exportMimeType ? DRIVE_FILES_API+'/'+input.fileId+'/export?mimeType='+encodeURIComponent(input.exportMimeType) : DRIVE_FILES_API+'/'+input.fileId+'?alt=media';
      return driveFetch(url).then(function(res){ return res.text(); }).then(function(text){ return {payload:{content: utf8ToB64(text)}}; });
    }
    return Promise.reject({code:'tool_error', message:'outil inconnu : '+tool});
  }
  function mcpErrorMessage(err){
    var code = err && err.code;
    switch(code){
      case 'needs_reauth': return "Reconnectez Google Drive, puis réessayez.";
      case 'not_configured': return "Google Drive n'est pas encore configuré. Touchez « Connecter » pour coller votre identifiant client Google.";
      case 'consent_required': return "Autorisez l'accès à Google Drive, puis réessayez.";
      case 'server_unavailable': return "Google Drive est temporairement indisponible (vérifiez votre connexion).";
      case 'tool_error': return "Google Drive a refusé cette opération" + (err&&err.message?' : '+err.message:'') + ".";
      case 'cancelled': return "Connexion à Google Drive annulée.";
      default: return "Erreur Google Drive" + (code ? ' ('+code+')' : '') + ".";
    }
  }

  /* ================= assistant de rédaction IA (Google Gemini, clé personnelle) =================
     Même logique « BYOK » (bring your own key) que la connexion Google Drive ci-dessus : l'utilisateur
     colle sa propre clé API Gemini (gratuite, obtenue sur aistudio.google.com) dans Réglages → Assistant
     IA ; elle est enregistrée dans state.config (jamais codée en dur dans ce fichier ni poussée sur
     GitHub) et chaque génération appelle directement generativelanguage.googleapis.com depuis le
     navigateur — aucun serveur intermédiaire, rien ne transite par Claude/Anthropic. state.sampleReady
     (recalculé à chaque configSet) reflète simplement la présence de cette clé et réactive les boutons
     IA déjà présents dans les formulaires (`state.sampleReady ?` dans le HTML). */
  function geminiApiKey(){ return (state.config && state.config.geminiApiKey) || ''; }
  var GEMINI_MODEL = 'gemini-flash-latest';
  function geminiErrorMessage(err){
    var code = err && err.code;
    switch(code){
      case 'not_configured': return "Ajoutez votre clé API Gemini dans Réglages → Assistant IA pour activer l'assistant de rédaction.";
      case 'invalid_key': return "Clé API Gemini refusée par Google. Depuis 2026, Google a retiré les anciennes clés API « standard » : générez une clé toute nouvelle sur aistudio.google.com/apikey (bouton « Create API key »), puis collez-la dans Réglages → Assistant IA à la place de l'ancienne.";
      case 'rate_limited': return "Trop de demandes à la fois auprès de Gemini : réessayez dans un instant.";
      case 'not_found': return "Modèle IA momentanément indisponible. Réessayez plus tard.";
      case 'blocked': return "La demande a été bloquée par les filtres de sécurité de Gemini. Reformulez votre requête.";
      case 'empty_completion': return "Aucun texte généré. Essayez une demande plus précise.";
      case 'network': return "Impossible de joindre le service Gemini (vérifiez votre connexion internet).";
      default: return "Erreur de l'assistant IA" + (err && err.message ? ' : '+err.message : (code?' ('+code+')':'')) + ".";
    }
  }
  /* Appel direct à l'API Gemini (generateContent) avec la clé de l'utilisateur — retourne le texte
     généré (Promise<string>) ou rejette avec {code, message} (voir geminiErrorMessage ci-dessus). */
  function geminiGenerate(prompt){
    var key = geminiApiKey();
    if(!key) return Promise.reject({code:'not_configured'});
    /* Depuis 2026, Google recommande (et, pour les nouvelles clés « auth key » émises par AI Studio,
       impose de fait) de transmettre la clé via l'en-tête x-goog-api-key plutôt que via le paramètre
       d'URL ?key=... — les anciennes clés « standard » non restreintes sont progressivement rejetées.
       Voir geminiErrorMessage() ci-dessus pour le message affiché si la clé de l'utilisateur est de
       l'ancien type et doit être régénérée sur aistudio.google.com/apikey. */
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent';
    return fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-goog-api-key': key},
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        if(!res.ok){
          var code = res.status===429 ? 'rate_limited' : (res.status===400 || res.status===403) ? 'invalid_key' : res.status===404 ? 'not_found' : 'tool_error';
          return Promise.reject({code: code, message: (data.error && data.error.message) || res.statusText});
        }
        if((!data.candidates || !data.candidates.length) && data.promptFeedback && data.promptFeedback.blockReason){
          return Promise.reject({code:'blocked'});
        }
        var cand = data.candidates && data.candidates[0];
        if(cand && cand.finishReason==='SAFETY') return Promise.reject({code:'blocked'});
        var text = (cand && cand.content && cand.content.parts) ? cand.content.parts.map(function(p){ return p.text||''; }).join('') : '';
        if(!text.trim()) return Promise.reject({code:'empty_completion'});
        return text.trim();
      });
    }, function(){ return Promise.reject({code:'network'}); });
  }
  /* Exécute un prompt IA et pose le résultat dans le champ texte visé : mêmes conventions que le
     reste de l'app (ex. runBilanGen) — le champ ciblé (targetTextarea) est une référence DOM directe,
     lue seulement à l'enregistrement (syncDocGenericFields), donc aucun render() n'est déclenché ici
     pour ne pas écraser la valeur qu'on vient d'y poser. */
  function runAiPrompt(btn, statusEl, targetTextarea, prompt){
    if(!geminiApiKey()){ toast(geminiErrorMessage({code:'not_configured'})); return; }
    if(btn) btn.disabled = true;
    if(statusEl){ statusEl.hidden = false; statusEl.className = 'banner info'; statusEl.textContent = 'Génération en cours avec Gemini…'; }
    geminiGenerate(prompt).then(function(text){
      if(targetTextarea) targetTextarea.value = text;
      if(statusEl) statusEl.hidden = true;
      if(btn) btn.disabled = false;
    }).catch(function(err){
      if(statusEl){ statusEl.hidden = false; statusEl.className = 'banner err'; statusEl.textContent = geminiErrorMessage(err); }
      if(btn) btn.disabled = false;
    });
  }
  /* Rédige — ou, si le champ contient déjà du texte, complète et enrichit ce texte au lieu de
     l'écraser : très utile pour les rapports et les grilles d'observation, où l'inspecteur(trice) a
     souvent déjà jeté quelques notes ou un brouillon avant de vouloir les développer. Le prompt de
     contexte (contextPrompt) reste celui fourni par chaque bouton (fixe la langue et le sujet) ; en
     mode « enrichir », on lui ajoute simplement le texte existant et une consigne de complétion qui
     préserve explicitement la langue déjà utilisée. */
  function aiDraft(btn, statusEl, targetTextarea, contextPrompt){
    var existing = targetTextarea ? (targetTextarea.value||'').trim() : '';
    var prompt = existing
      ? contextPrompt+"\n\nVoici le texte déjà rédigé (brouillon ou notes de l'inspecteur(trice)), à conserver comme base :\n\""+existing+"\"\n\nComplète et enrichis ce texte : développe les idées de façon plus précise, professionnelle et détaillée, améliore la formulation si besoin, sans changer son sens ni inventer de nouveaux faits non mentionnés. Rédige la version complète et enrichie dans la même langue que ce texte existant et que les instructions ci-dessus. Renvoie uniquement le texte final (pas de commentaire méta, pas d'introduction du type « voici la version enrichie »)."
      : contextPrompt;
    runAiPrompt(btn, statusEl, targetTextarea, prompt);
  }
  /* Traduction FR ↔ arabe : plusieurs types de documents (RTL_DOC_TYPES) impriment déjà leur mise en
     forme (titres, libellés, en-têtes de tableaux) en arabe alors que le contenu est saisi dans les
     mêmes champs français de l'application — ce bouton traduit sur place le texte déjà présent dans
     le champ, avec le même mécanisme que l'assistant de rédaction. Le sens de traduction est détecté
     automatiquement à partir du texte (présence de caractères arabes ou non), pour n'avoir qu'un seul
     bouton plutôt que deux. */
  function aiTranslate(btn, statusEl, targetTextarea){
    if(!targetTextarea) return;
    var text = (targetTextarea.value||'').trim();
    if(!text){ toast('Rien à traduire : le champ est vide.'); return; }
    var isArabic = /[؀-ۿ]/.test(text);
    var prompt = isArabic
      ? "Traduis fidèlement ce texte administratif en français, ton formel, sans rien ajouter ni commenter — retourne uniquement le texte traduit :\n\n"+text
      : "Traduis fidèlement ce texte administratif en arabe standard moderne, ton formel, sans rien ajouter ni commenter — retourne uniquement le texte traduit :\n\n"+text;
    runAiPrompt(btn, statusEl, targetTextarea, prompt);
  }
  /* Conception d'un plan d'action (compte-rendu de réunion) : contrairement aux autres boutons IA qui
     posent un simple texte dans un champ, celui-ci vise une LISTE structurée (state.draftDoc.actions,
     déjà éditable ligne par ligne dans le formulaire) — on demande donc à Gemini un tableau JSON, qu'on
     extrait tolérant (au cas où la réponse serait entourée de texte ou de balises ```json```), avant de
     remplacer la liste et de redessiner le formulaire pour l'afficher. L'échéance de chaque action reste
     volontairement vide : l'IA ne peut pas connaître de vraies contraintes de calendrier, c'est à
     l'inspecteur(trice) de la compléter. */
  function runAiActionsPlan(btn, statusEl, prompt){
    if(!geminiApiKey()){ toast(geminiErrorMessage({code:'not_configured'})); return; }
    if(btn) btn.disabled = true;
    if(statusEl){ statusEl.hidden = false; statusEl.className = 'banner info'; statusEl.textContent = 'Génération en cours avec Gemini…'; }
    geminiGenerate(prompt).then(function(text){
      var items = parseAiActionsJson(text);
      if(!items.length) return Promise.reject({code:'empty_completion'});
      state.draftDoc.actions = items;
      render();
    }).catch(function(err){
      if(statusEl){ statusEl.hidden = false; statusEl.className = 'banner err'; statusEl.textContent = geminiErrorMessage(err); }
      if(btn) btn.disabled = false;
    });
  }
  function parseAiActionsJson(text){
    var m = text.match(/\[[\s\S]*\]/);
    if(!m) return [];
    try{
      var arr = JSON.parse(m[0]);
      if(!Array.isArray(arr)) return [];
      return arr.map(function(x){ return { action:String((x&&x.action)||'').trim(), responsable:String((x&&x.responsable)||'').trim(), echeance:'' }; }).filter(function(a){ return a.action; });
    }catch(e){ return []; }
  }
  /* Génération d'un plan d'action complet (contexte + objectifs + actions) à partir de quelques
     bribes/notes brèves — voir openQuickPlanAction() : contrairement à parseAiActionsJson ci-dessus
     (une simple liste), la réponse attendue ici est un objet JSON unique regroupant les trois champs. */
  function parseAiPlanActionJson(text){
    var m = text.match(/\{[\s\S]*\}/);
    if(!m) return null;
    try{
      var obj = JSON.parse(m[0]);
      if(!obj || typeof obj !== 'object') return null;
      var actions = Array.isArray(obj.actions) ? obj.actions.map(function(x){
        return { action:String((x&&x.action)||'').trim(), responsable:String((x&&x.responsable)||'').trim(), echeance:'' };
      }).filter(function(a){ return a.action; }) : [];
      return { contexte:String(obj.contexte||'').trim(), objectifs:String(obj.objectifs||'').trim(), actions:actions };
    }catch(e){ return null; }
  }

  /* ================= assets (photos / pièces jointes / logo / cachet / signature) =================
     Stockage 100% local : chaque fichier est encodé en data URL (base64) et conservé dans
     localStorage aux côtés des autres données de l'app — aucun service externe requis. */
  var ASSET_SIZE_LIMIT = 1.5 * 1024 * 1024; // 1.5 Mo par fichier, pour rester dans le quota du navigateur
  function assetsErrorMessage(err){
    var code = err && err.code;
    switch(code){
      case 'too_large': return "Fichier trop volumineux (max. 1,5 Mo — réduisez la taille de l'image).";
      case 'unsupported_type': return "Type de fichier non pris en charge.";
      case 'quota_or_state': return "Espace de stockage de l'application atteint.";
      default: return "Erreur d'envoi du fichier" + (code?' ('+code+')':'') + ".";
    }
  }
  function uploadAsset(file){
    if(!file) return Promise.reject({code:'unsupported_type'});
    if(file.size > ASSET_SIZE_LIMIT) return Promise.reject({code:'too_large'});
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var id = uid();
        state.assets[id] = { dataUrl: reader.result, type: file.type||'', name: file.name||'' };
        try{ saveLocal('assets'); }catch(e){ delete state.assets[id]; reject({code:'quota_or_state'}); return; }
        resolve({id: id, contentType: file.type||''});
      };
      reader.onerror = function(){ reject({code:'unsupported_type'}); };
      reader.readAsDataURL(file);
    });
  }
  function assetUrl(id){ return (id && state.assets[id]) ? state.assets[id].dataUrl : ''; }
  function removeAsset(id){ if(id && state.assets[id]){ delete state.assets[id]; saveLocal('assets'); } }

  /* ================= sync (tasks <-> Google Sheet) ================= */
  var CSV_HEADERS = ['id','titre','statut','priorite','type','enseignant','etablissement','echeance','description','document_titre','document_url','maj'];
  function tasksToCSV(tasks){
    return objectsToCSV(CSV_HEADERS, tasks.map(function(t){
      return { id:t.id, titre:t.titre, statut:t.statut, priorite:t.priorite, type:t.taskType||'autre',
        enseignant: t.enseignantNom||t.enseignant||'', etablissement: t.etablissementNom||t.etablissement||'',
        echeance:t.echeance, description:t.description, document_titre:t.docTitre, document_url:t.docUrl, maj:t.updatedAt };
    }));
  }
  function csvToTasks(text){
    return csvToObjects(text).map(function(o){
      return {
        id: o.id || uid(), titre: o.titre || '(sans titre)', statut: normStatut(o.statut),
        priorite: ['basse','moyenne','haute'].indexOf(o.priorite)>=0 ? o.priorite : 'moyenne',
        taskType: normTaskType(o.type),
        enseignantNom: o.enseignant||'', etablissementNom: o.etablissement||'',
        echeance: o.echeance||'', description: o.description||'',
        docTitre: o.document_titre||'', docUrl: o.document_url||'', updatedAt: o.maj || nowIso()
      };
    });
  }
  /* ---- dossier Drive dédié à l'application (structuré : dossier principal + sous-dossiers) ---- */
  function ensureAppFolder(){
    if(!mcpNs) return Promise.reject({code:'not_granted'});
    if(state.config.folderId) return Promise.resolve({id:state.config.folderId, title:state.config.folderName});
    var name = DEFAULT_FOLDER_NAME;
    var q = "title = '"+name.replace(/'/g,"\\'")+"' and mimeType = 'application/vnd.google-apps.folder'";
    return mcpCall('search_files', {query:q, pageSize:5, excludeContentSnippets:true}).then(function(res){
      var files = (res.payload && res.payload.files) || [];
      if(files.length) return files[0];
      return mcpCall('create_file', {title:name, contentMimeType:'application/vnd.google-apps.folder'}).then(function(r){ return r.payload || {}; });
    }).then(function(folder){
      return configSet({ folderId: folder.id, folderName: folder.title || name }).then(function(){ return folder; });
    });
  }
  /* Sous-dossier dans le dossier principal de l'application (créé une seule fois, id mis en cache
     dans state.config sous configKey). Utilisé pour séparer les sauvegardes des documents générés,
     afin que le dossier principal reste lisible. */
  function ensureSubfolder(parentId, name, configKey){
    if(!parentId) return Promise.reject({code:'not_granted'});
    if(state.config[configKey]) return Promise.resolve({id: state.config[configKey], title: name});
    var q = "title = '"+name.replace(/'/g,"\\'")+"' and mimeType = 'application/vnd.google-apps.folder' and '"+parentId+"' in parents";
    return mcpCall('search_files', {query:q, pageSize:5, excludeContentSnippets:true}).then(function(res){
      var files = (res.payload && res.payload.files) || [];
      if(files.length) return files[0];
      return mcpCall('create_file', {title:name, contentMimeType:'application/vnd.google-apps.folder', parentId:parentId}).then(function(r){ return r.payload || {}; });
    }).then(function(folder){
      var patch = {}; patch[configKey] = folder.id;
      return configSet(patch).then(function(){ return folder; });
    });
  }
  function ensureBackupFolder(appFolderId){ return ensureSubfolder(appFolderId, 'Sauvegardes', 'backupFolderId'); }
  function ensureDocsFolder(appFolderId){ return ensureSubfolder(appFolderId, 'Documents générés', 'docsFolderId'); }
  function ensureAttachFolder(appFolderId){ return ensureSubfolder(appFolderId, 'Pièces jointes', 'attachFolderId'); }
  function ensureTemplatesFolder(appFolderId){ return ensureSubfolder(appFolderId, 'Modèles', 'templatesFolderId'); }
  /* Modèles de documents sur Google Docs (Réglages → Modèles de documents → Modèles personnalisés) :
     alternative à la simple zone de texte de l'app pour un texte long ou nécessitant une mise en forme
     plus riche — le Google Doc créé sert de brouillon éditable dans l'éditeur Google Docs habituel ;
     son contenu n'est ramené dans docTemplates[type].corps qu'au clic explicite sur « Récupérer le
     texte » (pas de synchronisation automatique/silencieuse, pour que l'inspecteur(trice) garde le
     contrôle du moment où le nouveau texte remplace l'ancien). */
  function openOrCreateTemplateGdoc(type){
    var docTmpls = Object.assign({}, state.templates.docTemplates||{});
    var cur = docTmpls[type] || {};
    if(cur.gdocUrl){ window.open(cur.gdocUrl, '_blank', 'noopener'); return Promise.resolve(cur); }
    var label = (DOC_TYPE_INFO[type]||{}).label || type;
    var tagsHint = DOC_TEMPLATE_TAGS.map(function(tg){ return '{{'+tg.tag+'}} = '+tg.label; }).join('\n');
    var body = cur.corps || ('Modèle : '+label+'\n\nRemplacez ce texte par le contenu de départ souhaité pour ce type de document. '+
      'Recopiez les balises ci-dessous telles quelles à l\'endroit voulu : elles seront automatiquement remplacées par les informations de la tâche à la création d\'un nouveau document.\n\n'+tagsHint);
    return ensureAppFolder().then(function(appFolder){
      return ensureTemplatesFolder(appFolder.id).catch(function(){ return null; }).then(function(folder){
        return mcpCall('create_file', {
          title: 'Modèle - '+label, textContent: body, contentMimeType:'text/plain',
          parentId: (folder && folder.id) || appFolder.id, convertToGoogleDoc:true
        });
      });
    }).then(function(res){
      var f = res && res.payload;
      if(!f) return Promise.reject({code:'tool_error'});
      var url = googleDocEditUrl(f.id);
      docTmpls[type] = Object.assign({}, cur, {gdocFileId:f.id, gdocUrl:url});
      templatesSet({docTemplates:docTmpls});
      window.open(url, '_blank', 'noopener');
      return docTmpls[type];
    });
  }
  function pullTemplateFromGdoc(type){
    var docTmpls = state.templates.docTemplates||{};
    var cur = docTmpls[type];
    if(!cur || !cur.gdocFileId) return Promise.reject({code:'not_configured'});
    return mcpCall('download_file_content', {fileId: cur.gdocFileId, exportMimeType:'text/plain'}).then(function(res){
      var payload = res.payload || {};
      var text = payload.content ? b64ToUtf8(payload.content) : '';
      var docTmpls2 = Object.assign({}, state.templates.docTemplates||{});
      docTmpls2[type] = Object.assign({}, docTmpls2[type], {corps: text.trim()});
      templatesSet({docTemplates:docTmpls2});
      return text.trim();
    });
  }
  /* Téléversement best-effort d'une pièce jointe (enseignant ou tâche) vers le sous-dossier
     « Pièces jointes » du Drive de l'application — en complément (jamais en remplacement) du stockage
     local déjà fait par uploadAsset : si Drive n'est pas connecté, ou si l'envoi échoue pour une
     raison quelconque (hors-ligne, quota…), on résout simplement avec null sans jamais faire échouer
     l'ajout local de la pièce jointe, qui reste toujours utilisable même sans Drive. */
  function uploadAttachmentToDrive(file){
    if(!state.mcpReady || !file) return Promise.resolve(null);
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(',')[1] || ''); };
      reader.onerror = function(){ reject(new Error('read-failed')); };
      reader.readAsDataURL(file);
    }).then(function(b64){
      return ensureAppFolder().then(function(appFolder){
        return ensureAttachFolder(appFolder.id).catch(function(){ return null; }).then(function(attachFolder){
          return mcpCall('create_file', {
            title: file.name || 'piece-jointe', base64Content: b64, contentMimeType: file.type || 'application/octet-stream',
            parentId: (attachFolder && attachFolder.id) || appFolder.id, disableConversionToGoogleType: true
          });
        });
      });
    }).then(function(res){
      var f = res && res.payload;
      return f ? { driveFileId: f.id, driveUrl: 'https://drive.google.com/file/d/'+f.id+'/view' } : null;
    }).catch(function(){ return null; });
  }
  /* Envoi best-effort d'un document généré (PDF/Word) vers le sous-dossier « Documents générés » —
     n'échoue jamais l'enregistrement local : les erreurs sont avalées par l'appelant. Quand
     convertToGoogleDoc est vrai (utilisé pour le .docx), Drive convertit le fichier envoyé en Google
     Doc natif au lieu de le stocker tel quel — c'est ce qui permet ensuite de l'ouvrir et de le
     personnaliser directement dans l'éditeur Google Docs, plutôt qu'un simple fichier .docx figé. */
  function uploadBlobToDrive(blob, filename, mime, convertToGoogleDoc){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(',')[1] || ''); };
      reader.onerror = function(){ reject({code:'unsupported_type'}); };
      reader.readAsDataURL(blob);
    }).then(function(b64){
      return ensureAppFolder().then(function(appFolder){
        return ensureDocsFolder(appFolder.id).catch(function(){ return null; }).then(function(docsFolder){
          return mcpCall('create_file', {
            title: filename, base64Content: b64, contentMimeType: mime || blob.type || 'application/octet-stream',
            parentId: (docsFolder && docsFolder.id) || appFolder.id,
            disableConversionToGoogleType: !convertToGoogleDoc, convertToGoogleDoc: !!convertToGoogleDoc
          });
        });
      });
    });
  }
  function googleDocEditUrl(fileId){ return 'https://docs.google.com/document/d/'+fileId+'/edit'; }
  /* Pour un document généré à la volée (bilan, historique) — donc sans enregistrement persistant où
     accrocher un bouton durable comme dans l'éditeur de document — le lien Google Docs est affiché
     directement dans la bannière de statut, laissée visible (au lieu de disparaître après quelques
     secondes) pour laisser le temps de cliquer dessus. */
  function showGdocLink(statusEl, gdocUrl){
    if(!statusEl) return;
    statusEl.hidden = false;
    statusEl.innerHTML = 'Document Word enregistré. <a href="'+esc(gdocUrl)+'" target="_blank" rel="noopener" style="font-weight:600;">Personnaliser sur Google Docs →</a>';
  }
  function pushJsonBackup(folderId){
    if(!folderId) return Promise.resolve();
    var data = {
      exportedAt: nowIso(), zones: state.zones, etablissements: state.etablissements,
      enseignants: state.enseignants, tasks: state.tasks, documents: state.documents, templates: state.templates,
      regionsMaroc: state.regionsMaroc, regionsMarocUpdatedAt: state.regionsMarocUpdatedAt
    };
    return mcpCall('create_file', {
      title: 'sauvegarde-donnees.json', textContent: JSON.stringify(data, null, 2), contentMimeType:'application/json',
      parentId: folderId, disableConversionToGoogleType:true
    }).then(function(res){
      var payload = res.payload || {};
      var newId = payload.id, oldId = state.config.backupFileId;
      var p = (newId && oldId && newId!==oldId) ? mcpCall('trash_file', {fileId:oldId}).catch(function(){}) : Promise.resolve();
      return p.then(function(){ return configSet({ backupFileId: newId || oldId, lastBackupAt: nowIso() }); });
    }).catch(function(err){ console.warn('backup error', err); });
  }
  /* Recherche un fichier par titre dans un dossier donné — utilisé pour retrouver la sauvegarde JSON
     même depuis un appareil qui ne l'a jamais poussée lui-même (son id local en cache,
     state.config.backupFileId, n'existe que sur l'appareil qui l'a créée). */
  function findFileByTitle(folderId, title){
    if(!folderId) return Promise.resolve(null);
    var q = "title = '"+title.replace(/'/g,"\\'")+"' and '"+folderId+"' in parents";
    return mcpCall('search_files', {query:q, pageSize:5, excludeContentSnippets:true}).then(function(res){
      var files = (res.payload && res.payload.files) || [];
      return files.length ? files[0] : null;
    });
  }
  /* Télécharge et lit la sauvegarde JSON existante dans le dossier « Sauvegardes », si elle existe —
     c'est ce qui permet à zones/établissements/enseignants/documents/référentiel/modèles d'être
     réellement synchronisés entre plusieurs appareils (auparavant cette sauvegarde n'était écrite
     que dans un sens, jamais relue par l'app elle-même). */
  function pullJsonBackup(folderId){
    if(!folderId) return Promise.resolve(null);
    return findFileByTitle(folderId, 'sauvegarde-donnees.json').then(function(file){
      if(!file) return null;
      return mcpCall('download_file_content', {fileId: file.id}).then(function(res){
        var payload = res.payload || {};
        if(!payload.content) return null;
        try{ return JSON.parse(b64ToUtf8(payload.content)); }catch(e){ return null; }
      });
    }).catch(function(){ return null; });
  }
  /* Fusionne une sauvegarde distante téléchargée dans l'état local : zones/établissements/
     enseignants/documents par enregistrement (le plus récent par id, comme les tâches via
     mergeById) ; référentiel régions/DP et modèles de documents en bloc, à la dernière modification
     la plus récente. Les tâches, elles, sont déjà fusionnées séparément via la feuille CSV. */
  function mergeRemoteBackupIntoLocal(remote){
    if(!remote) return;
    ['zones','etablissements','enseignants','documents'].forEach(function(coll){
      if(Array.isArray(remote[coll])){ state[coll] = mergeById(state[coll], remote[coll]); saveLocal(coll); }
    });
    if(Array.isArray(remote.regionsMaroc) && remote.regionsMarocUpdatedAt &&
       (!state.regionsMarocUpdatedAt || new Date(remote.regionsMarocUpdatedAt) > new Date(state.regionsMarocUpdatedAt))){
      state.regionsMaroc = remote.regionsMaroc; state.regionsMarocUpdatedAt = remote.regionsMarocUpdatedAt; saveLocal('regionsMaroc');
    }
    if(remote.templates && remote.templates.updatedAt &&
       (!state.templates.updatedAt || new Date(remote.templates.updatedAt) > new Date(state.templates.updatedAt))){
      var rp = remote.templates;
      state.templates = { entete: rp.entete||DEFAULT_ENTETE, criteres: rp.criteres||DEFAULT_CRITERES.slice(),
        profil: Object.assign({}, DEFAULT_PROFIL, rp.profil||{}), docTemplates: rp.docTemplates||{}, updatedAt: rp.updatedAt };
      saveLocal('templates');
    }
    render();
  }
  function doSync(){
    if(!state.config.sheetFileId){ openSettings(); return; }
    state.syncing = true; state.syncError = null; render();
    var folderRef = null;
    ensureAppFolder().catch(function(){ return null; }).then(function(folder){
      folderRef = folder;
      var move = (folder && state.config.sheetFileId && state.config.sheetParentId !== folder.id)
        ? mcpCall('update_file', {fileId: state.config.sheetFileId, parentId: folder.id}).catch(function(){})
        : Promise.resolve();
      return move;
    })
    .then(function(){
      return mcpCall('download_file_content', {fileId: state.config.sheetFileId, exportMimeType:'text/csv'});
    })
      .then(function(res){
        var payload = res.payload || {};
        var csv = payload.content ? b64ToUtf8(payload.content) : '';
        var remote = csvToTasks(csv);
        var merged = mergeById(state.tasks, remote);
        return persistMergedLocally(merged).then(function(){ return merged; });
      })
      .then(function(merged){
        var csv = tasksToCSV(merged);
        return mcpCall('create_file', {
          title: state.config.sheetTitle || 'Tâches - Carnet Inspection',
          textContent: csv, contentMimeType: 'text/csv',
          parentId: (folderRef && folderRef.id) || state.config.sheetParentId || undefined
        });
      })
      .then(function(createRes){
        var payload = createRes.payload || {};
        var newId = payload.id;
        var oldId = state.config.sheetFileId;
        var p = newId ? mcpCall('trash_file', {fileId: oldId}).catch(function(){}) : Promise.resolve();
        return p.then(function(){
          return configSet({ sheetFileId: newId || oldId, sheetTitle: payload.title || state.config.sheetTitle,
            sheetParentId: payload.parentId || (folderRef && folderRef.id) || state.config.sheetParentId, lastSyncAt: nowIso() });
        });
      })
      .then(function(){
        if(!folderRef) return Promise.resolve();
        /* La sauvegarde JSON est maintenant une vraie synchronisation à double sens : on la
           télécharge et on la fusionne dans l'état local (zones, établissements, enseignants,
           documents, référentiel régions/DP, modèles) AVANT de repousser la version fusionnée —
           c'est ce qui rend ces données réellement disponibles sur plusieurs appareils, comme les
           tâches le sont déjà via la feuille CSV. */
        return ensureBackupFolder(folderRef.id).catch(function(){ return null; })
          .then(function(bf){
            var bid = bf ? bf.id : folderRef.id;
            return pullJsonBackup(bid).then(function(remote){
              mergeRemoteBackupIntoLocal(remote);
              return pushJsonBackup(bid);
            });
          });
      })
      .then(function(){ state.syncing = false; render(); toast('Synchronisation réussie.'); })
      .catch(function(err){ console.warn('sync error', err); state.syncing = false; state.syncError = mcpErrorMessage(err); render(); });
  }
  /* Fusion générique par id : conserve, pour chaque enregistrement, la version dont updatedAt est
     la plus récente (locale ou distante) — utilisée aussi bien pour les tâches (via la feuille CSV)
     que pour zones/établissements/enseignants/documents (via la sauvegarde JSON, voir doSync). */
  function mergeById(local, remote){
    var byId = {}; local.forEach(function(t){ byId[t.id] = t; });
    remote.forEach(function(r){
      var l = byId[r.id];
      if(!l){ byId[r.id] = r; return; }
      var lt = new Date(l.updatedAt||0).getTime(), rt = new Date(r.updatedAt||0).getTime();
      if(rt > lt) byId[r.id] = r;
    });
    return Object.keys(byId).map(function(k){ return byId[k]; });
  }
  function persistMergedLocally(merged){
    state.tasks = merged; saveLocal('tasks'); render();
    return Promise.resolve();
  }
  function openSettings(){ state.modalStack.push({type:'settings', tab:'sync'}); render(); }
  function createSheet(){
    state.setupBusy = true; state.setupError = null; render();
    var title = 'Tâches - Carnet Inspection';
    ensureAppFolder().catch(function(){ return null; }).then(function(folder){
      return mcpCall('create_file', {title: title, textContent: objectsToCSV(CSV_HEADERS,[]), contentMimeType:'text/csv', parentId: folder?folder.id:undefined});
    })
      .then(function(res){
        var p = res.payload || {};
        return configSet({ sheetFileId: p.id, sheetTitle: p.title || title, sheetParentId: p.parentId || null, lastSyncAt: null });
      })
      .then(function(){ state.setupBusy = false; render(); toast('Feuille créée dans le dossier Drive de l\'application.'); doSync(); })
      .catch(function(err){ state.setupBusy = false; state.setupError = mcpErrorMessage(err); render(); });
  }
  function linkExistingSheet(file){
    configSet({ sheetFileId: file.id, sheetTitle: file.title, sheetParentId: file.parentId || null, lastSyncAt: null })

    if(!confirm("Réinitialiser la synchronisation ? La feuille actuelle restera intacte dans votre Google Drive, mais l'application ne la reliera plus — vous pourrez en créer ou en lier une nouvelle.")) return;

  }

  function downloadDriveDoc(file){
    mcpCall('download_file_content', {fileId: file.id}).then(function(res){
      var payload = res.payload || {};
      if(!payload.content){ toast('Contenu introuvable.'); return; }
      var bin = atob(payload.content);
      var bytes = new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      var ext = (file.fileExtension) ? file.fileExtension : (file.title.split('.').pop()||'bin');
      var name = /\.[a-zA-Z0-9]{2,4}$/.test(file.title) ? file.title : (file.title+'.'+ext);
      saveBlob(name, new Blob([bytes])).then(function(){ toast('Téléchargement enregistré.'); });
    }).catch(function(err){ toast(mcpErrorMessage(err)); });
  }

  /* Suggestion de commune : construite à partir des valeurs déjà saisies par l'utilisateur dans ses
     propres zones (aucun référentiel officiel exhaustif des ~1500 communes n'est chargé ici),
     filtrée en cascade selon la direction provinciale sélectionnée. */
  function distinctVals(field, filterField, filterVal){
    var seen = {}, out = [];
    state.zones.forEach(function(z){
      if(filterField && (z[filterField]||'').trim().toLowerCase() !== (filterVal||'').trim().toLowerCase()) return;
      var v = (z[field]||'').trim();
      if(v && !seen[v]){ seen[v]=true; out.push(v); }
    });
    return out.sort();
  }

  function buildDefaultDoc(task, type){
    var base = { id: uid(), taskId: task.id, type: type, titre: DOC_TYPE_INFO[type].label, date: task.echeance || todayStr() };
    var invites = task.invites || [];
    if(type==='presence'){
      /* Priorité à la liste d'enseignant(e)s invité(e)s explicitement choisie pour la tâche (réunion
         pédagogique / cours expérimental) — plus fiable que l'ancien repli « tous les enseignants de
         l'établissement », gardé pour les tâches qui n'ont pas (encore) de liste d'invités. */
      var parts = invites.length ? invites.map(function(iv){ return {nom:iv.nom, fonction:'Enseignant(e)'}; })
        : state.enseignants.filter(function(e){ return e.etablissementId===task.etablissementId; }).map(function(e){ return {nom:e.nom, fonction:'Enseignant(e)'}; });
      base.objet = task.titre; base.lieu = task.etablissementNom||''; base.participants = parts;
    } else if(type==='compte_rendu'){
      base.lieu = task.etablissementNom||''; base.presents= invites.length ? invites.map(function(iv){ return iv.nom; }).join(', ') : '';
      base.absents=''; base.ordreJour=''; base.pointsDiscutes='';
      base.decisions=''; base.actions=[];
    } else if(type==='observation'){
      base.enseignantNom = task.enseignantNom||''; base.classe=''; base.matiere=''; base.duree='';
      base.criteres = state.templates.criteres.map(function(c){ return {nom:c, note:'', commentaire:''}; });
      base.pointsForts=''; base.axesAmelioration=''; base.synthese='';
    } else if(type==='rapport'){
      base.texte='';
    } else if(type==='attestation'){
      base.beneficiaireNom = task.enseignantNom||''; base.fonction='Enseignant(e)'; base.objet = task.titre; base.lieu = task.etablissementNom||''; base.texteLibre='';
    } else if(type==='lettre_information'){
      /* Pour une réunion pédagogique / un cours expérimental, le courrier d'information est adressé au
         service pédagogique (et non au/à la directeur(trice) de l'établissement comme pour une visite
         d'inspection classique), et le corps mentionne la date ET l'heure ainsi que la liste des
         enseignant(e)s invité(e)s — reprise dans un tableau à l'impression/export (voir
         buildDocSpecInner et TEACHER_DOC_TYPES plus bas). */
      base.destinataire = TASK_TYPES_NOTIFY[task.taskType] ? 'Service pédagogique'
        : "Monsieur/Madame le/la Directeur(trice) de "+(task.etablissementNom||"l'établissement");
      base.objet = task.titre; base.lieu = task.etablissementNom||'';
      base.invites = invites.slice();
      var quandTxt = fmtDate(task.echeance)+(task.heure?' à '+task.heure:'');
      base.corps = invites.length
        ? "J'ai l'honneur de vous informer que "+(TT_LABEL[task.taskType]||'une réunion').toLowerCase()+" aura lieu le "+quandTxt+(task.etablissementNom?" à "+task.etablissementNom:"")+", avec la participation des enseignant(e)s dont la liste figure ci-après. Je vous prie de bien vouloir prendre les dispositions nécessaires à cet effet."
        : "J'ai l'honneur de vous informer que "+(TT_LABEL[task.taskType]||'une visite').toLowerCase()+" aura lieu le "+quandTxt+(task.enseignantNom?" concernant l'enseignant(e) "+task.enseignantNom:"")+". Je vous prie de bien vouloir prendre les dispositions nécessaires à cet effet.";
    } else if(type==='rapport_inspection'){
      base.enseignantNom = task.enseignantNom||''; base.lieu = task.etablissementNom||''; base.classe=''; base.matiere='';
      base.appreciation = task.noteGlobale || ''; base.constats=''; base.recommandations='';
    } else if(type==='bordereau'){
      base.destinataire = 'Monsieur le Directeur Provincial'; base.reference=''; base.objet = task.titre;
      base.pieces = [{designation: task.titre, nombre:'1'}]; base.observations='';
    } else if(type==='plan_action'){
      base.lieu = task.etablissementNom||''; base.objet = task.titre; base.contexte=''; base.objectifs=''; base.actions=[];
    }
    /* Modèle personnalisé (Réglages → Modèles de documents → Modèles personnalisés) : si l'utilisateur
       a défini un texte de modèle avec balises {{...}} pour ce type de document, il remplace le texte
       par défaut ci-dessus (une fois les balises résolues) dans le champ de texte principal du type —
       reste ensuite librement modifiable comme n'importe quel texte, y compris avec l'assistant IA. */
    var tmpl = (state.templates.docTemplates||{})[type];
    var tmplField = DOC_TEMPLATE_FIELD[type];
    if(tmpl && tmpl.corps && tmplField){
      base[tmplField] = applyMergeTemplate(tmpl.corps, docTemplateMergeValues(type, base, task));
    }
    return base;
  }

  function parseEtabType(v){

    return found ? found.v : 'public';
  }
  function parseEtabCycle(v){
    if(!v) return 'primaire';

    return found ? found.v : 'primaire';
  }
  function parseEnsStatut(v){
    if(!v) return 'titulaire';

  function findOrCreateEtab(name, zoneName2){
