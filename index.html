  /* ================= assets (photos / pièces jointes / logo / cachet / signature) =================
     Stockage 100% local : chaque fichier est encodé en data URL (base64) et conservé dans
     localStorage aux côtés des autres données de l'app — aucun service externe requis. */
  var ASSET_SIZE_LIMIT = 1.5 * 1024 * 1024; // 1.5 Mo par fichier, pour rester dans le quota du navigateur
  function assetsErrorMessage(err){
    var code = err && err.code;
    switch(code){
      case 'too_large': return "Fichier trop volumineux (max. 1,5 Mo — réduisez la taille de l'image).";
      case 'unsupported_type': return "Type de fichier non pris en charge.";
      case 'font_too_large': return "Police trop volumineuse (max. 3 Mo).";
      case 'quota_or_state': return "Espace de stockage de l'application atteint.";
      default: return "Erreur d'envoi du fichier" + (code?' ('+code+')':'') + ".";
    }
  }
  function uploadAsset(file, limit){
    if(!file) return Promise.reject({code:'unsupported_type'});
    if(file.size > (limit || ASSET_SIZE_LIMIT)) return Promise.reject({code:'too_large'});
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var id = uid();
        state.assets[id] = { dataUrl: reader.result, type: file.type||'', name: file.name||'' };
        try{ saveLocal('assets'); }catch(e){ delete state.assets[id]; reject({code:'quota_or_state'}); return; }
        resolve({id: id, contentType: file.type||''});
        uploadAssetToDrive(id); /* sauvegarde best-effort sur Drive, sans jamais bloquer l'ajout local */
      };
      reader.onerror = function(){ reject({code:'unsupported_type'}); };
      reader.readAsDataURL(file);
    });
  }
  /* Un asset (photo de profil, logo, cachet, signature…) n'a longtemps existé que dans le localStorage
     de l'appareil qui l'a ajouté. assetUrl() reste synchrone (utilisée partout dans le rendu), mais si
     l'image n'est pas encore en cache localement alors qu'un autre appareil a déjà indiqué son
     driveFileId (via la sauvegarde JSON, voir pushJsonBackup/mergeRemoteBackupIntoLocal), on déclenche
     un téléchargement en arrière-plan qui la mettra en cache puis redessinera l'écran une fois prête. */
  function assetUrl(id){
    if(!id) return '';
    var a = state.assets[id];
    if(!a) return '';
    if(a.dataUrl) return a.dataUrl;
    if(a.driveFileId) fetchAssetFromDrive(id);
    return '';
  }
  function removeAsset(id){
    if(!id || !state.assets[id]) return;
    var driveFileId = state.assets[id].driveFileId;
    delete state.assets[id]; saveLocal('assets');
    if(driveFileId && state.mcpReady) mcpCall('trash_file', {fileId:driveFileId}).catch(function(){});
  }
  function ensurePhotosFolder(appFolderId){ return ensureSubfolder(appFolderId, 'Photos', 'photosFolderId'); }
  /* Téléverse un asset local vers le sous-dossier Drive « Photos » — même logique best-effort que
     uploadAttachmentToDrive : jamais bloquant, jamais d'échec remonté à l'appelant. Le driveFileId
     obtenu est mémorisé sur l'asset lui-même (state.assets[id]) afin d'être inclus dans la prochaine
     sauvegarde JSON (assetsIndex, voir pushJsonBackup), ce qui permet à un autre appareil connecté au
     même compte Google de retrouver puis retélécharger cette image (voir fetchAssetFromDrive), même
     s'il ne l'a jamais eue localement — ex. une photo d'enseignant(e) ajoutée depuis le téléphone,
     visible ensuite depuis l'ordinateur. */
  function uploadAssetToDrive(id){
    if(!state.mcpReady) return Promise.resolve(null);
    var a = state.assets[id];
    if(!a || !a.dataUrl || a.driveFileId) return Promise.resolve(null);
    var b64 = String(a.dataUrl).split(',')[1] || '';
    if(!b64) return Promise.resolve(null);
    return ensureAppFolder().then(function(appFolder){
      return ensurePhotosFolder(appFolder.id).catch(function(){ return null; }).then(function(folder){
        return mcpCall('create_file', {
          title: a.name || ('image-'+id), base64Content: b64, contentMimeType: a.type || 'application/octet-stream',
          parentId: (folder && folder.id) || appFolder.id, disableConversionToGoogleType: true
        });
      });
    }).then(function(res){
      var f = res && res.payload;
      if(!f) return null;
      a.driveFileId = f.id; a.driveUrl = 'https://drive.google.com/file/d/'+f.id+'/view';
      try{ saveLocal('assets'); }catch(e){}
      return a;
    }).catch(function(){ return null; });
  }
  /* Téléchargement binaire brut (Blob → data URL), volontairement distinct de mcpCall('download_file_content')
     qui repasse par res.text()+utf8ToB64 — correct pour du texte (CSV, Google Doc exporté, JSON) mais
     corromprait les octets d'une image. driveFetch() gère déjà l'injection du jeton OAuth et le 401. */
  function driveDownloadBinaryAsDataUrl(fileId){
    return driveFetch(DRIVE_FILES_API+'/'+fileId+'?alt=media').then(function(res){ return res.blob(); }).then(function(blob){
      return new Promise(function(resolve, reject){
        var reader = new FileReader();
        reader.onload = function(){ resolve(String(reader.result)); };
        reader.onerror = function(){ reject(new Error('read-failed')); };
        reader.readAsDataURL(blob);
      });
    });
  }
  var assetFetchInFlight = {}, assetFetchFailed = {};
  function fetchAssetFromDrive(id){
    if(assetFetchInFlight[id]) return assetFetchInFlight[id];
    if(assetFetchFailed[id]) return Promise.resolve(null);
    var a = state.assets[id];
    if(!state.mcpReady || !a || a.dataUrl || !a.driveFileId) return Promise.resolve(null);
    var p = driveDownloadBinaryAsDataUrl(a.driveFileId).then(function(dataUrl){
      if(state.assets[id]){ state.assets[id].dataUrl = dataUrl; try{ saveLocal('assets'); }catch(e){} render(); }
      return dataUrl;
    }).catch(function(){ assetFetchFailed[id] = true; return null; }).then(function(v){ delete assetFetchInFlight[id]; return v; });
    assetFetchInFlight[id] = p;
    return p;
  }

  /* ================= sync (tasks <-> Google Sheet) ================= */
  var CSV_HEADERS = ['id','titre','statut','priorite','type','enseignant','etablissement','echeance','description','document_titre','document_url','maj'];
  function tasksToCSV(tasks){
    return objectsToCSV(CSV_HEADERS, tasks.map(function(t){
      return { id:t.id, titre:t.titre, statut:t.statut, priorite:t.priorite, type:t.taskType||'autre',
        enseignant: t.enseignantNom||t.enseignant||'', etablissement: t.etablissementNom||t.etablissement||'',
        echeance:t.echeance, description:t.description, document_titre:t.docTitre, document_url:t.docUrl, maj:t.updatedAt };
    }));
  }
  function csvToTasks(text){
    /* Une ligne sans id NI titre est une ligne vide/parasite (ex. cellule fantôme laissée par Google
       Sheets) plutôt qu'une vraie tâche — on l'ignore. Sans ce filtre, o.id||uid() lui fabriquait un
       nouvel id ALÉATOIRE à chaque analyse : impossible à supprimer durablement (même avec un
       tombstone, puisqu'un nouvel id différent est généré à chaque synchronisation suivante), d'où une
       « tâche fantôme » (souvent sans titre, donc affichée grisée) qui semblait réapparaître sans
       cesse malgré sa suppression. */
    return csvToObjects(text).filter(function(o){ return (o.id||'').trim() || (o.titre||'').trim(); }).map(function(o){
      return {
        id: o.id || uid(), titre: o.titre || '(sans titre)', statut: normStatut(o.statut),
        priorite: ['basse','moyenne','haute'].indexOf(o.priorite)>=0 ? o.priorite : 'moyenne',
        taskType: normTaskType(o.type),
        enseignantNom: o.enseignant||'', etablissementNom: o.etablissement||'',
        echeance: o.echeance||'', description: o.description||'',
        docTitre: o.document_titre||'', docUrl: o.document_url||'', updatedAt: o.maj || nowIso()
      };
    });
  }
  /* ---- dossier Drive dédié à l'application (structuré : dossier principal + sous-dossiers) ---- */
  function ensureAppFolder(){
    if(!mcpNs) return Promise.reject({code:'not_granted'});
    if(state.config.folderId) return Promise.resolve({id:state.config.folderId, title:state.config.folderName});
    var name = DEFAULT_FOLDER_NAME;
    var q = "title = '"+name.replace(/'/g,"\\'")+"' and mimeType = 'application/vnd.google-apps.folder'";
    return mcpCall('search_files', {query:q, pageSize:5, excludeContentSnippets:true}).then(function(res){
      var files = (res.payload && res.payload.files) || [];
      if(files.length) return files[0];
      return mcpCall('create_file', {title:name, contentMimeType:'application/vnd.google-apps.folder'}).then(function(r){ return r.payload || {}; });
    }).then(function(folder){
      return configSet({ folderId: folder.id, folderName: folder.title || name }).then(function(){ return folder; });
    });
  }
  /* Sous-dossier dans le dossier principal de l'application (créé une seule fois, id mis en cache
     dans state.config sous configKey). Utilisé pour séparer les sauvegardes des documents générés,
     afin que le dossier principal reste lisible. */
  function ensureSubfolder(parentId, name, configKey){
    if(!parentId) return Promise.reject({code:'not_granted'});
    if(state.config[configKey]) return Promise.resolve({id: state.config[configKey], title: name});
    var q = "title = '"+name.replace(/'/g,"\\'")+"' and mimeType = 'application/vnd.google-apps.folder' and '"+parentId+"' in parents";
    return mcpCall('search_files', {query:q, pageSize:5, excludeContentSnippets:true}).then(function(res){
      var files = (res.payload && res.payload.files) || [];
      if(files.length) return files[0];
      return mcpCall('create_file', {title:name, contentMimeType:'application/vnd.google-apps.folder', parentId:parentId}).then(function(r){ return r.payload || {}; });
    }).then(function(folder){
      var patch = {}; patch[configKey] = folder.id;
      return configSet(patch).then(function(){ return folder; });
    });
  }
  function ensureBackupFolder(appFolderId){ return ensureSubfolder(appFolderId, 'Sauvegardes', 'backupFolderId'); }
  function ensureDocsFolder(appFolderId){ return ensureSubfolder(appFolderId, 'Documents générés', 'docsFolderId'); }
  function ensureAttachFolder(appFolderId){ return ensureSubfolder(appFolderId, 'Pièces jointes', 'attachFolderId'); }
  function ensureTemplatesFolder(appFolderId){ return ensureSubfolder(appFolderId, 'Modèles', 'templatesFolderId'); }
  var SHEET_TITLE = 'Tâches - Carnet Inspection';
  /* Retrouve, dans le dossier principal de l'application, la feuille de tâches déjà créée — par
     exemple depuis un autre appareil — avant d'en créer une nouvelle. Indispensable à la
     synchronisation multi-appareils : sans cette recherche préalable, chaque appareil créerait sa
     propre feuille isolée, et deux feuilles distinctes ne se synchronisent jamais entre elles. */
  function ensureSheetFile(folder){
    if(!folder || !folder.id) return Promise.reject({code:'not_granted'});
    return findFileByTitle(folder.id, SHEET_TITLE).then(function(existing){
      if(existing) return {file:existing, created:false};
      return mcpCall('create_file', {
        title: SHEET_TITLE, textContent: objectsToCSV(CSV_HEADERS,[]), contentMimeType:'text/csv', parentId: folder.id
      }).then(function(res){ return {file:(res.payload||{}), created:true}; });
    });
  }
  /* Après connexion à Google Drive (ou en cas de nouvelle tentative sur un appareil déjà connecté
     mais pas encore lié), retrouve automatiquement le dossier et la feuille de l'application s'ils
     existent déjà quelque part dans le Drive du compte — plutôt que de forcer l'inspecteur(trice) à
     choisir entre « créer » et « lier », ce qui menait à créer par erreur une feuille distincte à
     chaque nouvel appareil (donc jamais synchronisée avec les autres). Les boutons manuels de
     Réglages → Synchronisation restent disponibles en secours si cette recherche automatique échoue. */
  function autoLinkExistingData(){
    if(state.config.sheetFileId || state.setupBusy) return Promise.resolve();
    state.setupBusy = true; state.setupError = null; render();
    return ensureAppFolder().then(function(folder){
      return ensureSheetFile(folder).then(function(r){
        return configSet({ sheetFileId:r.file.id, sheetTitle:r.file.title||SHEET_TITLE,
          sheetParentId: r.file.parentId || folder.id, lastSyncAt:null }).then(function(){
            state.setupBusy = false; render();
            toast(r.created ? 'Feuille créée dans le dossier Drive de l\'application.' : 'Feuille existante retrouvée sur votre Drive et liée automatiquement.');
            doSync();
          });
      });
    }).catch(function(err){
      state.setupBusy = false; state.setupError = mcpErrorMessage(err); render();
      var top = state.modalStack[state.modalStack.length-1];
      if(!top || top.type!=='settings') openSettings();
    });
  }
  /* Modèles de documents sur Google Docs (Réglages → Modèles de documents → Modèles personnalisés) :
     alternative à la saisie dans l'app pour un texte long ou nécessitant une mise en forme plus riche —
     UN SEUL Google Doc est créé par type de document, regroupant TOUS ses champs personnalisables
     (voir DOC_TEMPLATE_FIELDS), chacun repéré par une ligne « === Libellé === » — voir
     buildTemplateGdocBody/parseTemplateGdocBody ci-dessous. Il sert de brouillon éditable dans
     l'éditeur Google Docs habituel ; son contenu n'est reparti dans docTemplates[type].fields qu'au
     clic explicite sur « Récupérer le texte » (pas de synchronisation automatique/silencieuse, pour que
     l'inspecteur(trice) garde le contrôle du moment où le nouveau texte remplace l'ancien). */
  function templateGdocFieldMarker(label){ return '=== '+label+' ==='; }
  function buildTemplateGdocBody(type, fields, fieldsData){
    var label = (DOC_TYPE_INFO[type]||{}).label || type;
    var tagsHint = DOC_TEMPLATE_TAGS.map(function(tg){ return '{{'+tg.tag+'}} = '+tg.label; }).join('\n');
    var intro = 'Modèle : '+label+'\n\nModifiez le texte de chaque section ci-dessous (gardez les lignes '+
      '« === ... === » telles quelles : elles servent de repères pour ramener le texte dans l\'application). '+
      'Recopiez les balises ci-dessous telles quelles à l\'endroit voulu dans une section : elles seront '+
      'automatiquement remplacées par les informations de la tâche à la création d\'un nouveau document.'+
      '\n\nBalises disponibles :\n'+tagsHint;
    var sections = fields.map(function(f){
      return templateGdocFieldMarker(DOC_FIELD_LABEL[f]||f)+'\n'+((fieldsData&&fieldsData[f])||'');
    }).join('\n\n');
    return intro+'\n\n'+sections;
  }
  /* Découpe le texte relu depuis Google Docs entre chaque marqueur « === Libellé === » : le contenu
     d'un champ va de son marqueur jusqu'au marqueur suivant (ou la fin du texte) — un champ dont le
     marqueur a été supprimé par erreur est simplement laissé inchangé (voir pullTemplateFromGdoc). */
  function parseTemplateGdocBody(fields, text){
    var out = {};
    fields.forEach(function(f, i){
      var marker = templateGdocFieldMarker(DOC_FIELD_LABEL[f]||f);
      var idx = text.indexOf(marker);
      if(idx===-1) return;
      var start = idx + marker.length, end = text.length;
      fields.forEach(function(f2, j){
        if(j===i) return;
        var idx2 = text.indexOf(templateGdocFieldMarker(DOC_FIELD_LABEL[f2]||f2), start);
        if(idx2!==-1 && idx2 < end) end = idx2;
      });
      out[f] = text.slice(start, end).trim();
    });
    return out;
  }
  function openOrCreateTemplateGdoc(type){
    var docTmpls = Object.assign({}, state.templates.docTemplates||{});
    var cur = docTmpls[type] || {};
    if(cur.gdocUrl){ window.open(cur.gdocUrl, '_blank', 'noopener'); return Promise.resolve(cur); }
    var fields = DOC_TEMPLATE_FIELDS[type] || [];
    var body = buildTemplateGdocBody(type, fields, cur.fields||{});
    return ensureAppFolder().then(function(appFolder){
      return ensureTemplatesFolder(appFolder.id).catch(function(){ return null; }).then(function(folder){
        return mcpCall('create_file', {
          title: 'Modèle - '+((DOC_TYPE_INFO[type]||{}).label||type), textContent: body, contentMimeType:'text/plain',
          parentId: (folder && folder.id) || appFolder.id, convertToGoogleDoc:true
        });
      });
    }).then(function(res){
      var f = res && res.payload;
      if(!f) return Promise.reject({code:'tool_error'});
      var url = googleDocEditUrl(f.id);
      docTmpls[type] = Object.assign({}, cur, {gdocFileId:f.id, gdocUrl:url});
      templatesSet({docTemplates:docTmpls});
      window.open(url, '_blank', 'noopener');
      return docTmpls[type];
    });
  }
  function pullTemplateFromGdoc(type){
    var docTmpls = state.templates.docTemplates||{};
    var cur = docTmpls[type];
    if(!cur || !cur.gdocFileId) return Promise.reject({code:'not_configured'});
    var fields = DOC_TEMPLATE_FIELDS[type] || [];
    return mcpCall('download_file_content', {fileId: cur.gdocFileId, exportMimeType:'text/plain'}).then(function(res){
      var payload = res.payload || {};
      var text = payload.content ? b64ToUtf8(payload.content) : '';
      var parsed = parseTemplateGdocBody(fields, text);
      var docTmpls2 = Object.assign({}, state.templates.docTemplates||{});
      docTmpls2[type] = Object.assign({}, docTmpls2[type], {fields: Object.assign({}, (docTmpls2[type]||{}).fields, parsed)});
      templatesSet({docTemplates:docTmpls2});
      return parsed;
    });
  }
  /* Téléversement best-effort d'une pièce jointe (enseignant ou tâche) vers le sous-dossier
     « Pièces jointes » du Drive de l'application — en complément (jamais en remplacement) du stockage
     local déjà fait par uploadAsset : si Drive n'est pas connecté, ou si l'envoi échoue pour une
     raison quelconque (hors-ligne, quota…), on résout simplement avec null sans jamais faire échouer
     l'ajout local de la pièce jointe, qui reste toujours utilisable même sans Drive. */
  function uploadAttachmentToDrive(file, pathSegs){
    if(!state.mcpReady || !file) return Promise.resolve(null);
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(',')[1] || ''); };
      reader.onerror = function(){ reject(new Error('read-failed')); };
      reader.readAsDataURL(file);
    }).then(function(b64){
      return ensureAppFolder().then(function(appFolder){
        var target = (pathSegs && pathSegs.length) ? driveFolderPath(appFolder.id, pathSegs).then(function(id){ return {id:id}; }) : ensureAttachFolder(appFolder.id);
        return target.catch(function(){ return null; }).then(function(attachFolder){
          return mcpCall('create_file', {
            title: file.name || 'piece-jointe', base64Content: b64, contentMimeType: file.type || 'application/octet-stream',
            parentId: (attachFolder && attachFolder.id) || appFolder.id, disableConversionToGoogleType: true
          });
        });
      });
    }).then(function(res){
      var f = res && res.payload;
      return f ? { driveFileId: f.id, driveUrl: 'https://drive.google.com/file/d/'+f.id+'/view' } : null;
    }).catch(function(){ return null; });
  }
  /* Envoi best-effort d'un document généré (PDF/Word) vers le sous-dossier « Documents générés » —
     n'échoue jamais l'enregistrement local : les erreurs sont avalées par l'appelant. Quand
     convertToGoogleDoc est vrai (utilisé pour le .docx), Drive convertit le fichier envoyé en Google
     Doc natif au lieu de le stocker tel quel — c'est ce qui permet ensuite de l'ouvrir et de le
     personnaliser directement dans l'éditeur Google Docs, plutôt qu'un simple fichier .docx figé. */
  function uploadBlobToDrive(blob, filename, mime, convertToGoogleDoc, taskId){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(',')[1] || ''); };
      reader.onerror = function(){ reject({code:'unsupported_type'}); };
      reader.readAsDataURL(blob);
    }).then(function(b64){
      return ensureAppFolder().then(function(appFolder){
        /* Document produit depuis une tâche : rangé dans le dossier de cette tâche (sous-dossier
           « Documents générés »), sinon dans le dossier général « Documents générés ». */
        var target = taskId
          ? ensureTaskSubfolder(taskId, 'Documents générés').then(function(id){ return {id:id}; }).catch(function(){ return ensureDocsFolder(appFolder.id); })
          : ensureDocsFolder(appFolder.id);
        return target.catch(function(){ return null; }).then(function(docsFolder){
          return mcpCall('create_file', {
            title: filename, base64Content: b64, contentMimeType: mime || blob.type || 'application/octet-stream',
            parentId: (docsFolder && docsFolder.id) || appFolder.id,
            disableConversionToGoogleType: !convertToGoogleDoc, convertToGoogleDoc: !!convertToGoogleDoc
          });
        });
      });
    });
  }
  /* ================= pièces jointes des tâches → dossiers Google Drive structurés =================
     Chaque tâche a son propre dossier dans le Drive de l'application, rangé par année scolaire et par
     type de tâche :
       Carnet d'Inspection — Données /
         Tâches / Année 2026-2027 / Inspections / 2026-10-22 — Inspection · ALAMI Sara · Lycée Chorouk /
           Pièces jointes /      ← fichiers joints à la tâche (tout type, plusieurs à la fois)
           Documents générés /   ← rapports, grilles, courriers produits depuis la tâche (PDF / Word)
         Enseignants / ALAMI Sara — 1234567 /   ← pièces jointes des fiches enseignant(e)s
     Les fichiers joints sont d'abord gardés sur l'appareil (espace privé du navigateur, OPFS) puis
     envoyés sur Drive dès que possible : sans connexion ou sans Drive connecté, ils restent « en
     attente » et partent automatiquement plus tard (au retour du réseau, après connexion à Drive, ou
     toutes les minutes tant qu'il en reste). Les gros fichiers passent par l'envoi « resumable » de
     Drive (pas de limite de 1,5 Mo comme pour les photos). L'id du dossier de la tâche est enregistré
     sur la tâche elle-même (task.driveFolderId) pour que tous les appareils utilisent le même dossier,
     même si le titre de la tâche change ensuite. */
  var TT_FOLDER = { inspection:'Inspections', visite_conseil:'Visites conseil', reunion_pedagogique:'Réunions pédagogiques',
    cours_experimental:'Cours expérimentaux', formation:'Formations', reunion_distance:'Réunions à distance',
    reunion_administrative:'Réunions administratives', recherche_action:'Recherches action',
    observation_examen:"Observations d'examen", conception_examen:"Conceptions d'examen", autre:'Autres tâches' };
  var PJ_LOCAL_DIR = 'carnet-pieces-jointes';
  var PJ_LOCAL_MAX = 150 * 1024 * 1024;
  var driveFolderMem = {};
  function driveSafeName(s){ return String(s||'').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0, 100) || 'Sans titre'; }
  function driveQ(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
  /* Trouve ou crée un dossier nommé `name` dans `parentId` (cache mémoire + config). */
  function driveChildFolder(parentId, name){
    var key = parentId+'/'+name;
    var cache = state.config.driveFolderCache || {};
    if(driveFolderMem[key]) return Promise.resolve(driveFolderMem[key]);
    if(cache[key]){ driveFolderMem[key] = cache[key]; return Promise.resolve(cache[key]); }
    var q = "title = '"+driveQ(name)+"' and mimeType = 'application/vnd.google-apps.folder' and '"+parentId+"' in parents";
    return mcpCall('search_files', {query:q, pageSize:5, excludeContentSnippets:true}).then(function(res){
      var files = (res.payload && res.payload.files) || [];
      if(files.length) return files[0].id;
      return mcpCall('create_file', {title:name, contentMimeType:'application/vnd.google-apps.folder', parentId:parentId}).then(function(r){ return (r.payload||{}).id; });
    }).then(function(id){
      if(!id) return Promise.reject({code:'tool_error', message:'dossier non créé'});
      driveFolderMem[key] = id;
      var c2 = Object.assign({}, state.config.driveFolderCache||{}); c2[key] = id;
      state.config.driveFolderCache = c2; saveLocal('config');
      return id;
    });
  }
  function driveFolderPath(rootId, segs){
    return segs.reduce(function(p, seg){ return p.then(function(pid){ return driveChildFolder(pid, driveSafeName(seg)); }); }, Promise.resolve(rootId));
  }
  function driveForgetFolders(){ driveFolderMem = {}; state.config.driveFolderCache = {}; saveLocal('config'); }
  function taskFolderName(t){
    return (t.echeance ? String(t.echeance).slice(0,10) : 'Sans date')+' — '+(t.titre || TT_LABEL[t.taskType] || 'Tâche');
  }
  function taskYearFolder(t){ return 'Année '+anneeScolaireCourante(t.echeance || t.createdAt).replace(/\s*\/\s*/, '-'); }
  /* Dossier Drive de la tâche (créé au besoin), puis sous-dossier éventuel (« Pièces jointes »,
     « Documents générés »). */
  function ensureTaskFolder(taskId){
    var t = state.tasks.find(function(x){ return x.id===taskId; });
    if(!t) return Promise.reject({code:'tool_error', message:'tâche introuvable'});
    if(t.driveFolderId) return Promise.resolve(t.driveFolderId);
    return ensureAppFolder().then(function(app){
      return driveFolderPath(app.id, ['Tâches', taskYearFolder(t), TT_FOLDER[t.taskType] || 'Autres tâches', taskFolderName(t)]);
    }).then(function(fid){
      var cur = state.tasks.find(function(x){ return x.id===taskId; });
      if(cur && cur.driveFolderId !== fid) recordSet('task', Object.assign({}, cur, {driveFolderId: fid}));
      return fid;
    });
  }
  function ensureTaskSubfolder(taskId, sub){
    return ensureTaskFolder(taskId).then(function(fid){ return driveChildFolder(fid, sub); });
  }
  function driveFolderUrl(id){ return 'https://drive.google.com/drive/folders/'+id; }

  /* ---- envoi d'un fichier (Blob) dans un dossier Drive, quelle que soit sa taille ---- */
  function driveUploadBlob(blob, name, mime, parentId){
    mime = mime || blob.type || 'application/octet-stream';
    if(blob.size <= 4.5*1024*1024){
      return new Promise(function(resolve, reject){
        var fr = new FileReader();
        fr.onload = function(){ resolve(String(fr.result).split(',')[1] || ''); };
        fr.onerror = function(){ reject({code:'unsupported_type'}); };
        fr.readAsDataURL(blob);
      }).then(function(b64){
        return mcpCall('create_file', { title:name, base64Content:b64, contentMimeType:mime, parentId:parentId, disableConversionToGoogleType:true });
      }).then(function(r){ return r.payload; });
    }
    var meta = { name: name, parents: [parentId], mimeType: mime };
    return driveFetch(DRIVE_UPLOAD_API+'?uploadType=resumable&fields=id,name,parents', {
      method:'POST', headers:{ 'Content-Type':'application/json; charset=UTF-8', 'X-Upload-Content-Type': mime, 'X-Upload-Content-Length': String(blob.size) },
      body: JSON.stringify(meta)
    }).then(function(res){
      var loc = res.headers.get('Location') || res.headers.get('location');
      if(!loc) return Promise.reject({code:'tool_error', message:"envoi des gros fichiers refusé par le navigateur"});
      return fetch(loc, { method:'PUT', headers:{ 'Content-Type': mime }, body: blob });
    }).then(function(res){
      if(!res.ok) return Promise.reject({code:'tool_error', message:'HTTP '+res.status});
      return res.json();
    }).then(function(data){ return { id:data.id, title:data.name }; });
  }

  /* ---- copie locale des pièces jointes (OPFS) ---- */
  function pjDir(){
    if(!navigator.storage || !navigator.storage.getDirectory) return Promise.reject(new Error('opfs'));
    return navigator.storage.getDirectory().then(function(root){ return root.getDirectoryHandle(PJ_LOCAL_DIR, {create:true}); });
  }
  function pjSaveLocal(id, file){
    if(file.size > PJ_LOCAL_MAX) return Promise.resolve(false);
    return pjDir().then(function(dir){ return dir.getFileHandle(id, {create:true}); }).then(function(h){ return h.createWritable(); })
      .then(function(w){ return w.write(file).then(function(){ return w.close(); }); }).then(function(){ return true; }).catch(function(){ return false; });
  }
  function pjReadLocal(id){
    return pjDir().then(function(dir){ return dir.getFileHandle(id); }).then(function(h){ return h.getFile(); }).catch(function(){ return null; });
  }
  function pjDeleteLocal(id){ return pjDir().then(function(dir){ return dir.removeEntry(id); }).catch(function(){}); }

  /* ---- ajout / envoi / suppression ---- */
  var pjQueue = {};   // id → true pendant l'envoi
  function taskAttachUpdate(taskId, attId, patch){
    var t = state.tasks.find(function(x){ return x.id===taskId; });
    if(!t) return null;
    var list = (t.attachments||[]).map(function(a){ return a.id===attId ? Object.assign({}, a, patch) : a; });
    var nt = Object.assign({}, t, {attachments: list});
    recordSet('task', nt);
    return nt;
  }
  function attachFilesToTask(taskId, files){
    var t = state.tasks.find(function(x){ return x.id===taskId; });
    if(!t || !files || !files.length) return Promise.resolve();
    var entries = [];
    var jobs = Array.prototype.map.call(files, function(f){
      var e = { id: uid(), titre: f.name || 'fichier', type: f.type || '', size: f.size || 0, addedAt: new Date().toISOString(),
        status: 'pending', driveFileId: null, driveUrl: null, local: false };
      entries.push(e);
      return pjSaveLocal(e.id, f).then(function(ok){ e.local = ok; return { e:e, f:f }; });
    });
    return Promise.all(jobs).then(function(items){
      var cur = state.tasks.find(function(x){ return x.id===taskId; });
      recordSet('task', Object.assign({}, cur, {attachments: (cur.attachments||[]).concat(entries)}));
      toast(entries.length > 1 ? entries.length+' fichiers joints.' : 'Fichier joint.');
      items.forEach(function(it){ uploadTaskAttachment(taskId, it.e.id, it.f); });
    });
  }
  function uploadTaskAttachment(taskId, attId, fileOrNull, retried){
    if(!state.mcpReady) return Promise.resolve(false);
    if(pjQueue[attId]) return Promise.resolve(false);
    pjQueue[attId] = true;
    var t = state.tasks.find(function(x){ return x.id===taskId; });
    var a = t && (t.attachments||[]).find(function(x){ return x.id===attId; });
    if(!a || a.driveFileId){ delete pjQueue[attId]; return Promise.resolve(false); }
    taskAttachUpdate(taskId, attId, {status:'uploading'});
    var getFile = fileOrNull ? Promise.resolve(fileOrNull) : pjReadLocal(attId);
    return getFile.then(function(file){
      if(!file) return Promise.reject({code:'no_local'});
      return ensureTaskSubfolder(taskId, 'Pièces jointes').then(function(folderId){
        return driveUploadBlob(file, a.titre, a.type || file.type, folderId);
      });
    }).then(function(f){
      delete pjQueue[attId];
      taskAttachUpdate(taskId, attId, {status:'uploaded', driveFileId:f.id, driveUrl:'https://drive.google.com/file/d/'+f.id+'/view', error:null});
      return true;
    }).catch(function(err){
      delete pjQueue[attId];
      /* Dossier supprimé à la main sur Drive : on oublie les dossiers mémorisés et on recommence une fois. */
      if(!retried && err && err.code==='tool_error' && /not ?found|introuvable|404/i.test(err.message||'')){
        driveForgetFolders();
        var cur = state.tasks.find(function(x){ return x.id===taskId; });
        if(cur && cur.driveFolderId) recordSet('task', Object.assign({}, cur, {driveFolderId:null}));
        return uploadTaskAttachment(taskId, attId, fileOrNull, true);
      }
      taskAttachUpdate(taskId, attId, {status: err && err.code==='no_local' ? 'missing' : 'pending', error: (err && (err.message||err.code)) || 'échec'});
      return false;
    });
  }
  var pjSweepRunning = false;
  function processPendingAttachments(){
    if(!state.mcpReady || pjSweepRunning || (navigator.onLine === false)) return Promise.resolve();
    var todo = [];
    state.tasks.forEach(function(t){ (t.attachments||[]).forEach(function(a){ if(a.id && !a.driveFileId && a.local && a.status!=='missing') todo.push([t.id, a.id]); }); });
    if(!todo.length) return Promise.resolve();
    pjSweepRunning = true;
    return todo.reduce(function(p, it){ return p.then(function(){ return uploadTaskAttachment(it[0], it[1]); }); }, Promise.resolve())
      .then(function(){ pjSweepRunning = false; }, function(){ pjSweepRunning = false; });
  }
  window.addEventListener('online', function(){ setTimeout(processPendingAttachments, 1500); });
  setInterval(processPendingAttachments, 60000);
  function openTaskAttachment(taskId, attId){
    var t = state.tasks.find(function(x){ return x.id===taskId; });
    var a = t && (t.attachments||[]).find(function(x){ return x.id===attId; });
    if(!a) return;
    pjReadLocal(attId).then(function(file){
      if(file){ var url = URL.createObjectURL(file); window.open(url, '_blank', 'noopener'); setTimeout(function(){ URL.revokeObjectURL(url); }, 60000); return; }
      if(a.driveUrl){ window.open(a.driveUrl, '_blank', 'noopener'); return; }
      toast("Ce fichier n'est pas disponible sur cet appareil et n'a pas encore été envoyé sur Drive.");
    });
  }
  function removeTaskAttachment(taskId, idx){
    var t = state.tasks.find(function(x){ return x.id===taskId; });
    if(!t) return;
    var a = (t.attachments||[])[idx]; if(!a) return;
    var nt = Object.assign({}, t, {attachments:(t.attachments||[]).slice()});
    nt.attachments.splice(idx, 1);
    recordSet('task', nt);
    if(a.id) pjDeleteLocal(a.id);
    if(a.assetId) removeAsset(a.assetId);
    if(a.driveFileId && state.mcpReady) mcpCall('trash_file', {fileId:a.driveFileId}).catch(function(){});
  }
  function fmtSize(n){ n = +n||0; return n >= 1048576 ? (Math.round(n/104857.6)/10)+' Mo' : n >= 1024 ? Math.round(n/1024)+' Ko' : n ? n+' o' : ''; }
  function attachStatusHtml(a){
    if(a.driveFileId) return '<span style="color:var(--done);font-size:11px;">✓ sur Drive</span>';
    if(a.status==='uploading') return '<span style="color:var(--accent);font-size:11px;">↑ envoi…</span>';
    if(a.status==='missing') return '<span style="color:var(--danger);font-size:11px;">⚠ fichier absent de cet appareil</span>';
    if(a.error) return '<span style="color:var(--warn);font-size:11px;" title="'+esc(a.error)+'">⏳ en attente (nouvel essai automatique)</span>';
    return '<span style="color:var(--ink-faint);font-size:11px;">⏳ en attente d\'envoi'+(state.mcpReady?'':' (Drive non connecté)')+'</span>';
  }
  function taskAttachmentsHtml(t){
    var list = t.attachments || [];
    var html = '<div class="section-label" style="margin-top:14px;">Pièces jointes'+(list.length?' ('+list.length+')':'')+'</div>';
    if(t.driveFolderId) html += '<p style="font-size:11.5px;margin:2px 0 6px;"><a href="'+esc(driveFolderUrl(t.driveFolderId))+'" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">'+ICONS.ext+' Ouvrir le dossier Drive de la tâche</a></p>';
    html += '<div id="taskAttachList">'+(list.length ? list.map(function(a, i){
      var legacy = !a.id && a.assetId;
      return '<div class="attach-row"><span class="t" style="white-space:normal;"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(a.titre)+'</span>'+
        '<span style="font-size:11px;color:var(--ink-faint);">'+esc(fmtSize(a.size))+(a.size?' · ':'')+'</span>'+(legacy ? (a.driveUrl?'<span style="color:var(--done);font-size:11px;">✓ sur Drive</span>':'') : attachStatusHtml(a))+'</span>'+
        (legacy ? '<a href="'+assetUrl(a.assetId)+'" target="_blank" rel="noopener" class="icon-btn" style="width:30px;height:30px;">'+ICONS.ext+'</a>'
                : '<button class="icon-btn" data-opentaskattach="'+esc(a.id)+'" type="button" style="width:30px;height:30px;" title="Ouvrir">'+ICONS.ext+'</button>')+
        '<button class="icon-btn" data-rmtaskattach="'+i+'" type="button" style="width:30px;height:30px;color:var(--danger);" title="Retirer">'+ICONS.trash+'</button></div>';
    }).join('') : '<div class="empty" style="padding:14px 10px;">Aucune pièce jointe.</div>')+'</div>'+
      '<button class="addline" id="btnAddTaskAttach" type="button">'+ICONS.upload+' Joindre des fichiers</button>'+
      '<p style="font-size:11px;color:var(--ink-faint);margin:4px 2px 0;">Tout type de fichier, plusieurs à la fois. Ils sont rangés sur Google Drive dans le dossier de la tâche (Tâches › année › type › tâche › Pièces jointes)'+(state.mcpReady?'.':' dès que Drive est connecté.')+'</p>';
    return html;
  }

  function googleDocEditUrl(fileId){ return 'https://docs.google.com/document/d/'+fileId+'/edit'; }
  /* Pour un document généré à la volée (bilan, historique) — donc sans enregistrement persistant où
     accrocher un bouton durable comme dans l'éditeur de document — le lien Google Docs est affiché
     directement dans la bannière de statut, laissée visible (au lieu de disparaître après quelques
     secondes) pour laisser le temps de cliquer dessus. */
  function showGdocLink(statusEl, gdocUrl){
    if(!statusEl) return;
    statusEl.hidden = false;
    statusEl.innerHTML = 'Document Word enregistré. <a href="'+esc(gdocUrl)+'" target="_blank" rel="noopener" style="font-weight:600;">Personnaliser sur Google Docs →</a>';
  }
  function pushJsonBackup(folderId){
    if(!folderId) return Promise.resolve();
    /* assetsIndex ne contient jamais dataUrl (potentiellement lourd, et déjà sur Drive) : seulement le
       driveFileId de chaque image déjà téléversée (voir uploadAssetToDrive), pour qu'un autre appareil
       sache où la retélécharger (voir mergeRemoteBackupIntoLocal + fetchAssetFromDrive) sans jamais
       faire grossir cette sauvegarde JSON avec le contenu binaire des photos. */
    var assetsIndex = {};
    Object.keys(state.assets).forEach(function(id){
      var a = state.assets[id];
      if(a && a.driveFileId) assetsIndex[id] = {driveFileId:a.driveFileId, driveUrl:a.driveUrl||'', type:a.type||'', name:a.name||''};
    });
    var data = {
      exportedAt: nowIso(), zones: state.zones, etablissements: state.etablissements,
      enseignants: state.enseignants, tasks: state.tasks, documents: state.documents, vacances: state.vacances, templates: state.templates,
      regionsMaroc: state.regionsMaroc, regionsMarocUpdatedAt: state.regionsMarocUpdatedAt, assetsIndex: assetsIndex,
      programmeAnnuel: state.programmeAnnuel,
      /* Sans cette ligne, la configuration du lien Google Form (voir ficheFormSet/defaultFicheForm et
         la fusion correspondante dans mergeRemoteBackupIntoLocal, qui lit déjà remote.ficheForm) ne
         quittait jamais cet appareil : elle restait absente de la sauvegarde JSON poussée sur Drive, et
         ne pouvait donc jamais être retrouvée sur un autre appareil malgré le code de fusion déjà en
         place côté lecture. */
      ficheForm: state.ficheForm,
      /* Voir mergeTombstones/mergeById : sans cela, un enregistrement supprimé ici mais encore présent
         dans une copie plus ancienne sur un autre appareil serait repris comme « nouveau » par cet
         appareil au lieu de disparaître à son tour. */
      tombstones: state.tombstones
    };
    return mcpCall('create_file', {
      title: 'sauvegarde-donnees.json', textContent: JSON.stringify(data, null, 2), contentMimeType:'application/json',
      parentId: folderId, disableConversionToGoogleType:true
    }).then(function(res){
      var payload = res.payload || {};
      var newId = payload.id, oldId = state.config.backupFileId;
      var p = (newId && oldId && newId!==oldId) ? mcpCall('trash_file', {fileId:oldId}).catch(function(){}) : Promise.resolve();
      return p.then(function(){ return configSet({ backupFileId: newId || oldId, lastBackupAt: nowIso() }); });
    }).catch(function(err){ console.warn('backup error', err); });
  }
  /* Recherche un fichier par titre dans un dossier donné — utilisé pour retrouver la sauvegarde JSON
     même depuis un appareil qui ne l'a jamais poussée lui-même (son id local en cache,
     state.config.backupFileId, n'existe que sur l'appareil qui l'a créée). */
  function findFileByTitle(folderId, title){
    if(!folderId) return Promise.resolve(null);
    var q = "title = '"+title.replace(/'/g,"\\'")+"' and '"+folderId+"' in parents";
    return mcpCall('search_files', {query:q, pageSize:5, excludeContentSnippets:true}).then(function(res){
      var files = (res.payload && res.payload.files) || [];
      return files.length ? files[0] : null;
    });
  }
  /* Télécharge et lit la sauvegarde JSON existante dans le dossier « Sauvegardes », si elle existe —
     c'est ce qui permet à zones/établissements/enseignants/documents/référentiel/modèles d'être
     réellement synchronisés entre plusieurs appareils (auparavant cette sauvegarde n'était écrite
     que dans un sens, jamais relue par l'app elle-même). */
  function pullJsonBackup(folderId){
    if(!folderId) return Promise.resolve(null);
    return findFileByTitle(folderId, 'sauvegarde-donnees.json').then(function(file){
      if(!file) return null;
      return mcpCall('download_file_content', {fileId: file.id}).then(function(res){
        var payload = res.payload || {};
        if(!payload.content) return null;
        try{ return JSON.parse(b64ToUtf8(payload.content)); }catch(e){ return null; }
      });
    }).catch(function(){ return null; });
  }
  /* Fusionne une sauvegarde distante téléchargée dans l'état local : zones/établissements/
     enseignants/documents par enregistrement (le plus récent par id, comme les tâches via
     mergeById) ; référentiel régions/DP et modèles de documents en bloc, à la dernière modification
     la plus récente. Les tâches, elles, sont déjà fusionnées séparément via la feuille CSV. */
  function mergeRemoteBackupIntoLocal(remote){
    if(!remote) return;
    /* Les tombstones voyagent avec la sauvegarde JSON (voir pushJsonBackup) : on les fusionne D'ABORD
       (union par id, date de suppression la plus récente conservée — voir mergeTombstones) pour que
       les suppressions faites sur un autre appareil soient déjà connues au moment d'appliquer
       mergeById juste après, sur cet appareil-ci comme sur celui qui a supprimé. */
    var remoteTomb = remote.tombstones || {};
    ['tasks','zones','etablissements','enseignants','documents','vacances'].forEach(function(coll){
      state.tombstones[coll] = mergeTombstones(state.tombstones[coll]||{}, remoteTomb[coll]||{});
    });
    saveLocal('tombstones');
    /* Filet de sécurité pour les tâches : la fusion tâches↔CSV a déjà eu lieu plus tôt dans doSync (le
       tombstone d'un autre appareil, reçu seulement maintenant via la sauvegarde JSON, n'a donc pas pu
       s'y appliquer). On enlève ici toute tâche déjà connue comme supprimée par ce tombstone tout
       juste fusionné, pour ne pas attendre encore une synchronisation supplémentaire. */
    var tt = state.tombstones.tasks;
    if(Object.keys(tt).length){
      var keptTasks = state.tasks.filter(function(t){
        var td = tt[t.id]; return !(td && new Date(td).getTime() >= new Date(t.updatedAt||0).getTime());
      });
      if(keptTasks.length !== state.tasks.length){ state.tasks = keptTasks; saveLocal('tasks'); }
    }
    ['zones','etablissements','enseignants','documents','vacances'].forEach(function(coll){
      if(Array.isArray(remote[coll])){ state[coll] = mergeById(state[coll], remote[coll], state.tombstones[coll]); saveLocal(coll); }
    });
    if(Array.isArray(remote.regionsMaroc) && remote.regionsMarocUpdatedAt &&
       (!state.regionsMarocUpdatedAt || new Date(remote.regionsMarocUpdatedAt) > new Date(state.regionsMarocUpdatedAt))){
      state.regionsMaroc = remote.regionsMaroc; state.regionsMarocUpdatedAt = remote.regionsMarocUpdatedAt; saveLocal('regionsMaroc');
    }
    if(remote.templates && remote.templates.updatedAt &&
       (!state.templates.updatedAt || new Date(remote.templates.updatedAt) > new Date(state.templates.updatedAt))){
      var rp = remote.templates;
      state.templates = { entete: rp.entete||DEFAULT_ENTETE, criteres: rp.criteres||DEFAULT_CRITERES.slice(),
        profil: Object.assign({}, DEFAULT_PROFIL, rp.profil||{}), docTemplates: rp.docTemplates||{}, updatedAt: rp.updatedAt };
      saveLocal('templates');
    }
    /* N'apprend ici que l'EMPLACEMENT Drive de chaque photo (driveFileId) — jamais son contenu : les
       octets réels ne sont téléchargés qu'à la demande, au moment où l'image est effectivement affichée
       (voir assetUrl → fetchAssetFromDrive), pour ne jamais alourdir la synchronisation elle-même. */
    if(remote.assetsIndex){
      var assetsChanged = false;
      Object.keys(remote.assetsIndex).forEach(function(id){
        var ra = remote.assetsIndex[id], la = state.assets[id];
        if(!la){ state.assets[id] = {dataUrl:'', type:ra.type||'', name:ra.name||'', driveFileId:ra.driveFileId, driveUrl:ra.driveUrl||''}; assetsChanged = true; }
        else if(!la.driveFileId && ra.driveFileId){ la.driveFileId = ra.driveFileId; la.driveUrl = ra.driveUrl||''; assetsChanged = true; }
      });
      if(assetsChanged) saveLocal('assets');
    }
    /* Programme annuel de travail : document singleton (comme profil/templates), fusionné en bloc
       à la dernière modification la plus récente — jamais fusionné champ par champ. */
    if(remote.programmeAnnuel && remote.programmeAnnuel.updatedAt &&
       (!state.programmeAnnuel || !state.programmeAnnuel.updatedAt || new Date(remote.programmeAnnuel.updatedAt) > new Date(state.programmeAnnuel.updatedAt))){
      state.programmeAnnuel = remote.programmeAnnuel;
      state.programmeAnnuel.attachments = state.programmeAnnuel.attachments || [];
      saveLocal('programmeAnnuel');
    }
    /* Configuration du lien Google Form / feuille de réponses : même principe de fusion singleton
       « le plus récent l'emporte » que le programme annuel — voir ficheFormSet(). */
    if(remote.ficheForm && remote.ficheForm.updatedAt &&
       (!state.ficheForm || !state.ficheForm.updatedAt || new Date(remote.ficheForm.updatedAt) > new Date(state.ficheForm.updatedAt))){
      state.ficheForm = Object.assign(defaultFicheForm(), remote.ficheForm);
      saveLocal('ficheForm');
    }
    render();
  }
  function doSync(){
    if(!state.config.sheetFileId){ openSettings(); return; }
    state.syncing = true; state.syncError = null; render();
    var folderRef = null, sheetFileId = state.config.sheetFileId;
    ensureAppFolder().catch(function(){ return null; }).then(function(folder){
      folderRef = folder;
      /* Comme pullJsonBackup le fait déjà pour la sauvegarde JSON (voir findFileByTitle juste en
         dessous) : on retrouve TOUJOURS la feuille de tâches ACTUELLE par son titre dans le dossier,
         plutôt que de se fier à l'id mis en cache localement (state.config.sheetFileId). Cet id
         devient périmé dès qu'un AUTRE appareil synchronise avant celui-ci, puisque chaque
         synchronisation crée une nouvelle feuille et met l'ancienne à la corbeille (voir plus bas) :
         un appareil qui garderait l'ancien id continuerait à lire une copie figée au moment de SA
         dernière synchronisation (toujours accessible en lecture même corbeillée, donc sans erreur
         visible) au lieu de la copie à jour — ses propres tâches seraient bien poussées à chaque
         synchronisation, mais dans une copie devenue parallèle et isolée, jamais revue par les autres
         appareils ni mise à jour avec leurs changements. C'était exactement le bug rapporté : « les
         tâches sur un appareil restent uniquement en local ». */
      var lookup = folder ? findFileByTitle(folder.id, state.config.sheetTitle || SHEET_TITLE) : Promise.resolve(null);
      return lookup.then(function(found){
        if(found && found.id) sheetFileId = found.id;
        var move = (folder && sheetFileId && state.config.sheetParentId !== folder.id)
          ? mcpCall('update_file', {fileId: sheetFileId, parentId: folder.id}).catch(function(){})
          : Promise.resolve();
        return move;
      });
    })
    .then(function(){
      return mcpCall('download_file_content', {fileId: sheetFileId, exportMimeType:'text/csv'});
    })
      .then(function(res){
        var payload = res.payload || {};
        var csv = payload.content ? b64ToUtf8(payload.content) : '';
        var remote = csvToTasks(csv);
        var merged = mergeById(state.tasks, remote, state.tombstones.tasks);
        return persistMergedLocally(merged).then(function(){ return merged; });
      })
      .then(function(merged){
        var csv = tasksToCSV(merged);
        return mcpCall('create_file', {
          title: state.config.sheetTitle || 'Tâches - Carnet Inspection',
          textContent: csv, contentMimeType: 'text/csv',
          parentId: (folderRef && folderRef.id) || state.config.sheetParentId || undefined
        });
      })
      .then(function(createRes){
        var payload = createRes.payload || {};
        var newId = payload.id;
        var oldId = sheetFileId;
        var p = newId ? mcpCall('trash_file', {fileId: oldId}).catch(function(){}) : Promise.resolve();
        return p.then(function(){
          return configSet({ sheetFileId: newId || oldId, sheetTitle: payload.title || state.config.sheetTitle,
            sheetParentId: payload.parentId || (folderRef && folderRef.id) || state.config.sheetParentId, lastSyncAt: nowIso() });
        });
      })
      .then(function(){
        /* Échange automatique avec InspectApp (Paramètres → InspectApp), en meilleur effort : un
           nouveau fichier d'InspectApp est proposé à l'import, puis l'état du carnet est redéposé. */
        if(!state.config.xchAuto || !folderRef) return;
        return xchDrivePull(false).then(function(){ return xchDrivePush(); }).catch(function(e){ console.warn('échange InspectApp', e); });
      })
      .then(function(){
        if(!folderRef) return Promise.resolve();
        /* La sauvegarde JSON est maintenant une vraie synchronisation à double sens : on la
           télécharge et on la fusionne dans l'état local (zones, établissements, enseignants,
           documents, référentiel régions/DP, modèles) AVANT de repousser la version fusionnée —
           c'est ce qui rend ces données réellement disponibles sur plusieurs appareils, comme les
           tâches le sont déjà via la feuille CSV. */
        return ensureBackupFolder(folderRef.id).catch(function(){ return null; })
          .then(function(bf){
            var bid = bf ? bf.id : folderRef.id;
            return pullJsonBackup(bid).then(function(remote){
              mergeRemoteBackupIntoLocal(remote);
              /* Meilleur effort : rattrape les photos/logos pas encore envoyés sur Drive (ex. ajoutés
                 avant la connexion Drive, ou avant l'ajout de cette synchronisation des images) — pour
                 qu'ils figurent, eux aussi, dans la sauvegarde JSON poussée juste après et deviennent
                 ainsi accessibles depuis les autres appareils connectés au même compte Google. */
              var backfill = Object.keys(state.assets).map(function(id){ return uploadAssetToDrive(id); });
              return Promise.all(backfill).then(function(){ return pushJsonBackup(bid); });
            });
          });
      })
      .then(function(){ state.syncing = false; render(); toast('Synchronisation réussie.'); })
      .catch(function(err){ console.warn('sync error', err); state.syncing = false; state.syncError = mcpErrorMessage(err); render(); });
  }
  /* Fusion générique par id : conserve, pour chaque enregistrement, la version dont updatedAt est
     la plus récente (locale ou distante) — utilisée aussi bien pour les tâches (via la feuille CSV)
     que pour zones/établissements/enseignants/documents (via la sauvegarde JSON, voir doSync).
     tomb (optionnel) : {id: dateISOdeSuppression} — voir state.tombstones/mergeTombstones. Une simple
     absence locale ne suffit pas à représenter une suppression : sans ce repère daté, un enregistrement
     supprimé ici mais encore présent dans une sauvegarde distante pas tout à fait à jour serait repris
     tel quel par la boucle ci-dessous (branche « !l ») et RESSUSCITÉ. Le tombstone tranche : si la
     suppression est plus récente (ou aussi récente) que la version choisie (locale ou distante),
     l'enregistrement reste supprimé ; si une modification plus récente que la suppression arrive d'un
     autre appareil, elle l'emporte (cohérent avec la règle « le plus récent gagne » déjà appliquée aux
     modifications). */
  function mergeById(local, remote, tomb){
    tomb = tomb || {};
    var byId = {}; local.forEach(function(t){ byId[t.id] = t; });
    remote.forEach(function(r){
      var l = byId[r.id];
      if(!l){ byId[r.id] = r; return; }
      var lt = new Date(l.updatedAt||0).getTime(), rt = new Date(r.updatedAt||0).getTime();
      if(rt > lt) byId[r.id] = r;
    });
    Object.keys(byId).forEach(function(id){
      var td = tomb[id]; if(!td) return;
      var chosenAt = new Date(byId[id].updatedAt||0).getTime();
      if(new Date(td).getTime() >= chosenAt) delete byId[id];
    });
    return Object.keys(byId).map(function(k){ return byId[k]; });
  }
  /* Fusion des tombstones eux-mêmes entre deux appareils (union, en gardant la date de suppression
     la plus récente par id) — c'est ce qui permet à une suppression faite sur un appareil de finir
     par « rattraper » un autre appareil qui possédait encore une copie de l'enregistrement et ne
     savait pas qu'il avait été supprimé ailleurs. */
  function mergeTombstones(local, remote){
    var out = Object.assign({}, local||{});
    Object.keys(remote||{}).forEach(function(id){
      if(!out[id] || new Date(remote[id]).getTime() > new Date(out[id]).getTime()) out[id] = remote[id];
    });
    return out;
  }
  function persistMergedLocally(merged){
    state.tasks = merged; saveLocal('tasks'); render();
    return Promise.resolve();
  }
  function openSettings(){ state.modalStack.push({type:'settings', tab:'sync'}); render(); }
  function createSheet(){
    state.setupBusy = true; state.setupError = null; render();
    /* Même en cliquant sur « Créer une nouvelle feuille », on vérifie d'abord qu'aucune n'existe
       déjà dans le dossier (créée depuis un autre appareil) : mieux vaut la retrouver et la lier
       que de créer un doublon isolé qui ne se synchroniserait jamais avec l'autre. */
    ensureAppFolder().catch(function(){ return null; }).then(function(folder){
      return folder ? ensureSheetFile(folder)
        : mcpCall('create_file', {title:SHEET_TITLE, textContent:objectsToCSV(CSV_HEADERS,[]), contentMimeType:'text/csv'})
            .then(function(res){ return {file:(res.payload||{}), created:true}; });
    })
      .then(function(r){
        return configSet({ sheetFileId: r.file.id, sheetTitle: r.file.title || SHEET_TITLE, sheetParentId: r.file.parentId || null, lastSyncAt: null }).then(function(){ return r; });
      })
      .then(function(r){
        state.setupBusy = false; render();
        toast(r.created ? 'Feuille créée dans le dossier Drive de l\'application.' : 'Une feuille existait déjà dans ce dossier — elle a été liée au lieu d\'en créer une nouvelle.');
        doSync();
      })
      .catch(function(err){ state.setupBusy = false; state.setupError = mcpErrorMessage(err); render(); });
  }

  function downloadDriveDoc(file){
    mcpCall('download_file_content', {fileId: file.id}).then(function(res){
      var payload = res.payload || {};
      if(!payload.content){ toast('Contenu introuvable.'); return; }
      var bin = atob(payload.content);
      var bytes = new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      var ext = (file.fileExtension) ? file.fileExtension : (file.title.split('.').pop()||'bin');
      var name = /\.[a-zA-Z0-9]{2,4}$/.test(file.title) ? file.title : (file.title+'.'+ext);
      saveBlob(name, new Blob([bytes])).then(function(){ toast('Téléchargement enregistré.'); });
    }).catch(function(err){ toast(mcpErrorMessage(err)); });
  }

  /* ================= sélecteur d'enseignant(e)s : filtre établissement → enseignant =================
     Sélecteur unique utilisé partout où l'on choisit un(e) enseignant(e) (tâches, invité(e)s des
     réunions pédagogiques/cours expérimentaux, tableaux de service du bordereau, liste de présence…) :
     on choisit d'abord l'établissement (liste déroulante avec le nombre d'enseignant(e)s), et la liste
     se réduit aussitôt à cet établissement ; une recherche (nom, PPR, matière) affine encore. Deux
     modes :
       - simple (opts.onPick(r)) : toucher un nom le sélectionne et ferme ;
       - multiple (opts.onPickMany(liste)) : cases à cocher conservées quand on change d'établissement
         ou de recherche (on peut donc inviter des enseignant(e)s de plusieurs établissements), boutons
         « tout cocher / tout décocher » sur la liste affichée, puis « Valider ».
     opts.etabId pré-sélectionne un établissement (ex. celui déjà choisi dans la tâche) ;
     opts.selectedIds pré-coche des enseignant(e)s (mode multiple). */
  function openEnsPicker(opts){
    opts = opts || {};
    var sel = {}; (opts.selectedIds||[]).forEach(function(id){ if(id) sel[id] = true; });
    var etabId = opts.etabId && state.etablissements.some(function(x){ return x.id===opts.etabId; }) ? opts.etabId : '';
    state.ensPick = { multi: !!opts.multi, etabId: etabId, q: '', selected: sel, title: opts.title||'',
      onPick: opts.onPick||null, onPickMany: opts.onPickMany||null };
    pushModal({type:'ensPicker'});

  function etabIdByName(nom){

  function ensPickFiltered(){
    var p = state.ensPick || {};

    return state.enseignants.filter(function(e){
      if(p.etabId==='__none__'){ if(e.etablissementId && etabName(e.etablissementId)) return false; }
      else if(p.etabId && e.etablissementId!==p.etabId) return false;
      if(!q) return true;
      return [e.nom, e.ppr, e.matiere, e.cycle].some(function(v){ return String(v||'').toLowerCase().indexOf(q)>=0; });
    }).sort(function(a,b){ return (a.nom||'').localeCompare(b.nom||''); });

      var etObs = task.etablissementId ? state.etablissements.find(function(x){ return x.id===task.etablissementId; }) : null;
      base.seance = 'normale';

         convocation avec la date, l'heure et le lieu. Pour une visite ou une inspection, le courrier
         informe seulement la direction : l'enseignant(e) concerné(e) n'est pas prévenu(e) (pratique de

      base.notesObs = ''; base.texte = ''; base.redacteur = offProfil().nomSignature || '';

       chacun de ces champs — chacun reste ensuite librement modifiable comme n'importe quel texte, y

    var tmpl = (state.templates.docTemplates||{})[type];

    return fetch(OFF_IMAGES[key]).then(function(r){ if(!r.ok) throw new Error('img'); return r.blob(); }).then(function(blob){

    if(!xchTotal(dry)){ toast('Rien de nouveau à importer depuis '+origin+'.'); return false; }
    var from = data.source==='inspectapp' ? 'InspectApp' : (data.source || 'le fichier');
    if(!confirm('Importer les données de '+from+(data.exportedAt ? ' (exportées le '+fmtDate(data.exportedAt)+')' : '')+' ?\n\n'+xchReportText(dry)+'\n\nAucune donnée locale ne sera supprimée.')) return false;
    var r = applyExchange(data, false);
    configSet({ xchLastImport: nowIso() });
    toast('Import terminé — '+xchTotal(r)+' élément(s) ajouté(s) ou mis à jour.');
    return true;
  }
  function exportExchangeFile(){
    var data = buildExchangePayload();
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    return saveBlob('Echange_Carnet_vers_InspectApp_'+todayStr()+'.json', blob).then(function(){ configSet({ xchLastExport: nowIso() }); toast('Fichier d\'échange enregistré : ouvrez-le dans InspectApp (Importer depuis le Carnet).'); });
  }
  function importExchangeFile(file){
    if(!file) return;
    file.text().then(function(txt){
      var data; try{ data = JSON.parse(txt.replace(/^﻿/, '')); }catch(e){ throw new Error('Fichier illisible (JSON attendu).'); }
      importExchangeData(data, 'le fichier');
    }).catch(function(e){ toast(e && e.message ? e.message : 'Import impossible.'); });
  }
  /* ---- via Google Drive ---- */
  function xchDriveFolder(){ return ensureAppFolder().then(function(f){ return ensureSubfolder(f.id, XCH_FOLDER, 'xchFolderId'); }); }
  function xchFindFile(folderId, name){
    var q = "title = '"+name.replace(/'/g,"\\'")+"' and '"+folderId+"' in parents";
    return mcpCall('search_files', {query:q, pageSize:5, excludeContentSnippets:true}).then(function(res){ return ((res.payload && res.payload.files) || [])[0] || null; });
  }
  function xchDrivePush(){
    var json = JSON.stringify(buildExchangePayload(), null, 2);
    return xchDriveFolder().then(function(folder){
      return xchFindFile(folder.id, XCH_FILE_OUT).then(function(f){
        if(f) return driveFetch(DRIVE_UPLOAD_API+'/'+f.id+'?uploadType=media', { method:'PATCH', headers:{'Content-Type':'application/json; charset=UTF-8'}, body: json });
        return mcpCall('create_file', { title: XCH_FILE_OUT, textContent: json, contentMimeType:'application/json', parentId: folder.id, disableConversionToGoogleType:true });
      });
    }).then(function(){ return configSet({ xchLastPush: nowIso() }); });
  }
  function xchDrivePull(force){
    return xchDriveFolder().then(function(folder){
      return xchFindFile(folder.id, XCH_FILE_IN).then(function(f){
        if(!f) return { none:true };
        if(!force && state.config.xchLastPullModified && f.modifiedTime && f.modifiedTime===state.config.xchLastPullModified) return { same:true };
        return mcpCall('download_file_content', { fileId: f.id }).then(function(res){
          var data = JSON.parse(b64ToUtf8(res.payload.content).replace(/^﻿/, ''));
          var done = importExchangeData(data, 'InspectApp (Drive)');
          return configSet({ xchLastPullModified: f.modifiedTime || '' }).then(function(){ return { imported: done }; });
        });
      });
    });
  }
  function xchDriveSync(btn){
    if(!state.mcpReady){ toast('Connectez d\'abord Google Drive (Paramètres → Synchronisation).'); return; }
    if(btn) btn.disabled = true;
    xchDrivePull(true).then(function(r){
      if(r && r.none) toast('Aucun fichier d\'InspectApp pour l\'instant dans « '+XCH_FOLDER+' ». Envoi des données du carnet…');
      return xchDrivePush();
    }).then(function(){ toast('Échange avec InspectApp terminé (Google Drive).'); render(); })
      .catch(function(e){ console.warn('xch drive', e); toast(e && e.code ? mcpErrorMessage(e) : 'Échange Drive impossible : '+(e && e.message || e)); })
      .then(function(){ if(btn) btn.disabled = false; });
  }

  function translitWordToAr(w){
    var src = w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if(!src) return '';
    var map = [['ch','ش'],['sh','ش'],['kh','خ'],['gh','غ'],['dj','ج'],['th','ت'],['ou','و'],['oo','و'],['aa','ع'],['ss','س'],['tt','ت'],['ll','ل'],['mm','م'],['nn','ن'],['rr','ر'],['bb','ب'],['dd','د'],['ff','ف'],['kk','ك'],['zz','ز'],['pp','ب'],

    var out = '', i = 0;
    while(i < src.length){
      var rest = src.slice(i), c = src[i], first = i===0, last = false, hit = null;
      if('aeiouy'.indexOf(c) >= 0 && !(c==='o' && src[i+1]==='u') && !(c==='y')){

        if(c==='a' && src[i+1]==='a'){ out += first ? 'ع' : 'ع'; i += 2; continue; }
        if(first) out += (c==='i' || c==='e') ? 'إ' : 'ا';
        if(c==='i') out += (first ? '' : 'ي');
        else if(c==='o' || c==='u') out += 'و';
        else if(c==='a' && isLast && src.length > 3) out += 'ة';
        else if(c==='a' && isLast) out += 'ا';
        else if(c==='e' && isLast) {}

      }
      for(var k=0;k<map.length;k++){ if(rest.indexOf(map[k][0])===0){ hit = map[k]; break; } }
      if(hit){ out += hit[1]; i += hit[0].length; } else { out += c; i++; }
    }
    return out;
  }
  /* Translittération arabe → latin. */
  function translitWordToFr(w){
    var m = { 'ا':'a','أ':'a','إ':'i','آ':'a','ب':'b','ت':'t','ث':'t','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'d','ر':'r','ز':'z','س':'s','ش':'ch','ص':'s','ض':'d','ط':'t','ظ':'d','ع':'a','غ':'gh','ف':'f','ق':'k','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','ة':'a','و':'ou','ي':'i','ى':'a','ء':'','ؤ':'ou','ئ':'i','گ':'g','ڭ':'g','ﻻ':'la' };
    var pref = '';
    if(/^ال/.test(w) && w.length > 3){ pref = 'El '; w = w.slice(2); }
    var out = '', chars = Array.from(w);
    chars.forEach(function(ch, i){
      var v = m[ch]; if(v==null) v = /[ً-ْـ]/.test(ch) ? '' : ch;
      // voyelle de liaison entre deux consonnes
      var prev = out.slice(-1);
      if(v && i>0 && /[bcdfghjklmnpqrstvwxz]$/.test(out) && /^[bcdfghjklmnpqrstvwxz]/.test(v) && !(prev==='c' && v[0]==='h')) out += 'a';
      if(v==='s' && /[aeiou]$/.test(out) && i < chars.length-1) v = 'ss';
      out += v;
    });
    out = out.replace(/^ou/, 'Ou');
    out = out.charAt(0).toUpperCase() + out.slice(1);
    return pref + out;
  }

    var blocks = [

    function annex(title, list, withObs){
      var rr = [{ cells:[ C([P([R('المؤسسة',{b:true})],{align:'center', size:11})]), C([P([R('اسم الأستاذ(ة)',{b:true})],{align:'center', size:11})]), C([P([R('رقم التأجير',{b:true})],{align:'center', size:11})]) ]

      });

    return { type:'bordereau', rtl:true, margin:15, size:11, fontCss:"Arial,'Traditional Arabic',sans-serif", fontDocx:'Arial', blocks: blocks };

  /* ---- Lettre d'information (رسالة إخبارية) ---- */
  function offLettre(d, task){
    var pf = offProfil();

      : ['إلى السيد '+dest];
    var corps = String(d.corps||'').trim();
    if(corps && !/^و?بعد/.test(corps)) corps = 'وبعد، '+corps;
    var bodyParas = paragraphsOf(corps).map(function(t){ return P(t, {align:'justify', size:16, indent:10, after:4, line:1.15}); });

    ].concat(destLines.map(function(l, i){ return P([R(l,{b:true})], {size: i===0 ? 18 : 16, align:'center'}); })).concat([
      P([R('الموضوع: ',{b:true}), R(d.objet||'',{b:true})], {size:17, align:'center', before:12, after:12, title:true}),

    if(d.invites && d.invites.length){

      d.invites.forEach(function(iv){ var ensRec = findEns(iv.enseignantId, iv.nom); rr.push({ cantSplit:true, cells:[ C([P(ensNameLang('ar', iv.enseignantId, iv.nom||''),{size:13})]), C([P(iv.ppr||'',{size:13, align:'center'})]), C([P(etabNameLang('ar', ensRec && ensRec.etablissementId, iv.etablissementNom||''),{size:13})]) ] }); });
      blocks.push(P([R('الأساتذة المدعوون',{b:true})], {size:14, before:8, after:4}));
      blocks.push({ t:'table', border:true, cols:[40,20,40], rows: rr });

      { t:'table', border:false, cols:[50,50], rows:[ { cells:[ C([P('')]), C([P([R('مفتش '+matiere,{b:true})],{size:15, align:'center'}), P([R('التعليم '+cycle,{b:true})],{size:15, align:'center'}), {t:'sigimg', align:'center'},
        d.date ? P(fmtDate(d.date), {size:13, align:'center'}) : P('')]) ] } ] }
    ]);

      P([R(pf.piedPageAr || 'ص ب: 187 طريق المنزل. الهاتف: 0535661490 - الفاكس: 0535661492 - البريد الإلكتروني: dpmenfpsefrou2017@gmail.com',{b:true})], {size:10, align:'center'})
    ];
    return { type:'lettre_information', rtl:true, margin:16, size:16, fontCss:"'Sakkal Majalla','Traditional Arabic','Amiri',serif", fontDocx:'Sakkal Majalla', blocks: blocks, footer: footer };

  /* ---- Demande de voiture de service (طلب سيارة المصلحة) ----
     Même présentation que la رسالة إخبارية ; le texte ne nomme ni l'enseignant(e) ni l'établissement
     visités (seulement la date, l'heure et, si on le souhaite, une destination générale). */
  function demandeVoitureCorps(d){
    if(d.corpsLibre && d.corpsLibre.trim()) return d.corpsLibre;
    return 'يشرفني أن ألتمس منكم التفضل بوضع سيارة المصلحة رهن إشارتي يوم '+dateLongueAr(d.date)+
      (d.heureDepart ? ' ابتداء من الساعة '+d.heureDepart : '')+(d.heureRetour ? ' إلى غاية الساعة '+d.heureRetour : '')+
      '، وذلك قصد القيام بمهمة تربوية'+(d.destination && d.destination.trim() ? ' '+(/[\u0600-\u06FF]/.test(d.destination) ? 'ب' : 'بـ')+bidiIso(d.destination.trim()) : '')+'.';
  }
  function offDemandeVoiture(d, task){
    var off = offLettre({ destinataire: d.destinataire, objet: d.objet || 'طلب سيارة المصلحة', corps: demandeVoitureCorps(d), date: d.date, invites: [] }, task);
    off.type = 'demande_voiture';
    return off;
  }
  /* Modèle officiel du document, ou null pour les types qui gardent le rendu générique. */
  function buildOfficialDoc(d, task){ var off = buildOfficialDocInner(d, task); if(off) applyDocFonts(off); return off; }
  function buildOfficialDocInner(d, task){
    if(d.type==='observation'){
      if(d.variante==='sefrou') return offObservationSefrou(d, task);
      if(d.variante==='pionnier_ordinaire' || d.variante==='pionnier_synthese') return offObservationPionnier(d, task);
      return null;
    }
    if(d.type==='rapport_inspection') return offRapportInspection(d, task);
    if(d.type==='bordereau') return offBordereau(d, task);
    if(d.type==='lettre_information') return offLettre(d, task);
    if(d.type==='demande_voiture') return offDemandeVoiture(d, task);
    return null;
  }

  /* ================= print ================= */
  function printHTML(bodyHtml, rtl){
    $('printRoot').innerHTML = '<div class="p-page" dir="'+(rtl?'rtl':'ltr')+'" lang="'+(rtl?'ar':'fr')+'">'+bodyHtml+'</div>';
    setTimeout(function(){ window.print(); }, 60);
  }
  function printHead(titre, meta, photoUrl){
    return '<div class="p-head">'+(photoUrl?'<img class="photo" src="'+photoUrl+'" alt="">':'')+'<div class="org">'+esc(state.templates.entete)+'</div><h1>'+esc(titre)+'</h1></div>'+
      '<div class="p-meta">'+meta.map(function(m){ return '<span><b>'+esc(m[0])+' :</b> '+esc(m[1]||'—')+'</span>'; }).join('')+'</div>';
  }

  function printFromSpec(spec){ printHTML(specToHtml(spec), !!spec.rtl); }
  function specToHtml(spec){
    var html = printHead(spec.titre, spec.meta, spec.photoAssetId ? assetUrl(spec.photoAssetId) : '');
    var chartsHtml = (spec.charts||[]).map(function(ch){ return '<div class="p-section" style="break-inside:avoid;"><h3>'+esc(ch.heading)+'</h3><img src="'+ch.dataUrl+'" alt="" style="display:block;width:'+Math.min(100, Math.round(ch.w/340*82))+'%;margin:0 auto;"></div>'; }).join('');
    var chartsAfterFirst = !!(spec.tables && spec.tables[0] && spec.tables[0].heading==='Indicateurs');
    if(!chartsAfterFirst) html += chartsHtml;
    (spec.tables||[]).forEach(function(tb, ti){
      if(tb.heading) html += '<div class="p-section"><h3>'+esc(tb.heading)+'</h3></div>';
      html += '<table class="p-table"><thead><tr>'+tb.headers.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')+'</tr></thead><tbody>';
      (tb.rows.length ? tb.rows : [tb.headers.map(function(){ return '—'; })]).forEach(function(r){ html += '<tr>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; });
      html += '</tbody></table>';
      if(ti===0 && chartsAfterFirst) html += chartsHtml;
    });
    (spec.sections||[]).forEach(function(sec){
      html += '<div class="p-section">'+(sec.heading?'<h3>'+esc(sec.heading)+'</h3>':'')+'<p style="white-space:pre-line;">'+esc(sec.text||'—')+'</p></div>';
    });
    if(spec.signatures && spec.signatures.length) html += '<div class="p-sign">'+spec.signatures.map(function(s){ return '<span>'+esc(s)+'</span>'; }).join('')+'</div>';
    return html;
  }
  function doPrint(){
    var d = state.draftDoc, task = state.tasks.find(function(t){ return t.id===d.taskId; });
    var off = buildOfficialDoc(d, task);
    if(off){ printOfficial(off); return; }
    printFromSpec(buildDocSpec(d, task));
  }

  /* ================= génération de fichiers PDF / Word ================= */
  function buildDocSpecInner(d, task){
    if(d.type==='presence'){
      return { rtl:true, titre:'لائحة الحضور', meta:[['المؤسسة',d.lieu],['التاريخ',fmtDate(d.date)],['الموضوع',d.objet]],
        tables:[{headers:['#','الاسم الكامل','الصفة','التوقيع'], rows:(d.participants||[]).map(function(p,i){ return [String(i+1), p.nom||'', p.fonction||'', '']; })}],
        sections:[], signatures:null };
    }
    if(d.type==='compte_rendu'){
      var sections = [{heading:'جدول الأعمال', text:d.ordreJour||'—'},{heading:'النقط التي تمت مناقشتها', text:d.pointsDiscutes||'—'},{heading:'القرارات المتخذة', text:d.decisions||'—'}];
      var tables = [];
      if((d.actions||[]).length) tables.push({heading:'خطة العمل', headers:['الإجراء','المسؤول','الأجل'], rows:d.actions.map(function(a){ return [a.action||'', a.responsable||'', fmtDate(a.echeance)]; })});
      return { rtl:true, titre:'محضر اجتماع', meta:[['المؤسسة',d.lieu],['التاريخ',fmtDate(d.date)],['الحاضرون',d.presents]], tables:tables, sections:sections,
        signatures:['رئيس(ة) الجلسة','كاتب(ة) الجلسة'] };
    }
    if(d.type==='observation'){
      var obsVariante = d.variante || 'standard';
      if(obsVariante==='pionnier_ordinaire' || obsVariante==='pionnier_synthese'){
        var scaleHeaders = ['Critères et indicateurs d\'évaluation'].concat(OBS_PIONNIER_SCALE);
        var domTables = (d.domaines||[]).map(function(dom){
          return { heading: dom.nom, headers: scaleHeaders, rows: dom.criteres.map(function(c){
            return [c.nom].concat(OBS_PIONNIER_SCALE.map(function(lvl){ return c.note===lvl ? 'X' : ''; }));
          }) };
        });
        return { titre:"Grille d'observation — Collège pionnier ("+(OBS_VARIANTE_LABEL[obsVariante]||'')+")",
          meta:[['Enseignant(e)',d.enseignantNom],['Établissement',task?task.etablissementNom:''],['Classe',d.classe],['Matière',d.matiere],['Date',fmtDate(d.date)],['Durée',d.duree]],
          tables: domTables,
          sections:[{heading:"Appréciations d'ensemble et orientations", text:d.appreciationGlobale||'—'}],
          signatures:["Signature de l'inspecteur(trice)","Signature de l'enseignant(e)"] };
      }
      return { titre:"Grille d'observation de séance", meta:[['Enseignant(e)',d.enseignantNom],['Établissement',task?task.etablissementNom:''],['Classe',d.classe],['Matière',d.matiere],['Date',fmtDate(d.date)],['Durée',d.duree]],
        tables:[{headers:['Critère','Appréciation','Commentaire'], rows:(d.criteres||[]).map(function(c){ return [c.nom, c.note||'—', c.commentaire||'']; })}],
        sections:[{heading:'Points forts', text:d.pointsForts||'—'},{heading:"Axes d'amélioration", text:d.axesAmelioration||'—'},{heading:'Synthèse', text:d.synthese||'—'}],
        signatures:["Signature de l'inspecteur(trice)","Signature de l'enseignant(e)"] };
    }
    if(d.type==='rapport'){
      return { titre:'Rapport de synthèse', meta:[['Objet',task?task.titre:d.titre],['Établissement',task?task.etablissementNom:''],['Date',fmtDate(d.date)]],
        tables:[], sections:[{heading:null, text:d.texte||'—'}], signatures:null };
    }
    if(d.type==='attestation'){
      var texteAttest = d.texteLibre ? d.texteLibre : ('يشهد الموقع(ة) أسفله، مفتش(ة) تربوي(ة)، بأن السيد(ة) '+(d.beneficiaireNom||'')+'، '+(d.fonction||'')+'، قد حضر(ت) '+(d.objet||(task?task.titre:''))+' بتاريخ '+fmtDate(d.date)+(d.lieu?' ب'+d.lieu:'')+'.');
      return { rtl:true, titre:'شهادة حضور', meta:[['المؤسسة',d.lieu],['التاريخ',fmtDate(d.date)],['الموضوع',d.objet]],
        tables:[], sections:[{heading:null, text:texteAttest}],
        signatures:['توقيع المفتش(ة)'] };
    }
    if(d.type==='lettre_information'){
      var invTables = (d.invites && d.invites.length) ? [{heading:'الأساتذة المدعوون', headers:['الاسم الكامل','PPR','المؤسسة'],
        rows: d.invites.map(function(iv){ return [iv.nom||'', iv.ppr||'', iv.etablissementNom||'']; })}] : [];
      return { rtl:true, titre:'رسالة إخبارية', meta:[['المرسل إليه',d.destinataire],['الموضوع',d.objet],['التاريخ',fmtDate(d.date)]],
        tables:invTables, sections:[{heading:null, text:d.corps||'—'}], signatures:['توقيع المفتش(ة)'] };
    }
    if(d.type==='demande_voiture'){
      return { rtl:true, titre:'طلب سيارة المصلحة', meta:[['المرسل إليه',arDestinataire(d.destinataire)],['التاريخ',fmtDate(d.date)]],
        tables:[], sections:[{heading:null, text:demandeVoitureCorps(d)}], signatures:['توقيع المفتش(ة)'] };
    }
    if(d.type==='rapport_inspection'){
      return { titre:"Rapport d'inspection", meta:[['Enseignant(e)',d.enseignantNom],['Établissement',d.lieu],['Classe',d.classe],['Matière',d.matiere],['Date',fmtDate(d.date)],['Appréciation générale',d.appreciation||'—']],
        tables:[], sections:[{heading:'Constats', text:d.constats||'—'},{heading:'Recommandations', text:d.recommandations||'—'}],
        signatures:["Signature de l'inspecteur(trice)","Signature de l'enseignant(e)"] };
    }
    if(d.type==='bordereau'){
      var bordTables = [{headers:['بيان الوثائق','العدد'], rows:(d.pieces||[]).map(function(p){ return [p.designation||'', p.nombre||'']; })}];
      if((d.tableauxValides||[]).length){
        bordTables.push({heading:'جداول الحصص المصادق عليها', headers:['المؤسسة','اسم الأستاذ(ة)','الرقم التربوي (PPR)'],

            .map(function(r){ return [r.etablissement||'', r.enseignant||'', r.ppr||'']; })});
      }
      if((d.tableauxNonValides||[]).length){
        bordTables.push({heading:'جداول الحصص غير المصادق عليها', headers:['المؤسسة','اسم الأستاذ(ة)','الرقم التربوي (PPR)','الملاحظات'],
          rows: d.tableauxNonValides.slice().sort(function(a,b){ return (a.etablissement||'').localeCompare(b.etablissement||''); })
            .map(function(r){ return [r.etablissement||'', r.enseignant||'', r.ppr||'', r.observation||'']; })});
      }
      return { rtl:true, titre:'بيان إرسال الوثائق', meta:[['المرسل إليه',d.destinataire],['المرجع',d.reference||'—'],['التاريخ',fmtDate(d.date)],['الموضوع',d.objet]],
        tables:bordTables,

    if(d.type==='plan_action'){
      return { rtl:true, titre:'خطة العمل', meta:[['المؤسسة',d.lieu],['التاريخ',fmtDate(d.date)],['الموضوع',d.objet]],
        tables: (d.actions||[]).length ? [{heading:'الإجراءات', headers:['الإجراء','المسؤول','الأجل'], rows:d.actions.map(function(a){ return [a.action||'', a.responsable||'', fmtDate(a.echeance)]; })}] : [],
        sections:[{heading:'السياق', text:d.contexte||'—'},{heading:'الأهداف', text:d.objectifs||'—'}],
        signatures:['توقيع المفتش(ة)'] };
